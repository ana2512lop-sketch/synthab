<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthAB</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0A0A0F; color:#E8E6FF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    input,select,textarea,button { font-family:inherit; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const ACCENT = "#6C63FF";
const ACCENT2 = "#00D4AA";
const STEPS = ["Datos","Perfiles","Test A/B","Simulacion","Resultados"];
const AVATARS = ["#6C63FF","#00D4AA","#FF6B9D","#F5A623","#4ECDC4"];

const s = {
  header: { borderBottom:"1px solid #1E1E2E", padding:"16px 28px", display:"flex", alignItems:"center", justifyContent:"space-between", background:"#0D0D14" },
  logo: { fontSize:"15px", fontWeight:"600", color:"#fff", display:"flex", alignItems:"center", gap:"8px" },
  dot: { width:"8px", height:"8px", borderRadius:"50%", background:ACCENT2 },
  stepBar: { display:"flex", background:"#0D0D14", borderBottom:"1px solid #1E1E2E", overflowX:"auto" },
  main: { maxWidth:"700px", margin:"0 auto", padding:"36px 20px" },
  card: { background:"#13131F", border:"1px solid #1E1E2E", borderRadius:"12px", padding:"18px 20px", marginBottom:"12px" },
  title: { fontSize:"21px", fontWeight:"600", color:"#fff", margin:"0 0 5px" },
  sub: { fontSize:"13px", color:"#6B6B9A", margin:"0 0 24px", lineHeight:"1.6" },
  label: { fontSize:"12px", color:"#6B6B9A", marginBottom:"5px", display:"block", fontWeight:"500" },
  inp: { width:"100%", background:"#0A0A14", border:"1px solid #2A2A3E", borderRadius:"8px", padding:"9px 11px", color:"#E8E6FF", fontSize:"13px", outline:"none", boxSizing:"border-box" },
  ta: { width:"100%", background:"#0A0A14", border:"1px solid #2A2A3E", borderRadius:"8px", padding:"9px 11px", color:"#E8E6FF", fontSize:"13px", outline:"none", boxSizing:"border-box", resize:"vertical", minHeight:"75px" },
  sel: { width:"100%", background:"#0A0A14", border:"1px solid #2A2A3E", borderRadius:"8px", padding:"9px 11px", color:"#E8E6FF", fontSize:"13px", outline:"none", boxSizing:"border-box" },
  btn: { background:ACCENT, color:"#fff", border:"none", borderRadius:"8px", padding:"10px 20px", fontSize:"13px", fontWeight:"600", cursor:"pointer" },
  btnG: { background:ACCENT2, color:"#000", border:"none", borderRadius:"8px", padding:"10px 20px", fontSize:"13px", fontWeight:"600", cursor:"pointer" },
  btnO: { background:"transparent", color:"#8B8BCC", border:"1px solid #2A2A3E", borderRadius:"8px", padding:"9px 16px", fontSize:"13px", cursor:"pointer" },
  btnRow: { display:"flex", justifyContent:"flex-end", gap:"10px", marginTop:"20px" },
  spin: { width:"30px", height:"30px", border:"3px solid #1E1E2E", borderTop:"3px solid "+ACCENT, borderRadius:"50%", animation:"spin 0.8s linear infinite", margin:"0 auto 12px" },
  pCard: { background:"#0D0D18", border:"1px solid #1E1E2E", borderRadius:"10px", padding:"12px 14px", marginBottom:"8px" },
  attrG: { display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"5px" },
  attr: { background:"#13131F", borderRadius:"6px", padding:"4px 7px" },
  mRow: { display:"flex", alignItems:"center", gap:"10px", padding:"8px 0", borderBottom:"1px solid #1A1A2E" },
  iRow: { display:"flex", gap:"8px", alignItems:"flex-start", padding:"7px 0", borderBottom:"1px solid #1A1A2E", fontSize:"13px", color:"#9B99CC", lineHeight:"1.6" },
  sRow: { display:"flex", alignItems:"center", gap:"8px", padding:"7px 0", borderBottom:"1px solid #1A1A2E", fontSize:"12px", color:"#9B99CC" },
  winner: { background:"linear-gradient(135deg,#0D2520,#0D1535)", border:"1px solid rgba(0,212,170,0.2)", borderRadius:"12px", padding:"18px 20px", marginBottom:"18px", display:"flex", alignItems:"center", gap:"14px" },
  tag: function(c) { return { fontSize:"11px", fontWeight:"600", padding:"2px 8px", borderRadius:"20px", background:c==="green"?"#0D2E22":c==="amber"?"#2E1E05":c==="purple"?"#1A1535":"#1E1E2E", color:c==="green"?ACCENT2:c==="amber"?"#F5A623":c==="purple"?ACCENT:"#6B6B9A" }; },
  av: function(c) { return { width:"30px", height:"30px", borderRadius:"50%", background:c, display:"flex", alignItems:"center", justifyContent:"center", fontSize:"10px", fontWeight:"700", color:"#fff", flexShrink:0 }; },
  upload: function(d) { return { border:"1.5px dashed "+(d?ACCENT2:"#2A2A3E"), borderRadius:"10px", padding:"24px", textAlign:"center", cursor:"pointer", background:d?"#0D1F1C":"#0A0A14" }; }
};

function Spinner(props) {
  return React.createElement("div", {style:{textAlign:"center",padding:"36px"}},
    React.createElement("div", {style:s.spin}),
    React.createElement("p", {style:{color:"#6B6B9A",fontSize:"13px"}}, props.text)
  );
}

function StepBar(props) {
  return React.createElement("div", {style:s.stepBar},
    STEPS.map(function(st, i) {
      return React.createElement("div", {
        key:st,
        style:{padding:"12px 16px",fontSize:"12px",fontWeight:"500",
          color:i<props.cur?ACCENT2:i===props.cur?"#fff":"#4A4A6A",
          borderBottom:i===props.cur?"2px solid "+ACCENT:"2px solid transparent",
          whiteSpace:"nowrap"}
      }, (i<props.cur?"checkmark ":"")+(i+1)+". "+st);
    })
  );
}

async function callClaude(apiKey, messages, system) {
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:system,messages:messages})
  });
  var data = await res.json();
  if (!data.content) throw new Error("API error: " + JSON.stringify(data));
  return data.content.map(function(b){return b.text||"";}).join("");
}

function parseJSON(raw) {
  var clean = raw.split("```json").join("").split("```").join("").trim();
  var s1 = clean.indexOf("["), s2 = clean.indexOf("{");
  if(s1!==-1 && (s2===-1||s1<s2)) return JSON.parse(clean.slice(s1,clean.lastIndexOf("]")+1));
  return JSON.parse(clean.slice(s2,clean.lastIndexOf("}")+1));
}

function ApiScreen(props) {
  var [key,setKey] = useState("");
  var [err,setErr] = useState("");
  var [loading,setLoading] = useState(false);

  async function verify() {
    if(!key.startsWith("sk-ant-")){setErr("Debe empezar por sk-ant-");return;}
    setLoading(true);setErr("");
    try {
      var res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:10,messages:[{role:"user",content:"hi"}]})
      });
      if(res.ok) props.onReady(key);
      else setErr("Clave invalida. Compruebala en console.anthropic.com");
    } catch(e) { setErr("Error de conexion."); }
    setLoading(false);
  }

  return (
    <div style={{maxWidth:"440px",margin:"0 auto",padding:"48px 20px"}}>
      <div style={{textAlign:"center",marginBottom:"28px"}}>
        <div style={{fontSize:"28px",marginBottom:"10px"}}>⬡</div>
        <p style={{...s.title,textAlign:"center"}}>SynthAB</p>
        <p style={{...s.sub,textAlign:"center"}}>A/B testing con usuarios sinteticos</p>
      </div>
      <div style={s.card}>
        <label style={s.label}>Clave API de Anthropic</label>
        <input style={{...s.inp,fontFamily:"monospace",fontSize:"12px"}} type="password" placeholder="sk-ant-api03-..." value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&verify()}/>
        {err&&<p style={{color:"#FF6B6B",fontSize:"12px",marginTop:"7px"}}>{err}</p>}
        <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"9px",lineHeight:"1.6"}}>Consiguela en <a href="https://console.anthropic.com" target="_blank" style={{color:ACCENT}}>console.anthropic.com</a> - API Keys</p>
      </div>
      <button style={{...s.btn,width:"100%",opacity:key.length>10?1:0.4}} disabled={key.length<10||loading} onClick={verify}>{loading?"Verificando...":"Entrar"}</button>
    </div>
  );
}

function StepData(props) {
  var [drag,setDrag] = useState(false);
  var [content,setContent] = useState("");
  var [name,setName] = useState("");
  var [sector,setSector] = useState("moda");
  var [mode,setMode] = useState("upload");
  var [manual,setManual] = useState("");
  var ref = useRef();

  function handleFile(f) {
    if(!f)return;
    setName(f.name);
    var r=new FileReader();
    r.onload=function(e){setContent(e.target.result);};
    r.readAsText(f);
  }

  function ejemplo() {
    setContent("edad,genero,dispositivo,ciudad,canal,cvr\n18-24,mujer,mobile,Madrid,Instagram,0.028\n25-34,mujer,mobile,Madrid,Organico,0.041\n25-34,hombre,desktop,Barcelona,Google Ads,0.038\n35-44,mujer,desktop,Valencia,Email,0.058\n45-54,mujer,desktop,Sevilla,Email,0.061\n55+,hombre,desktop,Madrid,Directo,0.021");
    setName("datos_ejemplo.csv");
  }

  var ok = content||manual;
  return (
    <div>
      <p style={s.title}>Datos del cliente</p>
      <p style={s.sub}>Carga el export de GA4 o usa datos de ejemplo.</p>
      <div style={s.card}>
        <label style={s.label}>Sector</label>
        <select style={s.sel} value={sector} onChange={e=>setSector(e.target.value)}>
          <option>moda</option><option>hogar</option><option>electronica</option><option>belleza</option><option>alimentacion</option><option>deporte</option>
        </select>
      </div>
      <div style={s.card}>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          <button onClick={()=>setMode("upload")} style={{...s.btnO,borderColor:mode==="upload"?ACCENT:"#2A2A3E"}}>Subir CSV</button>
          <button onClick={()=>setMode("manual")} style={{...s.btnO,borderColor:mode==="manual"?ACCENT:"#2A2A3E"}}>Pegar datos</button>
        </div>
        {mode==="upload"
          ? <div style={s.upload(drag)} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}} onClick={()=>ref.current.click()}>
              <input ref={ref} type="file" accept=".csv,.txt" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
              <div style={{fontSize:"22px",marginBottom:"7px"}}>📂</div>
              {name?<p style={{color:ACCENT2,fontWeight:"600",fontSize:"13px"}}>{name}</p>:<p style={{fontSize:"13px",color:"#6B6B9A"}}>Arrastra CSV o haz clic</p>}
            </div>
          : <textarea style={{...s.ta,minHeight:"100px"}} value={manual} onChange={e=>setManual(e.target.value)} placeholder="edad,genero,dispositivo,ciudad,canal,cvr"/>
        }
        <button onClick={ejemplo} style={{...s.btnO,marginTop:"10px",fontSize:"12px",padding:"6px 12px"}}>Usar datos de ejemplo</button>
      </div>
      <div style={s.btnRow}>
        <button style={{...s.btn,opacity:ok?1:0.4}} disabled={!ok} onClick={()=>props.onNext({data:content||manual,sector:sector})}>Generar perfiles</button>
      </div>
    </div>
  );
}

function StepPerfiles(props) {
  var [loading,setLoading] = useState(false);
  var [profiles,setProfiles] = useState(null);
  var [n,setN] = useState(20);
  var [err,setErr] = useState("");

  async function generar() {
    setLoading(true);setErr("");
    try {
      var prompt = "Analiza estos datos de un ecommerce de "+props.input.sector+":\n\n"+props.input.data+"\n\nGenera exactamente "+n+" perfiles sinteticos que respeten las distribuciones. Devuelve SOLO un array JSON con campos: id, edad, genero, ciudad, dispositivo, madurez(1-5), canal, tipo(nuevo/recurrente), prob_conversion(0.01-0.12), initials(2 letras mayusculas). Ejemplo: [{\"id\":\"001\",\"edad\":\"25-34\",\"genero\":\"mujer\",\"ciudad\":\"Madrid\",\"dispositivo\":\"mobile\",\"madurez\":4,\"canal\":\"Instagram\",\"tipo\":\"recurrente\",\"prob_conversion\":0.041,\"initials\":\"MG\"}]";
      var raw = await callClaude(props.apiKey,[{role:"user",content:prompt}],"Eres experto en analitica web. Responde en español. Devuelve SOLO JSON valido sin texto extra ni markdown.");
      setProfiles(parseJSON(raw));
    } catch(e) { setErr("Error generando perfiles: "+e.message); }
    setLoading(false);
  }

  if(loading) return <Spinner text="Generando perfiles con IA..."/>;

  if(profiles) return (
    <div>
      <p style={s.title}>Perfiles sinteticos</p>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
        <span style={s.tag("green")}>{profiles.length} perfiles generados</span>
        <button style={{...s.btnO,fontSize:"11px",padding:"4px 9px"}} onClick={()=>setProfiles(null)}>Regenerar</button>
      </div>
      <div style={{maxHeight:"360px",overflowY:"auto",marginBottom:"12px"}}>
        {profiles.slice(0,8).map(function(p,i){return (
          <div key={p.id} style={s.pCard}>
            <div style={{display:"flex",alignItems:"center",gap:"9px",marginBottom:"9px"}}>
              <div style={s.av(AVATARS[i%5])}>{p.initials||"P"+(i+1)}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:"13px",fontWeight:"600",color:"#E8E6FF"}}>Perfil #{p.id}</div>
                <div style={{fontSize:"11px",color:"#6B6B9A"}}>{p.edad} - {p.genero} - {p.tipo}</div>
              </div>
              <span style={s.tag(p.prob_conversion>0.05?"green":"amber")}>CVR {(p.prob_conversion*100).toFixed(1)}%</span>
            </div>
            <div style={s.attrG}>
              {[["Ciudad",p.ciudad],["Dispositivo",p.dispositivo],["Canal",p.canal],["Madurez",p.madurez+"/5"]].map(function(kv){return(
                <div key={kv[0]} style={s.attr}>
                  <div style={{fontSize:"10px",color:"#4A4A6A"}}>{kv[0]}</div>
                  <div style={{fontSize:"12px",color:"#C8C6FF",fontWeight:"500"}}>{kv[1]}</div>
                </div>
              );})}
            </div>
          </div>
        );})}
        {profiles.length>8&&<p style={{fontSize:"12px",color:"#4A4A6A",textAlign:"center",padding:"7px"}}>+{profiles.length-8} perfiles mas</p>}
      </div>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={props.onBack}>Atras</button>
        <button style={s.btn} onClick={()=>props.onNext(profiles)}>Configurar test</button>
      </div>
    </div>
  );

  return (
    <div>
      <p style={s.title}>Perfiles sinteticos</p>
      <p style={s.sub}>La IA crea usuarios que respetan las distribuciones reales.</p>
      <div style={s.card}>
        <label style={s.label}>Numero de perfiles</label>
        <select style={s.sel} value={n} onChange={e=>setN(Number(e.target.value))}>
          <option value={10}>10 perfiles (prueba rapida)</option>
          <option value={20}>20 perfiles (recomendado)</option>
          <option value={50}>50 perfiles (mas representativo)</option>
        </select>
        {err&&<p style={{color:"#FF6B6B",fontSize:"12px",marginTop:"7px"}}>{err}</p>}
      </div>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={props.onBack}>Atras</button>
        <button style={s.btn} onClick={generar}>Generar</button>
      </div>
    </div>
  );
}

function StepTest(props) {
  var [hip,setHip] = useState("");
  var [pag,setPag] = useState("pagina de producto");
  var [varA,setVarA] = useState("");
  var [varB,setVarB] = useState("");
  var [met,setMet] = useState("tasa de conversion");
  var [split,setSplit] = useState(50);
  var ok = varA&&varB&&hip;

  return (
    <div>
      <p style={s.title}>Configurar test A/B</p>
      <p style={s.sub}>Define la hipotesis y las dos variantes.</p>
      <div style={s.card}>
        <label style={s.label}>Hipotesis</label>
        <textarea style={s.ta} value={hip} onChange={e=>setHip(e.target.value)} placeholder="Creemos que [cambio] aumentara [metrica] porque [razon]..."/>
      </div>
      <div style={s.card}>
        <label style={s.label}>Pagina testada</label>
        <select style={s.sel} value={pag} onChange={e=>setPag(e.target.value)}>
          <option>pagina de producto</option><option>homepage</option><option>checkout</option><option>categoria</option><option>carrito</option>
        </select>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"12px"}}>
        <div style={s.card}>
          <div style={{marginBottom:"9px"}}><span style={s.tag("purple")}>Variante A - Control</span></div>
          <label style={s.label}>Descripcion</label>
          <input style={s.inp} value={varA} onChange={e=>setVarA(e.target.value)} placeholder="Ej: Boton azul Anadir al carrito"/>
        </div>
        <div style={s.card}>
          <div style={{marginBottom:"9px"}}><span style={s.tag("green")}>Variante B - Cambio</span></div>
          <label style={s.label}>Descripcion</label>
          <input style={s.inp} value={varB} onChange={e=>setVarB(e.target.value)} placeholder="Ej: Boton verde Comprar ahora"/>
        </div>
      </div>
      <div style={s.card}>
        <label style={s.label}>Metrica principal</label>
        <select style={s.sel} value={met} onChange={e=>setMet(e.target.value)}>
          <option>tasa de conversion</option><option>clics en CTA</option><option>tasa de rebote</option><option>tiempo en pagina</option>
        </select>
        <div style={{marginTop:"12px"}}>
          <label style={s.label}>Split: A {split}% / B {100-split}%</label>
          <input type="range" min="10" max="90" step="5" value={split} onChange={e=>setSplit(Number(e.target.value))} style={{width:"100%",accentColor:ACCENT}}/>
        </div>
      </div>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={props.onBack}>Atras</button>
        <button style={{...s.btn,opacity:ok?1:0.4}} disabled={!ok} onClick={()=>props.onNext({hipotesis:hip,pagina:pag,varA:varA,varB:varB,metrica:met,split:split})}>Lanzar simulacion</button>
      </div>
    </div>
  );
}

function StepSim(props) {
  var [loading,setLoading] = useState(false);
  var [done,setDone] = useState(false);
  var [res,setRes] = useState(null);
  var [err,setErr] = useState("");

  async function simular() {
    setLoading(true);setErr("");
    try {
      var sample = props.profiles.slice(0,15).map(function(p){return {id:p.id,edad:p.edad,genero:p.genero,dispositivo:p.dispositivo,madurez:p.madurez,canal:p.canal,prob_conversion:p.prob_conversion};});
      var prompt = "Simula test A/B sobre "+sample.length+" perfiles de ecommerce de "+props.input.sector+". HIPOTESIS: "+props.test.hipotesis+". PAGINA: "+props.test.pagina+". VARIANTE A: "+props.test.varA+". VARIANTE B: "+props.test.varB+". METRICA: "+props.test.metrica+". SPLIT: "+props.test.split+"% A / "+(100-props.test.split)+"% B. PERFILES: "+JSON.stringify(sample)+". Devuelve SOLO este JSON: {\"ganador\":\"B\",\"confianza\":94,\"uplift_cvr\":11.4,\"cvr_a\":3.4,\"cvr_b\":3.8,\"clics_cta_a\":14,\"clics_cta_b\":18,\"rebote_a\":44,\"rebote_b\":41,\"segmentos\":[{\"nombre\":\"18-24\",\"resultado\":\"B gana\",\"diff_pct\":22}],\"razones_abandono\":[\"razon 1\",\"razon 2\"],\"insights\":[\"insight 1\",\"insight 2\"],\"recomendacion\":\"texto\"}";
      var raw = await callClaude(props.apiKey,[{role:"user",content:prompt}],"Eres motor de simulacion A/B. Responde en espanol. SOLO JSON valido.");
      setRes(parseJSON(raw));setDone(true);
    } catch(e) { setErr("Error en simulacion: "+e.message); }
    setLoading(false);
  }

  if(loading) return <Spinner text={"Simulando "+props.profiles.length+" agentes..."}/>;

  if(done) return (
    <div>
      <p style={{fontSize:"12px",color:ACCENT2,marginBottom:"14px"}}>Simulacion completada</p>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={props.onBack}>Atras</button>
        <button style={s.btn} onClick={()=>props.onNext(res)}>Ver resultados</button>
      </div>
    </div>
  );

  return (
    <div>
      <p style={s.title}>Simulacion</p>
      <p style={s.sub}>Los agentes navegan las variantes y deciden segun su perfil.</p>
      <div style={s.card}>
        <p style={{fontSize:"13px",color:"#9B99CC",margin:"0 0 12px",lineHeight:"1.6"}}>{props.profiles.length} agentes distribuidos entre variante A y B.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}}>
          <div style={{background:"#0A0A14",borderRadius:"8px",padding:"11px 13px",border:"1px solid rgba(108,99,255,0.2)"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:ACCENT,marginBottom:"3px"}}>Variante A</div>
            <div style={{fontSize:"13px",color:"#C8C6FF"}}>{props.test.varA}</div>
          </div>
          <div style={{background:"#0A0A14",borderRadius:"8px",padding:"11px 13px",border:"1px solid rgba(0,212,170,0.2)"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:ACCENT2,marginBottom:"3px"}}>Variante B</div>
            <div style={{fontSize:"13px",color:"#C8C6FF"}}>{props.test.varB}</div>
          </div>
        </div>
        {err&&<p style={{color:"#FF6B6B",fontSize:"12px"}}>{err}</p>}
        <div style={s.btnRow}>
          <button style={s.btnO} onClick={props.onBack}>Atras</button>
          <button style={s.btn} onClick={simular}>Lanzar</button>
        </div>
      </div>
    </div>
  );
}

function StepResultados(props) {
  var r = props.results;
  var t = props.test;
  var gB = r.ganador==="B";
  var IC = [ACCENT2,"#F5A623","#FF6B6B"];

  function copy() {
    navigator.clipboard.writeText("RESULTADOS TEST A/B - SynthAB\n\nGanador: Variante "+r.ganador+"\nUplift CVR: "+(r.uplift_cvr>0?"+":"")+Number(r.uplift_cvr).toFixed(1)+"%\nConfianza: "+r.confianza+"%\n\nA: "+t.varA+"\nB: "+t.varB+"\n\nRecomendacion: "+r.recomendacion);
    alert("Copiado al portapapeles");
  }

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"18px",flexWrap:"wrap",gap:"8px"}}>
        <div>
          <p style={{...s.title,marginBottom:"3px"}}>Resultados</p>
          <p style={{fontSize:"12px",color:"#4A4A6A"}}>{t.varA} vs {t.varB}</p>
        </div>
        <button style={{...s.btnO,fontSize:"12px",padding:"6px 12px"}} onClick={copy}>Copiar resultados</button>
      </div>
      <div style={s.winner}>
        <div style={{width:"44px",height:"44px",borderRadius:"50%",background:"rgba(0,212,170,0.1)",border:"1px solid rgba(0,212,170,0.3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:0}}>🏆</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"15px",fontWeight:"700",color:ACCENT2,marginBottom:"2px"}}>Variante {r.ganador} gana — {r.ganador==="B"?t.varB:t.varA}</div>
          <div style={{fontSize:"12px",color:"#4A8A70"}}>{r.confianza}% confianza estadistica</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:"24px",fontWeight:"700",color:gB?ACCENT2:"#FF6B6B"}}>{r.uplift_cvr>0?"+":""}{Number(r.uplift_cvr).toFixed(1)}%</div>
          <div style={{fontSize:"11px",color:"#4A6A5A"}}>uplift CVR</div>
        </div>
      </div>
      <div style={s.card}>
        <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 6px"}}>Metricas</p>
        {[
          {name:"Tasa de conversion",a:r.cvr_a!=null?r.cvr_a.toFixed(1)+"%":"—",b:r.cvr_b!=null?r.cvr_b.toFixed(1)+"%":"—",diff:r.uplift_cvr,pos:gB},
          {name:"Clics CTA",a:(r.clics_cta_a||0)+"%",b:(r.clics_cta_b||0)+"%",diff:(((r.clics_cta_b-r.clics_cta_a)/(r.clics_cta_a||1))*100).toFixed(1),pos:r.clics_cta_b>r.clics_cta_a},
          {name:"Tasa rebote",a:(r.rebote_a||0)+"%",b:(r.rebote_b||0)+"%",diff:(((r.rebote_b-r.rebote_a)/(r.rebote_a||1))*100).toFixed(1),pos:r.rebote_b<r.rebote_a}
        ].map(function(m){return (
          <div key={m.name} style={s.mRow}>
            <span style={{fontSize:"13px",color:"#9B99CC",flex:1}}>{m.name}</span>
            <span style={{fontSize:"13px",color:"#6B6B9A"}}>A: {m.a}</span>
            <span style={{fontSize:"14px",fontWeight:"600",color:"#fff"}}>B: {m.b}</span>
            <span style={{fontSize:"11px",fontWeight:"700",padding:"2px 8px",borderRadius:"20px",background:m.pos?"#0D2E22":"#2E0D0D",color:m.pos?ACCENT2:"#FF6B6B"}}>{m.diff>0?"+":""}{Number(m.diff).toFixed(1)}%</span>
          </div>
        );})}
      </div>
      {r.segmentos&&r.segmentos.length>0&&(
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 6px"}}>Por segmento</p>
          {r.segmentos.map(function(sg){return (
            <div key={sg.nombre} style={s.sRow}>
              <span style={{minWidth:"55px",fontWeight:"600",color:"#C8C6FF"}}>{sg.nombre}</span>
              <span style={{flex:1}}>{sg.resultado}</span>
              <span style={s.tag(sg.resultado.indexOf("B")!==-1?"green":"amber")}>{sg.diff_pct>0?"+":""}{sg.diff_pct}%</span>
            </div>
          );})}
        </div>
      )}
      {r.razones_abandono&&r.razones_abandono.length>0&&(
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 6px"}}>Razones de abandono</p>
          {r.razones_abandono.map(function(ra,i){return (
            <div key={i} style={s.iRow}>
              <div style={{width:"7px",height:"7px",borderRadius:"50%",background:ACCENT,flexShrink:0,marginTop:"6px"}}/>
              {ra}
            </div>
          );})}
        </div>
      )}
      {r.insights&&r.insights.length>0&&(
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 6px"}}>Insights clave</p>
          {r.insights.map(function(ins,i){return (
            <div key={i} style={s.iRow}>
              <div style={{width:"7px",height:"7px",borderRadius:"50%",background:IC[i]||"#6B6B9A",flexShrink:0,marginTop:"6px"}}/>
              {ins}
            </div>
          );})}
        </div>
      )}
      {r.recomendacion&&(
        <div style={{background:"#1A1535",border:"1px solid rgba(108,99,255,0.2)",borderRadius:"12px",padding:"16px 18px",marginBottom:"12px",display:"flex",gap:"10px"}}>
          <div style={{fontSize:"18px",flexShrink:0}}>✦</div>
          <div>
            <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 3px"}}>Recomendacion</p>
            <p style={{fontSize:"13px",color:"#8B8BCC",margin:0,lineHeight:"1.6"}}>{r.recomendacion}</p>
          </div>
        </div>
      )}
      <div style={s.btnRow}>
        <button style={s.btnG} onClick={()=>window.location.reload()}>Nuevo test</button>
      </div>
    </div>
  );
}

function App() {
  var [apiKey,setApiKey] = useState("");
  var [step,setStep] = useState(0);
  var [dataInput,setDataInput] = useState(null);
  var [profiles,setProfiles] = useState([]);
  var [testConfig,setTestConfig] = useState(null);
  var [results,setResults] = useState(null);

  if(!apiKey) return (
    <div>
      <div style={s.header}><div style={s.logo}><div style={s.dot}/>SynthAB</div></div>
      <ApiScreen onReady={setApiKey}/>
    </div>
  );

  return (
    <div>
      <div style={s.header}>
        <div style={s.logo}><div style={s.dot}/>SynthAB<span style={{fontSize:"11px",color:"#4A4A6A",fontWeight:"400",marginLeft:"4px"}}>piloto</span></div>
        <button style={{...s.btnO,fontSize:"11px",padding:"4px 9px"}} onClick={()=>setApiKey("")}>Cambiar API key</button>
      </div>
      <StepBar cur={step}/>
      <div style={s.main}>
        {step===0&&<StepData onNext={function(d){setDataInput(d);setStep(1);}}/>}
        {step===1&&<StepPerfiles input={dataInput} apiKey={apiKey} onNext={function(p){setProfiles(p);setStep(2);}} onBack={()=>setStep(0)}/>}
        {step===2&&<StepTest onNext={function(t){setTestConfig(t);setStep(3);}} onBack={()=>setStep(1)}/>}
        {step===3&&<StepSim profiles={profiles} test={testConfig} input={dataInput} apiKey={apiKey} onNext={function(r){setResults(r);setStep(4);}} onBack={()=>setStep(2)}/>}
        {step===4&&<StepResultados results={results} test={testConfig}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
