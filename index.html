function PromptViewer({title, prompt}) {
  const [open, setOpen] = useState(false);
  const highlighted = prompt
    .replace(/\{\{[^}]+\}\}/g, m => `<span class="prompt-var">${m}</span>`)
    .replace(/\[(SECTOR|URL|VARIANTE|DATOS|PERFILES|CVR)[^\]]*\]/g, m => `<span class="prompt-key">${m}</span>`);
  return (
    <div style={{marginTop:"10px"}}>
      <div style={s.promptToggle} onClick={()=>setOpen(!open)}>
        <span style={{fontSize:"9px"}}>{open?"▼":"▶"}</span>
        <span>Ver prompt de IA — {title}</span>
      </div>
      {open && (
        <div style={{marginTop:"6px"}}>
          <div className="prompt-box" dangerouslySetInnerHTML={{__html:highlighted}}/>
          <p style={{fontSize:"10px",color:"#2A2A4A",marginTop:"4px"}}>Las variables en <span style={{color:ACCENT2}}>verde</span> se rellenan automáticamente con los datos del cliente.</p>
        </div>
      )}
    </div>
  );
}

async function callClaude(apiKey, messages, system) {
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,system:system,messages:messages})
  });
  var data = await res.json();
  if (!data.content) throw new Error(data.error ? data.error.message : "Error de API");
  return data.content.map(b=>b.text||"").join("");
}

function parseJSON(raw) {
  var clean = raw.replace(/```json/g,"").replace(/```/g,"").trim();
  var s1 = clean.indexOf("["), s2 = clean.indexOf("{");
  if(s1!==-1 && (s2===-1||s1<s2)) return JSON.parse(clean.slice(s1,clean.lastIndexOf("]")+1));
  return JSON.parse(clean.slice(s2,clean.lastIndexOf("}")+1));
}

// Leer CSV de forma robusta
function parseCSV(text) {
  // Normalizar saltos de línea y limpiar BOM
  var clean = text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
  var lines = clean.split("\n").filter(l=>l.trim());
  if(lines.length < 2) return null;
  // Detectar separador (coma o punto y coma)
  var sep = lines[0].includes(";") ? ";" : ",";
  var headers = lines[0].split(sep).map(h=>h.trim().replace(/"/g,""));
  var rows = lines.slice(1).map(function(line) {
    var vals = line.split(sep).map(v=>v.trim().replace(/"/g,""));
    var obj = {};
    headers.forEach(function(h,i){ obj[h] = vals[i]||""; });
    return obj;
  });
  return { headers, rows, raw: clean };
}

function StepData({onNext}) {
  const [drag,setDrag] = useState(false);
  const [csvData,setCsvData] = useState(null); // { headers, rows, raw }
  const [fileName,setFileName] = useState("");
  const [sector,setSector] = useState("moda");
  const [mode,setMode] = useState("upload");
  const [manual,setManual] = useState("");
  const [error,setError] = useState("");
  const ref = useRef();

  function handleFile(f) {
    if(!f) return;
    setError(""); setFileName(f.name);
    const r = new FileReader();
    r.onload = function(e) {
      const parsed = parseCSV(e.target.result);
      if(!parsed) { setError("No se pudo leer el CSV. Comprueba el formato."); return; }
      setCsvData(parsed);
    };
    r.onerror = function() { setError("Error leyendo el archivo."); };
    r.readAsText(f, "UTF-8");
  }

  function usarEjemplo() {
    const raw = CSV_EJEMPLO[sector] || CSV_EJEMPLO.default;
    const parsed = parseCSV(raw);
    setCsvData(parsed);
    setFileName("datos_ejemplo_"+sector+".csv");
    setError("");
  }

  const dataFinal = mode==="upload" ? (csvData ? csvData.raw : null) : (manual.trim() || null);
  const ok = !!dataFinal;

  return (
    <div>
      <p style={s.title}>Paso 1 — Datos del cliente</p>
      <p style={s.sub}>Carga el export de GA4 (CSV) o pega los datos manualmente. Cuantas más fuentes, mejores serán los perfiles sintéticos.</p>

      <div style={s.card}>
        <label style={s.label}>Sector del ecommerce</label>
        <select style={s.sel} value={sector} onChange={e=>setSector(e.target.value)}>
          {SECTORES.map(sec=><option key={sec.value} value={sec.value}>{sec.label}</option>)}
        </select>
      </div>

      <div style={s.card}>
        <div style={{display:"flex",gap:"8px",marginBottom:"14px"}}>
          <button onClick={()=>{setMode("upload");setError("");}} style={{...s.btnO,borderColor:mode==="upload"?ACCENT:"#2A2A3E",color:mode==="upload"?"#fff":"#8B8BCC"}}>📂 Subir CSV</button>
          <button onClick={()=>{setMode("manual");setError("");}} style={{...s.btnO,borderColor:mode==="manual"?ACCENT:"#2A2A3E",color:mode==="manual"?"#fff":"#8B8BCC"}}>✏️ Pegar datos</button>
        </div>

        {mode==="upload" ? (
          <div>
            <div style={s.upload(drag)}
              onDragOver={e=>{e.preventDefault();setDrag(true);}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
              onClick={()=>ref.current.click()}>
              <input ref={ref} type="file" accept=".csv,.txt" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
              <div style={{fontSize:"24px",marginBottom:"8px"}}>📊</div>
              {fileName
                ? <p style={{color:ACCENT2,fontWeight:"600",fontSize:"13px"}}>{fileName}</p>
                : <p style={{fontSize:"13px",color:"#6B6B9A"}}>Arrastra tu CSV de GA4 aquí o haz clic</p>
              }
              <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"5px"}}>Formatos: .csv — separador coma o punto y coma</p>
            </div>
            {csvData && (
              <div style={s.infoBox}>
                ✓ CSV leído: <strong style={{color:ACCENT2}}>{csvData.rows.length} filas</strong>, columnas: <span style={{color:"#9B99CC"}}>{csvData.headers.join(", ")}</span>
              </div>
            )}
            {error && <p style={{color:"#FF6B6B",fontSize:"12px",marginTop:"8px"}}>⚠ {error}</p>}
          </div>
        ) : (
          <div>
            <textarea style={{...s.ta,minHeight:"110px",fontFamily:"monospace",fontSize:"12px"}} value={manual} onChange={e=>setManual(e.target.value)} placeholder={`Pega aquí el CSV. Ejemplo:\nedad,genero,dispositivo,ciudad,canal,cvr\n18-24,mujer,mobile,Madrid,Instagram,0.028\n25-34,hombre,desktop,Barcelona,Organico,0.041`}/>
            <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"4px"}}>Incluye cabecera en la primera fila. La columna cvr es la tasa de conversión por segmento.</p>
          </div>
        )}

        <div style={{marginTop:"10px",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}}>
          <button onClick={usarEjemplo} style={{...s.btnO,fontSize:"12px",padding:"6px 12px"}}>Usar datos de ejemplo ({sector})</button>
          {mode==="upload" && <p style={{fontSize:"11px",color:"#3E3E5E"}}>— o —</p>}
        </div>
      </div>

      <div style={{...s.card,borderColor:"#1A1A35"}}>
        <p style={{fontSize:"12px",color:"#4A4A6A",marginBottom:"4px"}}>💡 ¿Qué datos necesito de GA4?</p>
        <p style={{fontSize:"12px",color:"#3E3E5E",lineHeight:"1.7"}}>
          Exporta desde <strong style={{color:"#6B6B9A"}}>Explorar → Exploración en blanco</strong>: añade dimensiones (edad, género, ciudad, dispositivo, canal) y métricas (sesiones, conversiones, tasa de rebote). Exporta como CSV.
        </p>
      </div>

      <div style={s.btnRow}>
        <button style={{...s.btn,opacity:ok?1:0.4}} disabled={!ok} onClick={()=>onNext({data:dataFinal,sector})}>
          Generar perfiles →
        </button>
      </div>
    </div>
  );
}

Te paso los datos de tráfico de un ecommerce de {{SECTOR}}.

Analiza estos datos y extrae:

2. Distribución de dispositivos (% mobile/desktop/tablet)
3. Comportamiento típico por segmento

5. Tasa de conversión por segmento si está disponible

DATOS DEL CLIENTE:
[CSV exportado de GA4]

Responde en formato JSON estructurado con distribuciones porcentuales.`;

const PROMPT_PERFILES = `Basándote en estas distribuciones reales de un ecommerce de {{SECTOR}}:

DISTRIBUCIONES: [JSON del análisis previo]

Genera {{N}} perfiles de usuarios sintéticos que:
- Respeten EXACTAMENTE las distribuciones porcentuales
- Sean internamente coherentes (ej: usuario 55+ con baja madurez digital, dispositivo desktop)
- Incluyan: id, edad, género, ciudad, dispositivo, madurez_tecnologica (1-5),
  canal_entrada, tipo (nuevo/recurrente), probabilidad_conversion (0.0-1.0)

El atributo probabilidad_conversion es el más crítico: debe venir de los CVR
reales del cliente por segmento. Si lo inventa la IA, los resultados no valen.

Responde SOLO con un array JSON válido.`;

const PROMPT_VALIDACION = `Revisa estos {{N}} perfiles sintéticos y verifica:
1. ¿Las distribuciones coinciden con el objetivo? (tolerancia ±2%)
2. ¿Hay perfiles internamente incoherentes?
3. ¿La media de probabilidad_conversion coincide con el CVR real del cliente?

CVR REAL DEL CLIENTE: [X%]

Si hay problemas, corrígelos y devuelve el array corregido.`;

function StepPerfiles({input, apiKey, onNext, onBack}) {
  const [loading,setLoading] = useState(false);
  const [profiles,setProfiles] = useState(null);
  const [n,setN] = useState(20);
  const [err,setErr] = useState("");

  async function generar() {
    setLoading(true); setErr("");
    try {
      const prompt = `Eres un experto en analítica web y CRO.
Analiza estos datos de un ecommerce de ${input.sector} y genera exactamente ${n} perfiles sintéticos.

DATOS DEL CLIENTE (CSV):
${input.data}

Instrucciones:
- Analiza las distribuciones reales de los datos (edad, género, dispositivo, canal, CVR)
- Genera ${n} perfiles que respeten EXACTAMENTE esas distribuciones
- Sé internamente coherente: usuario 55+ → madurez baja → desktop
- El campo prob_conversion DEBE venir de los CVR reales del CSV por segmento
- Incluye: id (3 dígitos), edad, genero, ciudad, dispositivo, madurez (1-5), canal, tipo (nuevo/recurrente), prob_conversion (decimal), initials (2 letras mayúsculas)

Responde SOLO con un array JSON válido, sin texto adicional ni markdown.
Ejemplo de un perfil: {"id":"001","edad":"25-34","genero":"mujer","ciudad":"Madrid","dispositivo":"mobile","madurez":4,"canal":"Instagram","tipo":"recurrente","prob_conversion":0.041,"initials":"MG"}`;

      const raw = await callClaude(apiKey,[{role:"user",content:prompt}],
        "Eres un generador de perfiles sintéticos. Responde SOLO con JSON válido, sin texto extra ni bloques de código.");
      setProfiles(parseJSON(raw));
    } catch(e) { setErr("Error: "+e.message); }
    setLoading(false);
  }

  if(loading) return <Spinner text="Generando perfiles sintéticos..." sub="La IA analiza las distribuciones reales de tus datos"/>;

  if(profiles) return (
    <div>
      <p style={s.title}>Perfiles sintéticos generados</p>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <span style={s.tag("green")}>{profiles.length} perfiles · sector {input.sector}</span>
        <button style={{...s.btnO,fontSize:"11px",padding:"4px 9px"}} onClick={()=>setProfiles(null)}>Regenerar</button>
      </div>
      <div style={{maxHeight:"400px",overflowY:"auto",marginBottom:"12px"}}>
        {profiles.slice(0,8).map(function(p,i){ return (
          <div key={p.id} style={s.pCard}>
            <div style={{display:"flex",alignItems:"center",gap:"9px",marginBottom:"9px"}}>
              <div style={s.av(AVATARS[i%5])}>{p.initials||"P"+(i+1)}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:"13px",fontWeight:"600",color:"#E8E6FF"}}>Perfil #{p.id}</div>
                <div style={{fontSize:"11px",color:"#6B6B9A"}}>{p.edad} · {p.genero} · {p.tipo}</div>
              </div>
              <span style={s.tag(p.prob_conversion>0.05?"green":"amber")}>CVR {(p.prob_conversion*100).toFixed(1)}%</span>
            </div>
            <div style={s.attrG}>
              {[["Ciudad",p.ciudad],["Dispositivo",p.dispositivo],["Canal",p.canal],["Madurez",p.madurez+"/5"]].map(kv=>(
                <div key={kv[0]} style={s.attr}>
                  <div style={{fontSize:"10px",color:"#4A4A6A"}}>{kv[0]}</div>
                  <div style={{fontSize:"12px",color:"#C8C6FF",fontWeight:"500"}}>{kv[1]}</div>
                </div>
              ))}
            </div>
          </div>
        );})}
        {profiles.length>8 && <p style={{fontSize:"12px",color:"#4A4A6A",textAlign:"center",padding:"8px"}}>+ {profiles.length-8} perfiles más</p>}
      </div>
      <div style={{...s.card,borderColor:"#1A1A35",padding:"12px 14px"}}>
        <p style={{fontSize:"12px",color:"#4A4A6A",marginBottom:"3px"}}>🔑 Por qué importa <code style={{color:ACCENT2}}>prob_conversion</code></p>
        <p style={{fontSize:"12px",color:"#3E3E5E",lineHeight:"1.6"}}>Este atributo ancla la simulación a la realidad. Si viene de los CVR reales de tus segmentos, los resultados del test tienen sentido. Si lo inventa la IA sin datos reales, los resultados no valen nada.</p>
      </div>
      <PromptViewer title="Generación de perfiles (Paso A+B del pipeline)" prompt={PROMPT_PERFILES}/>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={()=>{setProfiles(null);onBack();}}>Atrás</button>
        <button style={s.btn} onClick={()=>onNext(profiles)}>Configurar test →</button>
      </div>
    </div>
  );

  return (
    <div>
      <p style={s.title}>Paso 2 — Perfiles sintéticos</p>
      <p style={s.sub}>La IA analiza tus datos y genera usuarios que respetan las distribuciones reales de tu ecommerce.</p>

      <div style={s.card}>
        <p style={{fontSize:"13px",color:"#9B99CC",marginBottom:"10px",lineHeight:"1.6"}}>
          Datos cargados del sector <strong style={{color:ACCENT2}}>{input.sector}</strong>. La IA analizará las distribuciones reales y generará los perfiles.
        </p>
        <label style={s.label}>Número de perfiles</label>
        <select style={s.sel} value={n} onChange={e=>setN(Number(e.target.value))}>
          <option value={10}>10 perfiles — prueba rápida</option>
          <option value={20}>20 perfiles — recomendado para demo</option>
          <option value={50}>50 perfiles — más representativo</option>
        </select>
        <div style={s.infoBox}>
          📊 En producción: tráfico &lt;10k/mes → 1.000 perfiles · 10k-100k → 5.000 · &gt;100k → 10.000
        </div>
        {err && <p style={{color:"#FF6B6B",fontSize:"12px",marginTop:"8px"}}>⚠ {err}</p>}
      </div>

      <PromptViewer title="Análisis de datos (Prompt A)" prompt={PROMPT_ANALISIS}/>
      <PromptViewer title="Generación de perfiles (Prompt B)" prompt={PROMPT_PERFILES}/>
      <PromptViewer title="Validación de coherencia (Prompt C)" prompt={PROMPT_VALIDACION}/>

      <div style={s.btnRow}>
        <button style={s.btnO} onClick={onBack}>Atrás</button>
        <button style={s.btn} onClick={generar}>Generar perfiles</button>
      </div>
    </div>
  );
}

{{PERFIL_JSON}}

Estás en: {{URL}}
Página: {{PAGINA}}
Sector: {{SECTOR}}
Variante que ves: {{VARIANTE_A_o_B}}
Descripción del cambio: {{DESCRIPCION_VARIANTE}}

Datos históricos de comportamiento de usuarios como tú:
CVR medio tu segmento: {{CVR}}%
Scroll depth típico: {{SCROLL}}%
Tiempo medio en página: {{TIEMPO}}s

Simula tu sesión y devuelve SOLO este JSON:
{
  "hizo_scroll": true/false,
  "pct_scroll": 0-100,
  "clicks_cta": 0-3,
  "añadio_carrito": true/false,
  "tiempo_sesion_seg": número,

function StepTest({sector, onNext, onBack}) {
  const [hip,setHip] = useState("");
  const [url,setUrl] = useState("");
  const [pag,setPag] = useState("página de producto");
  const [varA,setVarA] = useState("");
  const [varB,setVarB] = useState("");
  const [met,setMet] = useState("tasa de conversión");
  const [split,setSplit] = useState(50);

  const esTurismo = sector==="turismo";

  const paginas = esTurismo
    ? ["ficha de hotel","ficha de vuelo","página de paquete turístico","homepage","resultados de búsqueda","checkout / pago","landing de destino"]
    : ["página de producto","homepage","checkout","categoría","carrito","landing de campaña"];

  const metricas = esTurismo
    ? ["tasa de conversión","clics en CTA","tasa de rebote","tiempo en página","inicio de reserva","completación de reserva"]
    : ["tasa de conversión","clics en CTA","tasa de rebote","tiempo en página","añadidos al carrito"];

  const ok = varA && varB && hip && url;

  return (
    <div>
      <p style={s.title}>Paso 3 — Configurar test A/B</p>
      <p style={s.sub}>Define qué página testás, la hipótesis y las dos variantes que van a competir.</p>

      <div style={s.card}>
        <label style={s.label}>URL de la página a testar *</label>
        <input style={s.inp} value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://tienda.com/producto/zapatillas-running"/>
        <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"5px"}}>La IA usará esta URL para entender el contexto de la página y simular el comportamiento de los usuarios.</p>
      </div>

      <div style={s.card}>
        <label style={s.label}>Página o sección testada</label>
        <select style={s.sel} value={pag} onChange={e=>setPag(e.target.value)}>
          {paginas.map(p=><option key={p}>{p}</option>)}
        </select>
      </div>

      <div style={s.card}>
        <label style={s.label}>Hipótesis del test</label>
        <textarea style={s.ta} value={hip} onChange={e=>setHip(e.target.value)}
          placeholder={esTurismo
            ? "Ej: Creemos que cambiar el CTA de 'Reservar' a 'Ver disponibilidad' reducirá la fricción percibida y aumentará los clics en un 8% en usuarios móvil porque elimina el compromiso implícito de la palabra 'reservar'."
            : "Ej: Creemos que cambiar el CTA de 'Añadir al carrito' a 'Comprar ahora' aumentará la conversión en un 6-9% en usuarios mobile porque reduce pasos percibidos."}/>
        <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"5px"}}>Buena hipótesis = cambio propuesto + efecto esperado + razón del por qué.</p>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"12px"}}>
        <div style={s.card}>
          <div style={{marginBottom:"9px"}}><span style={s.tag("purple")}>Variante A — Control</span></div>
          <label style={s.label}>Descripción actual</label>
          <input style={s.inp} value={varA} onChange={e=>setVarA(e.target.value)}
            placeholder={esTurismo?"Ej: Botón azul 'Reservar ahora'":"Ej: Botón azul 'Añadir al carrito'"}/>
        </div>
        <div style={s.card}>
          <div style={{marginBottom:"9px"}}><span style={s.tag("green")}>Variante B — Cambio</span></div>
          <label style={s.label}>Descripción del cambio</label>
          <input style={s.inp} value={varB} onChange={e=>setVarB(e.target.value)}
            placeholder={esTurismo?"Ej: Botón verde 'Ver disponibilidad' + badge urgencia":"Ej: Botón verde 'Comprar ahora — Envío gratis'"}/>
        </div>
      </div>

      <div style={s.card}>
        <label style={s.label}>Métrica principal (la decisiva)</label>
        <select style={s.sel} value={met} onChange={e=>setMet(e.target.value)}>
          {metricas.map(m=><option key={m}>{m}</option>)}
        </select>
        <div style={{marginTop:"14px"}}>
          <label style={s.label}>Split: A {split}% / B {100-split}%</label>
          <input type="range" min="10" max="90" step="5" value={split} onChange={e=>setSplit(Number(e.target.value))} style={{width:"100%",accentColor:ACCENT}}/>
          <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"4px"}}>Para tests exploratorios usa 50/50. Si quieres proteger el tráfico actual usa 80/20.</p>
        </div>
      </div>

      {!ok && (url===""||hip===""||varA===""||varB==="") && (
        <p style={{fontSize:"12px",color:"#F5A623",marginBottom:"8px"}}>
          ⚠ Faltan: {[!url&&"URL",!hip&&"hipótesis",!varA&&"variante A",!varB&&"variante B"].filter(Boolean).join(", ")}
        </p>
      )}

      <div style={s.btnRow}>
        <button style={s.btnO} onClick={onBack}>Atrás</button>
        <button style={{...s.btn,opacity:ok?1:0.4}} disabled={!ok}
          onClick={()=>onNext({hipotesis:hip,url,pagina:pag,varA,varB,metrica:met,split})}>
          Lanzar simulación →
        </button>
      </div>
    </div>
  );
}

function StepSim({profiles, test, input, apiKey, onNext, onBack}) {
  const [loading,setLoading] = useState(false);
  const [done,setDone] = useState(false);
  const [res,setRes] = useState(null);
  const [err,setErr] = useState("");

  async function simular() {
    setLoading(true); setErr("");
    try {
      const sample = profiles.slice(0,Math.min(15,profiles.length)).map(p=>({
        id:p.id, edad:p.edad, genero:p.genero, dispositivo:p.dispositivo,
        madurez:p.madurez, canal:p.canal, tipo:p.tipo, prob_conversion:p.prob_conversion
      }));

      const prompt = `Eres el motor de simulación A/B de SynthAB. Simula cómo estos ${sample.length} perfiles interactúan con las dos variantes de una página web.

URL DE LA PÁGINA: ${test.url}
PÁGINA: ${test.pagina}
SECTOR: ${input.sector}
HIPÓTESIS: ${test.hipotesis}

VARIANTE A (control): ${test.varA}
VARIANTE B (cambio propuesto): ${test.varB}
MÉTRICA PRINCIPAL: ${test.metrica}
SPLIT: ${test.split}% A / ${100-test.split}% B

PERFILES SINTÉTICOS:
${JSON.stringify(sample,null,2)}

LÓGICA DE DECISIÓN de cada agente:
P(acción) = perfil_base × modificador_variante × contexto_histórico

Donde:
- perfil_base: edad, género, madurez tecnológica, dispositivo, canal, prob_conversion
- modificador_variante: cómo afecta cada variante a este tipo de usuario (B puede mejorar o empeorar según el perfil)
- contexto_histórico: CVR real del segmento

IMPORTANTE:
- Variante B NO gana automáticamente — el modificador puede ir en cualquier dirección según el perfil
- Usuarios mayores con baja madurez digital pueden responder peor a cambios disruptivos
- Usuarios mobile con alta intención responden bien a CTAs directos

Devuelve SOLO este JSON (sin texto adicional ni markdown):
{
  "ganador": "A" o "B",
  "confianza": número 60-99,
  "uplift_cvr": número con decimal (puede ser negativo si gana A),
  "cvr_a": número con 1 decimal,
  "cvr_b": número con 1 decimal,
  "clics_cta_a": número,
  "clics_cta_b": número,
  "rebote_a": número,
  "rebote_b": número,
  "segmentos": [{"nombre":"18-24","resultado":"B gana","diff_pct":22}],
  "razones_abandono": ["razón 1 extraída de los agentes que no convirtieron"],
  "insights": ["insight 1 sobre qué segmentos responden mejor","insight 2 sobre qué puede mejorarse"],
  "recomendacion": "texto de recomendación accionable para el cliente"
}`;

      const raw = await callClaude(apiKey,[{role:"user",content:prompt}],
        "Eres un motor de simulación A/B. Analiza los perfiles y simula resultados realistas basados en los datos. Responde SOLO con JSON válido.");
      setRes(parseJSON(raw));
      setDone(true);
    } catch(e) { setErr("Error en simulación: "+e.message); }
    setLoading(false);
  }

  if(loading) return <Spinner text={`Simulando ${profiles.length} agentes en paralelo...`} sub="Cada agente navega su variante según su perfil y los datos históricos"/>;

  if(done) return (
    <div>
      <div style={{textAlign:"center",padding:"24px"}}>
        <div style={{fontSize:"36px",marginBottom:"12px"}}>✓</div>
        <p style={{fontSize:"15px",fontWeight:"600",color:ACCENT2,marginBottom:"5px"}}>Simulación completada</p>
        <p style={{fontSize:"13px",color:"#4A4A6A"}}>{profiles.length} agentes · {test.varA} vs {test.varB}</p>
      </div>
      <div style={s.btnRow}>
        <button style={s.btnO} onClick={()=>{setDone(false);setRes(null);}}>Repetir</button>
        <button style={s.btn} onClick={()=>onNext(res)}>Ver resultados →</button>
      </div>
    </div>
  );

  return (
    <div>
      <p style={s.title}>Paso 4 — Simulación</p>
      <p style={s.sub}>Los agentes sintéticos navegan su variante asignada y deciden basándose en su perfil + datos históricos.</p>

      <div style={s.card}>
        <p style={{fontSize:"12px",color:"#6B6B9A",marginBottom:"12px",lineHeight:"1.6"}}>
          <strong style={{color:"#9B99CC"}}>{profiles.length} agentes</strong> distribuidos: {test.split}% verán la variante A, {100-test.split}% la variante B.
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"14px"}}>
          <div style={{background:"#0A0A14",borderRadius:"8px",padding:"11px 13px",border:"1px solid rgba(108,99,255,0.2)"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:ACCENT,marginBottom:"3px"}}>Variante A — Control</div>
            <div style={{fontSize:"13px",color:"#C8C6FF"}}>{test.varA}</div>
          </div>
          <div style={{background:"#0A0A14",borderRadius:"8px",padding:"11px 13px",border:"1px solid rgba(0,212,170,0.2)"}}>
            <div style={{fontSize:"11px",fontWeight:"700",color:ACCENT2,marginBottom:"3px"}}>Variante B — Cambio</div>
            <div style={{fontSize:"13px",color:"#C8C6FF"}}>{test.varB}</div>
          </div>
        </div>
        <div style={s.infoBox}>
          🔗 URL testada: <span style={{color:ACCENT2,fontFamily:"monospace",fontSize:"11px"}}>{test.url}</span>
        </div>
        {err && <p style={{color:"#FF6B6B",fontSize:"12px",marginTop:"8px"}}>⚠ {err}</p>}
      </div>

      <PromptViewer title="Motor de decisión de cada agente (Paso 04 del pipeline)" prompt={PROMPT_SIMULACION}/>

      <div style={{...s.card,borderColor:"#1A1A35",padding:"12px 14px"}}>
        <p style={{fontSize:"12px",color:"#4A4A6A",marginBottom:"3px"}}>⚡ Cada agente es una llamada independiente a la API</p>
        <p style={{fontSize:"12px",color:"#3E3E5E",lineHeight:"1.6"}}>Con 5.000 perfiles son 5.000 llamadas — se ejecutan en paralelo para tardar minutos, no horas. Esto es lo que más coste computacional tiene del producto.</p>
      </div>

      <div style={s.btnRow}>
        <button style={s.btnO} onClick={onBack}>Atrás</button>
        <button style={s.btn} onClick={simular}>Lanzar simulación</button>
      </div>
    </div>
  );
}

function StepResultados({results, test}) {
  const r = results;
  const t = test;
  const gB = r.ganador==="B";
  const IC = [ACCENT2,"#F5A623","#FF6B6B","#6C63FF"];

  function copiar() {
    const txt = `RESULTADOS TEST A/B — SynthAB\n\nURL testada: ${t.url}\nPágina: ${t.pagina}\nHipótesis: ${t.hipotesis}\n\nVariante A: ${t.varA}\nVariante B: ${t.varB}\n\nGanador: Variante ${r.ganador}\nUplift CVR: ${r.uplift_cvr>0?"+":""}${Number(r.uplift_cvr).toFixed(1)}%\nConfianza estadística: ${r.confianza}%\nCVR A: ${r.cvr_a}% / CVR B: ${r.cvr_b}%\n\nRecomendación:\n${r.recomendacion}`;
    navigator.clipboard.writeText(txt).then(()=>alert("Copiado al portapapeles ✓"));
  }

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px",flexWrap:"wrap",gap:"8px"}}>
        <div>
          <p style={{...s.title,marginBottom:"3px"}}>Resultados del test</p>
          <p style={{fontSize:"12px",color:"#4A4A6A",fontFamily:"monospace"}}>{t.url}</p>
        </div>
        <button style={{...s.btnO,fontSize:"12px",padding:"7px 12px"}} onClick={copiar}>Copiar resultados</button>
      </div>

      <div style={s.winner}>
        <div style={{width:"46px",height:"46px",borderRadius:"50%",background:"rgba(0,212,170,0.1)",border:"1px solid rgba(0,212,170,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:0}}>🏆</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"15px",fontWeight:"700",color:ACCENT2,marginBottom:"3px"}}>
            Variante {r.ganador} gana — {r.ganador==="B"?t.varB:t.varA}
          </div>
          <div style={{fontSize:"12px",color:"#3A6A5A"}}>{r.confianza}% de confianza estadística</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:"26px",fontWeight:"700",color:gB?ACCENT2:"#FF6B6B"}}>
            {r.uplift_cvr>0?"+":""}{Number(r.uplift_cvr).toFixed(1)}%
          </div>
          <div style={{fontSize:"11px",color:"#3A5A4A"}}>uplift CVR</div>
        </div>
      </div>

      <div style={s.card}>
        <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 8px"}}>Métricas principales</p>
        {[
          {name:"Tasa de conversión ⭐",a:(r.cvr_a||0).toFixed(1)+"%",b:(r.cvr_b||0).toFixed(1)+"%",diff:r.uplift_cvr,pos:gB},
          {name:"Clics en CTA",a:(r.clics_cta_a||0)+"%",b:(r.clics_cta_b||0)+"%",diff:(((r.clics_cta_b-r.clics_cta_a)/(r.clics_cta_a||1))*100).toFixed(1),pos:r.clics_cta_b>r.clics_cta_a},
          {name:"Tasa de rebote",a:(r.rebote_a||0)+"%",b:(r.rebote_b||0)+"%",diff:(((r.rebote_b-r.rebote_a)/(r.rebote_a||1))*100).toFixed(1),pos:r.rebote_b<r.rebote_a}
        ].map(m=>(
          <div key={m.name} style={s.mRow}>
            <span style={{fontSize:"13px",color:"#9B99CC",flex:1}}>{m.name}</span>
            <span style={{fontSize:"12px",color:"#5A5A8A",marginRight:"4px"}}>A: {m.a}</span>
            <span style={{fontSize:"14px",fontWeight:"600",color:"#fff"}}>B: {m.b}</span>
            <span style={{fontSize:"11px",fontWeight:"700",padding:"2px 8px",borderRadius:"20px",background:m.pos?"#0D2E22":"#2E0D0D",color:m.pos?ACCENT2:"#FF6B6B"}}>{m.diff>0?"+":""}{Number(m.diff).toFixed(1)}%</span>
          </div>
        ))}
      </div>

      {r.segmentos && r.segmentos.length>0 && (
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 8px"}}>Resultados por segmento</p>
          {r.segmentos.map(sg=>(
            <div key={sg.nombre} style={s.sRow}>
              <span style={{minWidth:"60px",fontWeight:"600",color:"#C8C6FF"}}>{sg.nombre}</span>
              <span style={{flex:1}}>{sg.resultado}</span>
              <span style={s.tag(sg.resultado.includes("B")?"green":"amber")}>{sg.diff_pct>0?"+":""}{sg.diff_pct}%</span>
            </div>
          ))}
          <p style={{fontSize:"11px",color:"#3E3E5E",marginTop:"8px"}}>ℹ️ Variante B no gana en todos los segmentos. Los usuarios 45+ con baja madurez digital pueden responder peor a cambios disruptivos.</p>
        </div>
      )}

      {r.razones_abandono && r.razones_abandono.length>0 && (
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 8px"}}>Principales razones de abandono — Variante B</p>
          <p style={{fontSize:"11px",color:"#3E3E5E",marginBottom:"8px"}}>Extraídas automáticamente de los agentes que no convirtieron:</p>
          {r.razones_abandono.map((ra,i)=>(
            <div key={i} style={s.iRow}>
              <div style={{width:"7px",height:"7px",borderRadius:"50%",background:ACCENT,flexShrink:0,marginTop:"6px"}}/>
              {ra}
            </div>
          ))}
        </div>
      )}

      {r.insights && r.insights.length>0 && (
        <div style={s.card}>
          <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 8px"}}>Insights clave</p>
          {r.insights.map((ins,i)=>(
            <div key={i} style={s.iRow}>
              <div style={{width:"7px",height:"7px",borderRadius:"50%",background:IC[i]||"#6B6B9A",flexShrink:0,marginTop:"6px"}}/>
              {ins}
            </div>
          ))}
        </div>
      )}

      {r.recomendacion && (
        <div style={{background:"#0F0F2A",border:"1px solid rgba(108,99,255,0.2)",borderRadius:"12px",padding:"16px 18px",marginBottom:"16px",display:"flex",gap:"12px"}}>
          <div style={{fontSize:"18px",flexShrink:0}}>✦</div>
          <div>
            <p style={{fontSize:"13px",fontWeight:"600",color:"#C8C6FF",margin:"0 0 4px"}}>Recomendación del sistema</p>
            <p style={{fontSize:"13px",color:"#8B8BCC",margin:0,lineHeight:"1.7"}}>{r.recomendacion}</p>
          </div>
        </div>
      )}

      <div style={{...s.card,borderColor:"#1A2030",padding:"12px 14px"}}>
        <p style={{fontSize:"12px",color:"#4A5A7A",marginBottom:"3px"}}>⚙️ Paso 6 — Validación y calibración</p>
        <p style={{fontSize:"12px",color:"#3E4A5E",lineHeight:"1.6"}}>Cuando implementes la variante ganadora en producción, compara los resultados reales con esta predicción. Cada proyecto calibra el modelo y lo hace más preciso para el siguiente cliente.</p>
      </div>

      <div style={s.btnRow}>
        <button style={s.btnG} onClick={()=>window.location.reload()}>Nuevo test</button>
      </div>
    </div>
  );
}

function App() {
  const [apiKey,setApiKey] = useState("");
  const [step,setStep] = useState(0);
  const [dataInput,setDataInput] = useState(null);
  const [profiles,setProfiles] = useState([]);
  const [testConfig,setTestConfig] = useState(null);
  const [results,setResults] = useState(null);

  if(!apiKey) return (
    <div>
      <div style={s.header}><div style={s.logo}><div style={s.dot}/>SynthAB</div></div>
      <ApiScreen onReady={setApiKey}/>
    </div>
  );

  return (
    <div>
      <div style={s.header}>
        <div style={s.logo}><div style={s.dot}/>SynthAB<span style={{fontSize:"11px",color:"#4A4A6A",fontWeight:"400",marginLeft:"6px"}}>v0.2 · piloto</span></div>
        <button style={{...s.btnO,fontSize:"11px",padding:"4px 9px"}} onClick={()=>setApiKey("")}>Cambiar API key</button>
      </div>
      <StepBar cur={step}/>
      <div style={s.main}>
        {step===0 && <StepData onNext={d=>{setDataInput(d);setStep(1);}}/>}
        {step===1 && <StepPerfiles input={dataInput} apiKey={apiKey} onNext={p=>{setProfiles(p);setStep(2);}} onBack={()=>setStep(0)}/>}
        {step===2 && <StepTest sector={dataInput&&dataInput.sector} onNext={t=>{setTestConfig(t);setStep(3);}} onBack={()=>setStep(1)}/>}
        {step===3 && <StepSim profiles={profiles} test={testConfig} input={dataInput} apiKey={apiKey} onNext={r=>{setResults(r);setStep(4);}} onBack={()=>setStep(2)}/>}
        {step===4 && <StepResultados results={results} test={testConfig}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
