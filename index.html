// ── CLAUDE API ────────────────────────────────────────────────────────────
async function callClaude(apiKey,messages,system){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2500,system,messages})
  });
  const data=await res.json();
  if(!data.content) throw new Error(data.error?data.error.message:'Error API');
  return data.content.map(b=>b.text||'').join('');
}
function parseJSON(raw){
  const c=raw.replace(/```json/g,'').replace(/```/g,'').trim();
  const s1=c.indexOf('['),s2=c.indexOf('{');
  if(s1!==-1&&(s2===-1||s1<s2)) return JSON.parse(c.slice(s1,c.lastIndexOf(']')+1));
  return JSON.parse(c.slice(s2,c.lastIndexOf('}')+1));
}
function parseCSV(text){
  const clean=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  const lines=clean.split('\n').filter(l=>l.trim());
  if(lines.length<2) return null;
  const sep=lines[0].includes(';')?';':',';
  const headers=lines[0].split(sep).map(h=>h.trim().replace(/"/g,''));
  const rows=lines.slice(1).map(line=>{const vals=line.split(sep).map(v=>v.trim().replace(/"/g,''));const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||'';});return obj;});
  return{headers,rows,raw:clean};
}

  const [name,setName]=useState('');
  const [domain,setDomain]=useState('');

  const [cvr,setCvr]=useState('');

        <div onClick={()=>refEl.current.click()}

    });

  const canNext0=name&&domain;
  const canNext1=cvr&&ticket&&transacciones&&trafico;

  return(

      {sub===0&&(

          <p style={{...T.h3,marginBottom:'14px'}}>Datos del proyecto</p>

      {sub===1&&(

          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'14px'}}>KPIs del negocio <span style={{color:C.red}}>*</span></p>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>

              <Input label='Transacciones / mes' value={transacciones} onChange={setTransacciones} type='number' placeholder='320' required/>

            <div style={{marginBottom:'14px'}}>
              <label style={{...T.label,display:'block',marginBottom:'6px'}}>% Mobile: {mobile}% · Desktop: {100-mobile-2}% · Tablet: 2%</label>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
              <Select label='Tipo de compra' value={tipoCompra} onChange={setTipoCompra} options={[{value:'impulsiva',label:'Impulsiva'},{value:'reflexiva',label:'Reflexiva'},{value:'mixta',label:'Mixta'}]}/>
              <div>
                <label style={{...T.label,display:'block',marginBottom:'6px'}}>% Recurrentes: {recurrentes}%</label>
                <input type='range' min='0' max='100' step='5' value={recurrentes} onChange={e=>setRecurrentes(Number(e.target.value))} style={{width:'100%',accentColor:C.accent,marginTop:'6px'}}/>
              </div>
            </div>
          </Card>
          <Card>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'14px'}}>
              <p style={T.h3}>Canales principales (hasta 4)</p>
              {canales.length<4&&<button style={{fontSize:'11px',color:C.accent,background:'none',border:'none',cursor:'pointer'}} onClick={()=>setCanales([...canales,{canal:'',pct:''}])}>+ Añadir</button>}
            </div>
            {canales.map((c,i)=>(
              <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 80px',gap:'8px',marginBottom:'8px'}}>
                <select value={c.canal} onChange={e=>{const n=[...canales];n[i]={...n[i],canal:e.target.value};setCanales(n);}}

                  <option value=''>Canal...</option>
                  {CANALES_LIST.map(ch=><option key={ch}>{ch}</option>)}
                </select>
                <input type='number' placeholder='%' value={c.pct} onChange={e=>{const n=[...canales];n[i]={...n[i],pct:e.target.value};setCanales(n);}}
                  style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 10px',color:C.txt,fontSize:'13px',outline:'none',textAlign:'center'}}/>
              </div>

          </Card>
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={()=>setSub(0)}>Atrás</Btn>
            <Btn disabled={!canNext1} onClick={()=>setSub(2)}>Siguiente →</Btn>
          </div>
        </div>
      )}

      {sub===2&&(
        <div>
          <Card style={{marginBottom:'12px',borderColor:C.accent}}>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}}>
              <Tag color='purple'>Obligatorio</Tag>
              <p style={T.h3}>Exp 1 — Quién es el usuario</p>
            </div>
            <p style={{...T.body,marginBottom:'14px'}}>Define los arquetipos base: quién te visita cruzado con conversión. Sin esto no se pueden generar perfiles fiables.</p>
            <CSVBox parsed={exp1} refEl={ref1} setter={setExp1}
              label='CSV de la Exploración 1'
              hint='Dimensiones: País, Ciudad, Edad, Género, Tipo usuario, Dispositivo · Métricas: Usuarios activos, Sesiones, Conversiones, Tasa de conversión'
              tutorial={<span>
                1. GA4 → <b>Explorar</b> → <b>Exploración en blanco</b> (Tabla libre)<br/>
                2. <b>Dimensiones (filas):</b> País · Ciudad · Edad · Género · Intereses · Idioma<br/>
                3. <b>Dimensiones (columnas):</b> Tipo de usuario · Dispositivo · Sistema operativo<br/>
                4. <b>Métricas:</b> Usuarios activos · Sesiones · Tasa de engagement · Sesiones por usuario · Conversiones · Tasa de conversión<br/>
                5. Rango de fechas: <b>últimos 90 días</b><br/>
                6. Arriba derecha → <b>Exportar → Descargar CSV</b>
              </span>}
            />
          </Card>
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={()=>setSub(1)}>Atrás</Btn>
            <Btn disabled={!exp1} onClick={()=>setSub(3)}>Siguiente →</Btn>
          </div>
        </div>
      )}

      {sub===3&&(
        <div>
          <Card style={{marginBottom:'12px',borderColor:C.border}}>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}}>
              <Tag color='amber'>Opcional +15%</Tag>
              <p style={T.h3}>Exp 2 — Cómo llega y de dónde viene</p>
            </div>
            <p style={{...T.body,marginBottom:'14px'}}>Contexto mental de entrada. Un usuario de paid tiene intención muy distinta a uno de orgánico o newsletter.</p>
            <CSVBox parsed={exp2} refEl={ref2} setter={setExp2}
              label='CSV de la Exploración 2'
              hint='Dimensiones: Canal, Fuente/Medio, Campaña, Página destino · Métricas: Sesiones, Usuarios, Tasa engagement, Duración sesión, Conversiones, CVR'
              tutorial={<span>
                1. GA4 → <b>Explorar</b> → <b>Exploración en blanco</b> (Tabla libre)<br/>
                2. <b>Dimensiones (filas):</b> Canal de sesión · Fuente/Medio · Campaña · Página de destino<br/>
                3. <b>Dimensiones (columnas):</b> Tipo de usuario · Dispositivo<br/>
                4. <b>Métricas:</b> Sesiones · Usuarios activos · Tasa de engagement · Duración media sesión · Conversiones · Tasa de conversión de sesión<br/>
                5. Rango de fechas: <b>últimos 90 días</b><br/>
                6. Exportar → <b>Descargar CSV</b>
              </span>}
            />
          </Card>
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={()=>setSub(2)}>Atrás</Btn>
            <Btn onClick={()=>setSub(4)}>Siguiente →</Btn>
          </div>
        </div>
      )}

      {sub===4&&(
        <div>
          <Card style={{marginBottom:'12px',borderColor:C.border}}>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px'}}>
              <Tag color='amber'>Opcional +15%</Tag>
              <p style={T.h3}>Exp 3 — Cómo navega y qué hace dentro</p>
            </div>
            <p style={{...T.body,marginBottom:'14px'}}>Rutas reales por segmento. Las diferencias entre conversor y no conversor definen el comportamiento del sintético.</p>
            <CSVBox parsed={exp3} refEl={ref3} setter={setExp3}
              label='CSV de la Exploración 3'
              hint='Exploración de rutas: Nodo inicio = Página destino · Dimensiones: Título página, Nombre evento, Búsqueda interna · Segmentos: por canal, dispositivo, tipo usuario, conversores'
              tutorial={<span>
                1. GA4 → <b>Explorar</b> → <b>Exploración de rutas</b> (Path exploration)<br/>
                2. <b>Nodo de inicio:</b> Página de destino (primera URL visitada)<br/>
                3. <b>Dimensiones de nodo:</b> Título de página · Nombre del evento · Búsqueda en site<br/>
                4. <b>Aplica segmentos:</b> Por canal · Por dispositivo · Por tipo usuario · Por conversores<br/>
                5. Ejecuta la misma exploración con distintos segmentos para comparar rutas<br/>
                6. Exportar → <b>Descargar CSV</b>
              </span>}
            />
          </Card>
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={()=>setSub(3)}>Atrás</Btn>
            <Btn variant='green' onClick={handleSave}>Crear proyecto ({score()}% precisión)</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CREATE TEST ───────────────────────────────────────────────────────────
function CreateTest({project,apiKey,onSave,onCancel}){
  const TSTEPS=['URL y página','Perfiles','Test','QA','Lanzar'];
  const [tsub,setTsub]=useState(0);
  const [url,setUrl]=useState('');
  const [pagina,setPagina]=useState('página de producto');
  const [tiempo,setTiempo]=useState('');
  const [rebote,setRebote]=useState('');
  const [scroll,setScroll]=useState('');
  const [abandono,setAbandono]=useState('');
  const [pageImgs,setPageImgs]=useState({heatmapClics:null,heatmapScroll:null});
  const [csvRutas,setCsvRutas]=useState(null);
  const refCsvRutas=useRef();
  const refHeatClics=useRef();
  const refHeatScroll=useRef();
  const [profiles,setProfiles]=useState(null);
  const [loadingP,setLoadingP]=useState(false);
  const [errP,setErrP]=useState('');
  const [nProfiles,setNProfiles]=useState(20);
  const [hip,setHip]=useState('');
  const [varA,setVarA]=useState('');
  const [varB,setVarB]=useState('');
  const [imgB,setImgB]=useState(null);
  const [imgBName,setImgBName]=useState('');
  const [figmaUrl,setFigmaUrl]=useState('');
  const [metricaP,setMetricaP]=useState('tasa de conversión');
  const [metricaPCustom,setMetricaPCustom]=useState('');
  const [metricasS,setMetricasS]=useState([]);
  const [split,setSplit]=useState(50);
  const [results,setResults]=useState(null);
  const [loadingSim,setLoadingSim]=useState(false);
  const [errSim,setErrSim]=useState('');
  const imgRef=useRef();

  // Helper: imagen upload para heatmaps
  function ImgUpload({label,hint,field,state,setter,refKey}){
    const refs={refHeatClics,refHeatScroll};
    const ref=refs[refKey];
    const val=state[field];
    return(
      <div>
        <label style={{...T.label,display:'block',marginBottom:'5px'}}>{label}</label>
        <div onClick={()=>ref.current.click()}
          style={{border:`1.5px dashed ${val?C.green:C.border}`,borderRadius:'8px',padding:'14px',textAlign:'center',cursor:'pointer',background:val?C.greenDim:'#070713',minHeight:'80px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'5px'}}>
          <input ref={ref} type='file' accept='.jpg,.jpeg,.png,.webp' style={{display:'none'}}
            onChange={e=>{if(e.target.files[0]) setter(prev=>({...prev,[field]:e.target.files[0].name}));}}/>
          <span style={{fontSize:'18px'}}>{val?'✓':'🖼'}</span>
          <p style={{fontSize:'11px',color:val?C.green:C.txtDim,fontWeight:val?600:400}}>{val||'Arrastra imagen o haz clic'}</p>
          <p style={{...T.small}}>{hint}</p>
        </div>
      </div>
    );
  }

  // Helper: csv upload simple
  function CsvUploadSimple({label,hint,parsed,setter,refEl}){
    function handleFile(f){
      if(!f) return;
      const r=new FileReader();
      r.onload=e=>{const p=parseCSV(e.target.result);if(p) setter({...p,fileName:f.name});};
      r.readAsText(f,'UTF-8');
    }
    return(
      <div>
        <label style={{...T.label,display:'block',marginBottom:'5px'}}>{label}</label>
        <div onClick={()=>refEl.current.click()}
          style={{border:`1.5px dashed ${parsed?C.green:C.border}`,borderRadius:'8px',padding:'14px',textAlign:'center',cursor:'pointer',background:parsed?C.greenDim:'#070713'}}>
          <input ref={refEl} type='file' accept='.csv,.txt' style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          <span style={{fontSize:'18px',display:'block',marginBottom:'4px'}}>📊</span>
          {parsed
            ?<p style={{fontSize:'12px',color:C.green,fontWeight:600}}>{parsed.fileName} · {parsed.rows.length} filas</p>
            :<p style={{fontSize:'12px',color:C.txtDim}}>Arrastra CSV o haz clic</p>}
          <p style={{...T.small,marginTop:'3px'}}>{hint}</p>
        </div>
        {parsed&&<div style={{...T.small,background:'#0A1A14',border:`1px solid rgba(0,212,170,0.15)`,borderRadius:'6px',padding:'6px 10px',marginTop:'5px'}}>
          ✓ Columnas: {parsed.headers.join(', ')}
        </div>}
      </div>
    );
  }

  const paginas=['página de producto','homepage','checkout','categoría','carrito','landing de campaña','página de colección'];
  const metricas=['tasa de conversión','clics en CTA','tasa de rebote','tiempo en página','añadidos al carrito','ingresos por sesión'];

  async function generarPerfiles(){
    setLoadingP(true);setErrP('');
    try{
      const prompt=`Genera exactamente ${nProfiles} perfiles sintéticos para un ecommerce de ${project.sector}.

DATOS DEL PROYECTO:
CVR base: ${project.kpis.cvr}%, Ticket: ${project.kpis.ticket}€, Tráfico: ${project.kpis.trafico}/mes
Mobile: ${project.kpis.mobile}%, Tipo compra: ${project.kpis.tipoCompra}, Recurrentes: ${project.kpis.recurrentes}%
Canales: ${JSON.stringify(project.canales)}

DATOS ESPECÍFICOS DE LA PÁGINA A TESTAR:
URL: ${url}, Página: ${pagina}
${tiempo?'Tiempo medio en página: '+tiempo+'s':''}
${rebote?'Tasa rebote página: '+rebote+'%':''}
${scroll?'Scroll depth: '+scroll+'%':''}
${abandono?'Principal abandono: '+abandono:''}

Genera perfiles coherentes. prob_conversion anclado al CVR real (${project.kpis.cvr}% media).
Cada perfil: {"id":"001","edad":"25-34","genero":"mujer","ciudad":"Madrid","dispositivo":"mobile","madurez":4,"canal":"Orgánico / SEO","tipo":"recurrente","prob_conversion":0.041,"scroll_depth":68,"tiempo_sesion_seg":95,"motivacion":"calidad","fase_funnel":"decision","sensibilidad_precio":"media","initials":"MG"}
SOLO array JSON válido.`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO con JSON válido sin texto extra.');
      setProfiles(parseJSON(raw));
      setTsub(2);
    }catch(e){setErrP('Error: '+e.message);}
    setLoadingP(false);
  }

  async function simular(){
    setLoadingSim(true);setErrSim('');
    try{
      const sample=(profiles||[]).slice(0,15).map(p=>({id:p.id,edad:p.edad,genero:p.genero,dispositivo:p.dispositivo,madurez:p.madurez,canal:p.canal,tipo:p.tipo,prob_conversion:p.prob_conversion,motivacion:p.motivacion,fase_funnel:p.fase_funnel,sensibilidad_precio:p.sensibilidad_precio}));
      const prompt=`Motor simulación A/B. Sector: ${project.sector}. CVR base: ${project.kpis.cvr}%. URL: ${url}. Página: ${pagina}.
Hipótesis: ${hip}. Variante A: ${varA}. Variante B: ${varB}. Métrica: ${metricaP}. Split: ${split}%A/${100-split}%B.
Perfiles: ${JSON.stringify(sample)}
B no gana automáticamente. Considera motivación, fase funnel, sensibilidad precio, dispositivo.
Devuelve SOLO JSON: {"ganador":"B","confianza":94,"uplift_cvr":8.4,"cvr_a":2.4,"cvr_b":2.6,"clics_cta_a":14,"clics_cta_b":18,"rebote_a":44,"rebote_b":41,"segmentos":[{"nombre":"18-24","resultado":"B gana fuerte","diff_pct":22}],"razones_abandono":["razón 1"],"insights":["insight 1"],"recomendacion":"texto"}`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido.');
      setResults(parseJSON(raw));setTsub(3);
    }catch(e){setErrSim('Error: '+e.message);}
    setLoadingSim(false);
  }

  function handleSave(){
    const t={
      id:'t'+Date.now(),name:hip.slice(0,40)||'Nuevo test',url,status:'completado',
      ganador:results?.ganador,uplift:results?(results.uplift_cvr>0?'+':'')+Number(results.uplift_cvr).toFixed(1)+'%':null,
      createdAt:new Date().toISOString().slice(0,10),results
    };
    onSave(t);
  }

  if(loadingP) return <Spinner text='Generando perfiles sintéticos...' sub={`Anclando al CVR real del proyecto (${project.kpis.cvr}%)`}/>;
  if(loadingSim) return <Spinner text={`Simulando ${(profiles||[]).length} agentes...`} sub='Cada agente decide según motivación, fase de funnel y comportamiento real'/>;

  return(
    <div className='fade' style={{padding:'28px 32px',maxWidth:'640px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}}>
        <button onClick={onCancel} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px'}}>← {project.name}</button>
        <span style={{color:C.txtDim}}>/</span>
        <span style={{fontSize:'13px',color:C.txt}}>Nuevo test</span>
      </div>
      <QualityBar score={project.quality}/>

      {/* step bar */}
      <div style={{display:'flex',gap:'4px',marginBottom:'22px',overflowX:'auto'}}>
        {TSTEPS.map((st,i)=>(
          <div key={st} style={{flex:1,textAlign:'center',padding:'8px 4px',borderRadius:'6px',fontSize:'11px',fontWeight:600,
            background:i===tsub?C.accentDim:'transparent',border:`1px solid ${i===tsub?C.accent:C.border}`,
            color:i<tsub?C.green:i===tsub?C.accent:C.txtDim,whiteSpace:'nowrap'}}>{i<tsub?'✓ ':''}{st}</div>
        ))}
      </div>

      {tsub===0&&(
        <div>
          {/* URL + tipo */}
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'14px'}}>URL de la página a testar</p>
            <Input label='URL completa' value={url} onChange={setUrl} placeholder='https://tienda.com/producto/zapatillas' required hint='La IA usará esta URL para contextualizar el comportamiento de cada agente en esta página concreta.'/>
            <Select label='Tipo de página' value={pagina} onChange={setPagina} options={paginas}/>
          </Card>

          {/* KPIs de la página */}
          <Card style={{marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>

            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:'24px',fontWeight:700,color:C.green}}>{results.uplift_cvr>0?'+':''}{Number(results.uplift_cvr).toFixed(1)}%</div>
              <div style={{fontSize:'11px',color:'#3A5A4A'}}>uplift CVR</div>
            </div>
          </div>
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Resumen QA</p>
            {[
              {k:'URL testada',v:url},{k:'Variante A',v:varA},{k:'Variante B',v:varB},
              {k:'Perfiles simulados',v:profiles.length},{k:'Métrica principal',v:metricaP},
              {k:'Split',v:`A ${split}% / B ${100-split}%`},
            ].map(row=>(
              <div key={row.k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px'}}>
                <span style={{color:C.txtDim}}>{row.k}</span>
                <span style={{color:C.txt,fontWeight:500}}>{row.v}</span>
              </div>
            ))}
          </Card>
          {results.insights&&results.insights.length>0&&(
            <Card style={{marginBottom:'12px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Insights principales</p>
              {results.insights.slice(0,2).map((ins,i)=>(
                <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
                  <span style={{color:[C.green,C.amber][i],flexShrink:0,marginTop:'2px'}}>◆</span>{ins}
                </div>
              ))}
            </Card>
          )}
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(2)}>Revisar</Btn>
            <Btn variant='green' onClick={()=>setTsub(4)}>Lanzar test →</Btn>
          </div>
        </div>
      )}

      {tsub===4&&(
        <div>
          <Card style={{textAlign:'center',padding:'32px',marginBottom:'16px'}}>
            <div style={{fontSize:'40px',marginBottom:'12px'}}>✓</div>
            <p style={{...T.h2,marginBottom:'6px'}}>Test listo para lanzar</p>
            <p style={{...T.body,marginBottom:'20px'}}>El test ha pasado el QA y los resultados de la simulación están disponibles. Guárdalo en el proyecto.</p>
            <Btn variant='green' onClick={handleSave}>Guardar en proyecto</Btn>
          </Card>
        </div>
      )}
    </div>
  );
}

// ── REPORT VIEW ───────────────────────────────────────────────────────────
function ReportView({project,test,results,onBack}){
  const r=results||PILOT_RESULTS[test?.id]||{};
  const gB=r.ganador==='B';
  const IC=[C.green,C.amber,C.red,C.accent];
  function copiar(){
    const txt=`REPORTE TEST A/B — SynthAB\n\nProyecto: ${project.name}\nURL: ${test?.url}\n\nGanador: Variante ${r.ganador}\nUplift CVR: ${r.uplift_cvr>0?'+':''}${Number(r.uplift_cvr).toFixed(1)}%\nConfianza: ${r.confianza}%\n\nRecomendación:\n${r.recomendacion}`;
    navigator.clipboard.writeText(txt).then(()=>alert('Copiado ✓'));
  }
  if(!r.ganador) return(
    <div className='fade' style={{padding:'28px 32px'}}>
      <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'20px'}}>← {project.name}</button>
      <Card style={{textAlign:'center',padding:'48px'}}>
        <p style={{fontSize:'32px',marginBottom:'12px'}}>◎</p>
        <p style={T.h3}>Test en curso — sin resultados todavía</p>
        <p style={{...T.body,marginTop:'6px'}}>Los resultados aparecerán aquí cuando la simulación esté completada.</p>
      </Card>
    </div>
  );
  return(
    <div className='fade' style={{padding:'28px 32px',maxWidth:'680px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'6px',display:'block'}}>← {project.name}</button>
          <h1 style={T.h1}>{test?.name||'Reporte'}</h1>
          <p style={{...T.mono,marginTop:'3px'}}>{test?.url}</p>
        </div>
        <Btn variant='ghost' onClick={copiar}>Copiar reporte</Btn>
      </div>
      <div style={{background:'#0A1A14',border:'1px solid rgba(0,212,170,0.2)',borderRadius:'12px',padding:'18px 20px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px'}}>
        <span style={{fontSize:'28px'}}>🏆</span>
        <div style={{flex:1}}>
          <p style={{fontSize:'16px',fontWeight:700,color:C.green,marginBottom:'3px'}}>Variante {r.ganador} gana</p>
          <p style={{fontSize:'12px',color:'#3A6A5A'}}>{r.confianza}% confianza estadística</p>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'28px',fontWeight:700,color:gB?C.green:C.red}}>{r.uplift_cvr>0?'+':''}{Number(r.uplift_cvr).toFixed(1)}%</div>
          <div style={{fontSize:'11px',color:'#3A5A4A'}}>uplift CVR</div>
        </div>
      </div>
      <Card style={{marginBottom:'12px'}}>
        <p style={{...T.label,marginBottom:'10px'}}>Métricas principales</p>
        {[
          {name:'Tasa de conversión ⭐',a:(r.cvr_a||0).toFixed(1)+'%',b:(r.cvr_b||0).toFixed(1)+'%',diff:r.uplift_cvr,pos:gB},
          {name:'Clics en CTA',a:(r.clics_cta_a||0)+'%',b:(r.clics_cta_b||0)+'%',diff:(((r.clics_cta_b-r.clics_cta_a)/(r.clics_cta_a||1))*100).toFixed(1),pos:r.clics_cta_b>r.clics_cta_a},
          {name:'Tasa de rebote',a:(r.rebote_a||0)+'%',b:(r.rebote_b||0)+'%',diff:(((r.rebote_b-r.rebote_a)/(r.rebote_a||1))*100).toFixed(1),pos:r.rebote_b<r.rebote_a},
        ].map(m=>(
          <div key={m.name} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:'13px',color:C.txtMid,flex:1}}>{m.name}</span>
            <span style={{fontSize:'12px',color:C.txtDim}}>A: {m.a}</span>
            <span style={{fontSize:'14px',fontWeight:600,color:C.white}}>B: {m.b}</span>
            <span style={{fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:'20px',background:m.pos?C.greenDim:C.redDim,color:m.pos?C.green:C.red}}>{m.diff>0?'+':''}{Number(m.diff).toFixed(1)}%</span>
          </div>
        ))}
      </Card>
      {r.segmentos&&r.segmentos.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Por segmento</p>
          {r.segmentos.map(sg=>(
            <div key={sg.nombre} style={{display:'flex',alignItems:'center',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'12px'}}>
              <span style={{minWidth:'55px',fontWeight:600,color:C.txt}}>{sg.nombre}</span>
              <span style={{flex:1,color:C.txtMid}}>{sg.resultado}</span>
              <Tag color={sg.resultado.toLowerCase().includes('b')?'green':'amber'}>{sg.diff_pct>0?'+':''}{sg.diff_pct}%</Tag>
            </div>
          ))}
        </Card>
      )}
      {r.razones_abandono&&r.razones_abandono.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Razones de abandono — Variante B</p>
          {r.razones_abandono.map((ra,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:C.accent,flexShrink:0,marginTop:'3px'}}>◆</span>{ra}
            </div>
          ))}
        </Card>
      )}
      {r.insights&&r.insights.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Insights clave</p>
          {r.insights.map((ins,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:IC[i]||C.txtDim,flexShrink:0,marginTop:'3px'}}>◆</span>{ins}
            </div>
          ))}
        </Card>
      )}
      {r.recomendacion&&(
        <div style={{background:'#0F0F2A',border:`1px solid rgba(108,99,255,0.2)`,borderRadius:'12px',padding:'16px 18px',display:'flex',gap:'12px'}}>
          <span style={{fontSize:'18px',flexShrink:0}}>✦</span>
          <div>
            <p style={{...T.h3,marginBottom:'4px'}}>Recomendación</p>
            <p style={{...T.body}}>{r.recomendacion}</p>
          </div>
        </div>
      )}
    </div>
  );
}

// ── API SCREEN ────────────────────────────────────────────────────────────
function ApiScreen({onReady}){
  const [key,setKey]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  async function verify(){
    setLoading(true);setErr('');
    try{await callClaude(key,[{role:'user',content:'di ok'}],'Di solo: ok');onReady(key);}
    catch(e){setErr('Clave inválida: '+e.message);}
    setLoading(false);
  }
  return(
    <div style={{maxWidth:'400px',margin:'0 auto',padding:'64px 20px'}}>
      <div style={{textAlign:'center',marginBottom:'32px'}}>
        <div style={{width:'52px',height:'52px',borderRadius:'13px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',margin:'0 auto 16px'}}>⬡</div>
        <h1 style={{...T.h1,textAlign:'center',marginBottom:'6px'}}>SynthAB</h1>
        <p style={{...T.body,textAlign:'center'}}>Tests A/B con usuarios sintéticos.<br/>Resultados en minutos, no semanas.</p>
      </div>
      <Card>
        <label style={{...T.label,display:'block',marginBottom:'6px'}}>API Key de Anthropic</label>
        <input type='password' value={key} onChange={e=>setKey(e.target.value)} placeholder='sk-ant-api03-...' onKeyDown={e=>e.key==='Enter'&&verify()}
          style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'12px',fontFamily:'monospace',outline:'none',marginBottom:'8px'}}/>
        {err&&<p style={{color:C.red,fontSize:'12px',marginBottom:'8px'}}>{err}</p>}
        <p style={{...T.small}}>Consíguela en <a href='https://console.anthropic.com' target='_blank' style={{color:C.accent}}>console.anthropic.com</a> → API Keys</p>
      </Card>
      <button onClick={verify} disabled={key.length<20||loading}
        style={{width:'100%',marginTop:'12px',background:C.accent,color:'#fff',border:'none',borderRadius:'8px',padding:'12px',fontSize:'13px',fontWeight:600,cursor:key.length<20?'not-allowed':'pointer',opacity:key.length<20?0.4:1}}>
        {loading?'Verificando...':'Entrar →'}
      </button>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [apiKey,setApiKey]=useState('');
  const [nav,setNav]=useState('projects');
  const [projects,setProjects]=useState([PILOT_PROJECT]);
  const [view,setView]=useState({screen:'list'});

  if(!apiKey) return(
    <div style={{background:C.bg,minHeight:'100vh'}}>
      <div style={{borderBottom:`1px solid ${C.border}`,padding:'14px 28px',background:'#0A0A16',display:'flex',alignItems:'center',gap:'8px'}}>
        <div style={{width:'28px',height:'28px',borderRadius:'7px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px'}}>⬡</div>
        <span style={{fontSize:'14px',fontWeight:700,color:C.white}}>SynthAB</span>
      </div>
      <ApiScreen onReady={setApiKey}/>
    </div>
  );

  function addProject(p){setProjects(prev=>[...prev,p]);setView({screen:'detail',project:p});}
  function addTest(projectId,t){
    setProjects(prev=>prev.map(p=>p.id===projectId?{...p,tests:[...p.tests,t]}:p));
    const updatedProject=projects.find(p=>p.id===projectId);
    setView({screen:'detail',project:{...updatedProject,tests:[...updatedProject.tests,t]}});
  }

  const currentProject=view.project?projects.find(p=>p.id===view.project.id)||view.project:null;

  return(
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar active={nav} onNav={id=>{setNav(id);setView({screen:'list'});}} apiKey={apiKey} onLogout={()=>setApiKey('')}/>
      <div style={{flex:1,overflowY:'auto',minWidth:0}}>
        {nav==='projects'&&(
          <>
            {view.screen==='list'&&<ProjectsList projects={projects} onSelect={p=>setView({screen:'detail',project:p})} onCreate={()=>setView({screen:'create'})}/>}
            {view.screen==='detail'&&currentProject&&<ProjectDetail project={currentProject} onBack={()=>setView({screen:'list'})} onNewTest={()=>setView({screen:'newtest',project:currentProject})} onViewTest={t=>setView({screen:'report',project:currentProject,test:t})} onViewReport={()=>setView({screen:'report',project:currentProject,test:currentProject.tests[0]})}/>}
            {view.screen==='create'&&<CreateProject onSave={addProject} onCancel={()=>setView({screen:'list'})}/>}
            {view.screen==='newtest'&&currentProject&&<CreateTest project={currentProject} apiKey={apiKey} onSave={t=>addTest(currentProject.id,t)} onCancel={()=>setView({screen:'detail',project:currentProject})}/>}
            {view.screen==='report'&&currentProject&&<ReportView project={currentProject} test={view.test} results={view.test?.results} onBack={()=>setView({screen:'detail',project:currentProject})}/>}
          </>
        )}
        {nav==='reports'&&(
          <div className='fade' style={{padding:'28px 32px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Reportes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Resumen de todos los tests completados.</p>
            {projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>({...t,projectName:p.name}))).length===0
              ? <Card style={{textAlign:'center',padding:'48px',color:C.txtDim}}><p>No hay tests completados todavía.</p></Card>
              : projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>(
                <Card key={t.id} style={{marginBottom:'10px',cursor:'pointer'}} onClick={()=>{setNav('projects');setView({screen:'report',project:p,test:t});}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <Tag color='blue'>{p.name}</Tag>
                      <p style={{...T.h3,marginTop:'6px',marginBottom:'3px'}}>{t.name}</p>
                      <p style={{...T.mono,fontSize:'11px'}}>{t.url}</p>
                    </div>
                    {t.ganador&&<div style={{textAlign:'right'}}>
                      <div style={{fontSize:'20px',fontWeight:700,color:C.green}}>{t.uplift}</div>
                      <div style={T.small}>Variante {t.ganador}</div>
                    </div>}
                  </div>
                </Card>
              )))}
          </div>
        )}
        {nav==='settings'&&(
          <div className='fade' style={{padding:'28px 32px',maxWidth:'500px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Ajustes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Configuración de la cuenta.</p>
            <Card>
              <p style={{...T.label,marginBottom:'10px'}}>Conexión API</p>
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
                <div style={{width:'8px',height:'8px',borderRadius:'50%',background:C.green}}/>
                <span style={{fontSize:'13px',color:C.green,fontWeight:600}}>Conectada</span>
              </div>
              <p style={{...T.mono,marginBottom:'12px'}}>{apiKey.slice(0,20)}...</p>
              <Btn variant='ghost' small onClick={()=>setApiKey('')}>Cambiar clave API</Btn>
            </Card>
            <Card style={{marginTop:'12px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Proyecto piloto</p>
              <p style={{...T.body,marginBottom:'10px'}}>El proyecto "Moda Urban" viene precargado con datos reales y un test completado para que puedas explorar la app.</p>
              <Tag color='green'>1 test completado</Tag>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
