// ── TOKENS ──────────────────────────────────────────────────────────────
const C={

  red:'#FF5C5C',redDim:'rgba(255,92,92,0.1)',
  blue:'#4B9EFF',blueDim:'rgba(75,158,255,0.1)',

const T={

  h2:{fontSize:'17px',fontWeight:600,color:C.white},
  h3:{fontSize:'14px',fontWeight:600,color:C.txt},
  body:{fontSize:'13px',color:C.txtMid,lineHeight:1.6},
  small:{fontSize:'11px',color:C.txtDim,lineHeight:1.5},

// ── SHARED COMPONENTS ────────────────────────────────────────────────────
const Card=({children,style,onClick})=>(
  <div onClick={onClick} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px 18px',...style}}>
    {children}
  </div>
);

const Btn=({children,onClick,variant='primary',disabled,style,small})=>{
  const base={border:'none',borderRadius:'8px',cursor:disabled?'not-allowed':'pointer',fontWeight:600,opacity:disabled?0.4:1,transition:'opacity 0.15s',...style};
  const pad=small?{padding:'6px 12px',fontSize:'12px'}:{padding:'10px 18px',fontSize:'13px'};
  const vars={
    primary:{...base,...pad,background:C.accent,color:'#fff'},
    ghost:{...base,...pad,background:'transparent',color:C.txtMid,border:`1px solid ${C.border}`},
    green:{...base,...pad,background:C.green,color:'#000'},
    danger:{...base,...pad,background:C.red,color:'#fff'},
  };
  return <button style={vars[variant]} onClick={disabled?null:onClick}>{children}</button>;
};

const Input=({label,value,onChange,placeholder,type='text',hint,required,style})=>(
  <div style={{marginBottom:'14px',...style}}>
    {label&&<label style={{...T.label,display:'block',marginBottom:'5px'}}>{label}{required&&<span style={{color:C.red}}> *</span>}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'13px',outline:'none'}}/>
    {hint&&<p style={{...T.small,marginTop:'4px'}}>{hint}</p>}
  </div>
);

const Select=({label,value,onChange,options,required})=>(
  <div style={{marginBottom:'14px'}}>
    {label&&<label style={{...T.label,display:'block',marginBottom:'5px'}}>{label}{required&&<span style={{color:C.red}}> *</span>}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'13px',outline:'none'}}>
      {options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
    </select>
  </div>
);

const Tag=({children,color='default'})=>{
  const map={default:{bg:C.border,col:C.txtMid},green:{bg:C.greenDim,col:C.green},amber:{bg:C.amberDim,col:C.amber},red:{bg:C.redDim,col:C.red},blue:{bg:C.blueDim,col:C.blue},purple:{bg:C.accentDim,col:C.accent}};
  const m=map[color]||map.default;
  return <span style={{fontSize:'11px',fontWeight:600,padding:'2px 8px',borderRadius:'20px',background:m.bg,color:m.col}}>{children}</span>;
};

function Tooltip({text}){
  const [show,setShow]=useState(false);
  return(
    <div style={{position:'relative',display:'inline-flex'}}>
      <div
        onMouseEnter={()=>setShow(true)}
        onMouseLeave={()=>setShow(false)}
        onClick={()=>setShow(!show)}
        style={{width:'16px',height:'16px',borderRadius:'50%',background:'#1A1A35',border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:'10px',color:C.txtMid,flexShrink:0}}>
        ?
      </div>
      {show&&(
        <div style={{position:'absolute',bottom:'22px',left:'50%',transform:'translateX(-50%)',background:'#1A1A35',border:`1px solid ${C.borderHi}`,borderRadius:'8px',padding:'10px 12px',fontSize:'11px',color:C.txtMid,lineHeight:'1.6',width:'260px',zIndex:100,boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
          <div style={{color:C.accent,fontWeight:600,marginBottom:'4px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.05em'}}>Dónde encontrarlo</div>
          {text}
          <div style={{position:'absolute',bottom:'-5px',left:'50%',transform:'translateX(-50%)',width:'8px',height:'8px',background:'#1A1A35',border:`1px solid ${C.borderHi}`,borderBottom:'none',borderRight:'none',transform:'translateX(-50%) rotate(225deg)'}}/>
        </div>
      )}
    </div>
  );
}

function KpiInput({label,value,onChange,placeholder,tooltip}){

    <div style={{marginBottom:'4px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'5px'}}>

}

const Spinner=({text,sub})=>(
  <div style={{textAlign:'center',padding:'56px 20px'}}>
    <div style={{width:'32px',height:'32px',border:`3px solid ${C.border}`,borderTop:`3px solid ${C.accent}`,borderRadius:'50%',animation:'spin 0.8s linear infinite',margin:'0 auto 14px'}}/>

const QualityBar=({score})=>{
  const col=score>=80?C.green:score>=55?C.amber:C.red;
  const lbl=score>=80?'Alta precisión':score>=55?'Precisión media':'Precisión básica';
  const next=score<55?'Sube los CSV de GA4 para mejorar la precisión':score<80?'Añade Exp2 y Exp3 para llegar al 90%':'Datos completos';
  return(
    <div style={{background:'#0A0A18',border:`1px solid ${C.border}`,borderRadius:'10px',padding:'14px 16px',marginBottom:'18px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
        <span style={{...T.label}}>Calidad de los perfiles sintéticos</span>
        <span style={{fontSize:'20px',fontWeight:700,color:col}}>{score}%</span>

      <div style={{background:'#14142A',borderRadius:'20px',height:'5px',marginBottom:'7px'}}>
        <div style={{width:score+'%',height:'100%',borderRadius:'20px',background:col,transition:'width 0.6s'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between'}}>
        <span style={{fontSize:'11px',color:col,fontWeight:600}}>{lbl}</span>
        {score<90&&<span style={T.small}>↑ {next}</span>}
      </div>
    </div>
  );
};

// ── CLAUDE API ────────────────────────────────────────────────────────────
async function callClaude(apiKey,messages,system){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:4096,system,messages})
  });
  const data=await res.json();
  if(!data.content) throw new Error(data.error?data.error.message:'Error API');
  return data.content.map(b=>b.text||'').join('');
}
function parseJSON(raw){
  const c=raw.replace(/```json/g,'').replace(/```/g,'').trim();
  const s1=c.indexOf('['),s2=c.indexOf('{');
  if(s1!==-1&&(s2===-1||s1<s2)) return JSON.parse(c.slice(s1,c.lastIndexOf(']')+1));
  return JSON.parse(c.slice(s2,c.lastIndexOf('}')+1));
}
function parseCSV(text){
  const clean=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  const lines=clean.split('\n').filter(l=>l.trim());
  if(lines.length<2) return null;
  const sep=lines[0].includes(';')?';':',';
  const headers=lines[0].split(sep).map(h=>h.trim().replace(/"/g,''));
  const rows=lines.slice(1).map(line=>{const vals=line.split(sep).map(v=>v.trim().replace(/"/g,''));const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||'';});return obj;});
  return{headers,rows,raw:clean};
}

                    <div style={T.small}>Variante {t.ganador} gana</div>
                  </div>
                )}
              </div>
            </Card>
          ))
        }
      </div>
    </div>
  );
}

function CreateProject({onSave, onCancel, initial, apiKey}){
  const STEPS=[
    {num:'01',label:'KPIs'},
    {num:'02',label:'Comportamiento'},
    {num:'03',label:'Contexto usuario'},
    {num:'04',label:'Funnel'},

  const [sub,setSub]=useState(0);

  // ── Última actualización + insights IA (todos los bloques) ──────────────
  const [timestamps,setTimestamps]=useState(initial?.timestamps||{});
  const [insights,setInsights]=useState(initial?.insights||{});
  const [savingAI,setSavingAI]=useState(false);
  function touch(key){ setTimestamps(prev=>({...prev,[key]:new Date().toISOString()})); }
  function timeAgo(iso){
    if(!iso) return null;
    const days=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
    if(days<=0) return 'hoy';
    if(days===1) return 'hace 1 día';
    if(days<30) return `hace ${days} días`;
    const months=Math.floor(days/30);
    if(months<12) return `hace ${months} ${months===1?'mes':'meses'}`;
    const years=Math.floor(months/12);
    return `hace ${years} ${years===1?'año':'años'}`;
  }
  function UpdatedBadge({k}){
    const t=timestamps[k];
    if(!t) return <span style={{fontSize:'11px',color:C.txtDim,whiteSpace:'nowrap'}}>🕐 Sin datos aún</span>;
    const d=new Date(t);
    const fecha=d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
    return <span style={{fontSize:'11px',color:C.txtDim,whiteSpace:'nowrap'}}>🕐 Última subida: {fecha} ({timeAgo(t)})</span>;
  }
  function InsightBlock({k}){
    const ins=insights[k];
    if(!ins) return null;
    return(
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginTop:'12px'}}>
        <div style={{background:'#0A0A18',borderRadius:'8px',padding:'10px 12px'}}>

        </div>

  function CardHeader({title,k,tag}){
    return(
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px',gap:'10px'}}>
        <div style={{display:'flex',gap:'8px',alignItems:'center'}}>{tag}<p style={T.h3}>{title}</p></div>
        <UpdatedBadge k={k}/>
      </div>
    );
  }

  // Step 0 — KPIs
  const [name,setName]=useState(initial?.name||'');
  const [domain,setDomain]=useState(initial?.domain||'');
  const [sector,setSector]=useState(initial?.sector||'moda');
  const [periodo,setPeriodo]=useState(initial?.periodo||'');
  const [sesiones,setSesiones]=useState(initial?.kpis?.trafico||'');
  const [transacciones,setTransacciones]=useState(initial?.kpis?.transacciones||'');
  const [ingresos,setIngresos]=useState(initial?.kpis?.ingresos||'');
  const [cvr,setCvr]=useState(initial?.kpis?.cvr||'');
  const [rebote,setRebote]=useState(initial?.kpis?.rebote||'');
  const [ticket,setTicket]=useState(initial?.kpis?.ticket||'');
  const [desktop,setDesktop]=useState(initial?.kpis?.desktop||42);
  const [mobile,setMobile]=useState(initial?.kpis?.mobile||51);
  const [tablet,setTablet]=useState(initial?.kpis?.tablet||7);
  const [kpisCsv,setKpisCsv]=useState(initial?.kpisCsv||null);
  const refKpis=useRef();
  const [kpisImg,setKpisImg]=useState(initial?.kpisImg||null);
  const refKpisImg=useRef();

  // Los KPIs se leen SIEMPRE del CSV subido — nada de valores manuales que puedan quedar desfasados.
  // Si se quita el CSV, se limpian también los valores derivados (ver setKpisCsvClean más abajo).
  useEffect(()=>{
    if(!kpisCsv||!kpisCsv.rows||!kpisCsv.rows.length) return;
    const headers=kpisCsv.headers;
    const rows=kpisCsv.rows;
    const findCol=(...keys)=>headers.find(h=>keys.some(k=>h.toLowerCase().includes(k)));
    const row=rows[0];
    const val=(...keys)=>{ const h=findCol(...keys); return h?row[h]:null; };
    const ok=v=>v!==null&&v!==undefined&&v!=='';
    const nSes=val('sesion','session'); setSesiones(ok(nSes)?nSes:'');
    const nTrans=val('transacc','transaction'); setTransacciones(ok(nTrans)?nTrans:'');
    const nIng=val('ingreso','revenue'); setIngresos(ok(nIng)?nIng:'');
    const nCvr=val('conversión','conversion','cvr'); setCvr(ok(nCvr)?nCvr:'');
    const nReb=val('rebote','bounce'); setRebote(ok(nReb)?nReb:'');
    const nTic=val('ticket','aov','valor medio','ingresos por transacc'); setTicket(ok(nTic)?nTic:'');

    // Desglose por dispositivo: solo si el CSV trae varias filas con dimensión de dispositivo
    const devCol=findCol('dispositivo','device');
    if(devCol&&rows.length>1){
      const sesCol=findCol('sesion','session');
      const tot={desktop:0,mobile:0,tablet:0};
      let sum=0;
      rows.forEach(r=>{
        const n=parseFloat((r[sesCol]||'0').toString().replace(/\./g,'').replace(',','.'))||0;
        sum+=n;
        const dv=(r[devCol]||'').toLowerCase();
        if(dv.includes('mobile')||dv.includes('móvil')) tot.mobile+=n;
        else if(dv.includes('desktop')||dv.includes('escritorio')) tot.desktop+=n;
        else if(dv.includes('tablet')) tot.tablet+=n;
      });
      if(sum>0){
        setDesktop(Math.round(tot.desktop/sum*100));
        setMobile(Math.round(tot.mobile/sum*100));
        setTablet(Math.round(tot.tablet/sum*100));
      }
    }

    // Período: detecta columna de fecha y usa el rango real de los datos subidos
    const dateCol=findCol('fecha','date','día');
    if(dateCol){
      const vals=rows.map(r=>r[dateCol]).filter(Boolean).sort();
      if(vals.length) setPeriodo(`${vals[0]} → ${vals[vals.length-1]}`);
    }else{
      setPeriodo('');
    }
  },[kpisCsv]);

  // Wrapper del setter de kpisCsv: al quitar el CSV, limpia también los valores derivados
  function setKpisCsvClean(v){
    setKpisCsv(v);
    if(!v){
      setSesiones('');setTransacciones('');setIngresos('');setCvr('');setRebote('');setTicket('');setPeriodo('');

  // Step 1 — Comportamiento
  const [exp1,setExp1]=useState(initial?.exp1Data||null);

  const [exp3,setExp3]=useState(initial?.exp3Data||null);

  // Step 2 — Contexto usuario (antes "Adquisición")
  const canales=initial?.canales||[]; // se conserva solo para compatibilidad con la vista de detalle

  const [checkoutStepImgs,setCheckoutStepImgs]=useState(initial?.checkoutStepImgs||{});

  const [funnelVolCsv,setFunnelVolCsv]=useState(initial?.funnelVolCsv||null);
  const refFunnelVol=useRef();
  const [funnelVolImg,setFunnelVolImg]=useState(initial?.funnelVolImg||null);
  const refFunnelVolImg=useRef();
  const [funnelDispCsv,setFunnelDispCsv]=useState(initial?.funnelDispCsv||null);
  const refFunnelDisp=useRef();
  const [funnelDispImg,setFunnelDispImg]=useState(initial?.funnelDispImg||null);

  function score(){
    let s=30;
    if(cvr&&sesiones&&ticket) s+=10;

    if(exp1) s+=20;
    if(exp2) s+=10;
    if(exp3) s+=10;
    if(canales.some(c=>c.canal)) s+=5;
    if(crmSeleccionado||crmCsv) s+=10;
    return Math.min(s,100);
  }

  function handleFile(f,setter,key){
    if(!f) return;
    const r=new FileReader();
    r.onload=e=>{const p=parseCSV(e.target.result);if(p){setter({...p,fileName:f.name});if(key) touch(key);}};

  // Genera "Comportamiento detectado" + "Oportunidad" para cada bloque que tenga datos.
  // Se ejecuta una sola vez al guardar (no por cada subida) para minimizar llamadas a la API.
  async function generarInsights(){
    const bloques={
      kpis: (cvr&&sesiones)||kpisCsv? `CVR ${cvr}%, sesiones ${sesiones}, rebote ${rebote}%, ticket ${ticket}, dispositivos desktop ${desktop}% / mobile ${mobile}% / tablet ${tablet}%.${kpisCsv?` CSV original — columnas: ${kpisCsv.headers.join(', ')}.`:''}`:null,
      exp1: exp1? `Columnas: ${(exp1.headers||[]).join(', ')}. Filas de ejemplo: ${JSON.stringify((exp1.rows||[]).slice(0,15))}`:null,
      exp2: exp2? `Columnas: ${(exp2.headers||[]).join(', ')}. Filas de ejemplo: ${JSON.stringify((exp2.rows||[]).slice(0,15))}`:null,
      exp3: exp3? `Columnas: ${(exp3.headers||[]).join(', ')}. Filas de ejemplo: ${JSON.stringify((exp3.rows||[]).slice(0,15))}`:null,
      busqueda: busquedaCsv? `Columnas: ${(busquedaCsv.headers||[]).join(', ')}. Filas: ${JSON.stringify((busquedaCsv.rows||[]).slice(0,15))}`:null,
      voz: vozCsv? `Columnas: ${(vozCsv.headers||[]).join(', ')}. Filas: ${JSON.stringify((vozCsv.rows||[]).slice(0,15))}`:null,
      funnelQual: Object.keys(funnelQualImgs).length||Object.keys(checkoutStepImgs).length? `Capturas subidas para: ${Object.keys(funnelQualImgs).join(', ')}${checkoutSteps.length?', Checkout ('+checkoutSteps.map(s=>s.nombre).join(', ')+')':''}.`:null,
      funnelVol: funnelVolCsv? `Columnas: ${(funnelVolCsv.headers||[]).join(', ')}. Filas: ${JSON.stringify((funnelVolCsv.rows||[]).slice(0,20))}`:null,
      funnelDisp: funnelDispCsv? `Columnas: ${(funnelDispCsv.headers||[]).join(', ')}. Filas: ${JSON.stringify((funnelDispCsv.rows||[]).slice(0,20))}`:null,
      crm: crmCsv? `Columnas: ${(crmCsv.headers||[]).join(', ')}. Filas: ${JSON.stringify((crmCsv.rows||[]).slice(0,20))}`:null,
    };
    const activos=Object.entries(bloques).filter(([,v])=>v);
    if(!apiKey||activos.length===0) return;
    setSavingAI(true);
    try{
      const prompt=`Eres un analista CRO. Para cada uno de estos bloques de datos de un ecommerce de sector "${sector}", periodo "${periodo||'no especificado'}", devuelve un comportamiento detectado (1 frase concreta, con cifras si las hay) y una oportunidad accionable (1 frase). Bloques:\n\n${activos.map(([k,v])=>`### ${k}\n${v}`).join('\n\n')}\n\nResponde SOLO con un JSON así, una entrada por cada bloque listado arriba, usando exactamente esas claves: {"kpis":{"comportamiento":"...","oportunidad":"..."}, ...}`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido, sin markdown ni texto extra.');
      const parsed=JSON.parse(raw.replace(/```json/g,'').replace(/```/g,'').trim());
      setInsights(prev=>({...prev,...parsed}));
    }catch(e){
      console.error('No se pudieron generar los insights:',e);
    }finally{
      setSavingAI(false);
    }
  }

  async function handleSave(){
    await generarInsights();

                  {open&&(
                    <div style={{padding:'12px 14px',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}}>
                      <MiniImgBox label='Heatmap de clics' val={imgs.heatmapClics} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],heatmapClics:v}}))}/>
                      <MiniImgBox label='Mapa de scroll' val={imgs.mapaScroll} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],mapaScroll:v}}))}/>
                      <MiniImgBox label='Señales de frustración' val={imgs.frustracion} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],frustracion:v}}))}/>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Checkout — pasos configurables */}
            <div style={{border:`1px solid ${C.border}`,borderRadius:'8px',marginBottom:'8px',overflow:'hidden'}}>
              <div onClick={()=>setOpenPagina(openPagina==='Checkout'?null:'Checkout')}
                style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',cursor:'pointer',background:'#0F0F1C'}}>
                <span style={{fontSize:'13px',color:C.txt}}>Checkout <span style={{color:C.txtDim,fontSize:'11px'}}>· {checkoutSteps.length} pasos</span></span>
                <span style={{fontSize:'11px',color:C.txtDim}}>{openPagina==='Checkout'?'▲':'▼'}</span>
              </div>
              {openPagina==='Checkout'&&(
                <div style={{padding:'12px 14px'}}>
                  <p style={{...T.small,marginBottom:'10px'}}>Cada ecommerce tiene su propio número de pasos de checkout. Sube solo los que existan en el tuyo.</p>
                  {checkoutSteps.map((st,i)=>{
                    const imgs=checkoutStepImgs[st.id]||{};
                    return(
                      <div key={st.id} style={{border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',marginBottom:'8px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
                          <span style={{width:'20px',height:'20px',borderRadius:'50%',background:C.accentDim,color:C.accent,fontSize:'11px',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{i+1}</span>
                          <input value={st.nombre} onChange={e=>{const n=[...checkoutSteps];n[i]={...n[i],nombre:e.target.value};setCheckoutSteps(n);}}
                            style={{flex:1,background:'#070713',border:`1px solid ${C.border}`,borderRadius:'6px',padding:'6px 10px',color:C.txt,fontSize:'12px',outline:'none'}}/>
                          {checkoutSteps.length>1&&<button onClick={()=>setCheckoutSteps(checkoutSteps.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:C.txtDim,cursor:'pointer',fontSize:'13px'}}>✕</button>}
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}}>
                          <MiniImgBox label='Heatmap de clics' val={imgs.heatmapClics} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],heatmapClics:v}}))}/>
                          <MiniImgBox label='Mapa de scroll' val={imgs.mapaScroll} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],mapaScroll:v}}))}/>
                          <MiniImgBox label='Señales de frustración' val={imgs.frustracion} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],frustracion:v}}))}/>
                        </div>
                      </div>
                    );
                  })}
                  <button onClick={()=>setCheckoutSteps([...checkoutSteps,{id:Date.now(),nombre:`Paso ${checkoutSteps.length+1}`}])}
                    style={{fontSize:'12px',color:C.accent,background:'none',border:'none',cursor:'pointer',padding:'6px 0'}}>+ Añadir paso</button>
                </div>
              )}
            </div>
            <InsightBlock k='funnelQual'/>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(1)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              {isEdit&&<Btn variant='ghost' onClick={handleSave} disabled={savingAI}>{savingAI?'Analizando datos...':'Guardar cambios'}</Btn>}
              <Btn onClick={()=>setSub(3)}>Siguiente →</Btn>
            </div>
          </div>
        </div>
      )}

      {/* STEP 3 — Funnel */}
      {sub===3&&(
        <div>
          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Pasos del funnel y volumen' k='funnelVol'/>
            <p style={{...T.body,marginBottom:'10px'}}>La tasa de paso entre etapas importa más que el volumen absoluto: localiza el mayor cuello de botella. Período recomendado: últimos 90 días.</p>
            <DataBox parsedCsv={funnelVolCsv} refCsv={refFunnelVol} setterCsv={setFunnelVolCsv} k='funnelVol'
              label='CSV de la exploración de embudo' hint='Columnas: paso, usuarios/sesiones, % avanza, % abandono'
              tutorial={<span>GA4 → <b>Explorar → Exploración de embudo</b> → define los pasos (Home, Listado, PDP, Carrito, Checkout...) → icono exportar → CSV. Si no tienes acceso, sube una captura de la exploración.</span>}
              imgVal={funnelVolImg} refImg={refFunnelVolImg} setterImg={setFunnelVolImg}
            />
            <CsvTable parsed={funnelVolCsv}/>
            <InsightBlock k='funnelVol'/>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Funnel por dispositivo' k='funnelDisp'/>
            <p style={{...T.body,marginBottom:'10px'}}>Un funnel global puede ocultar que un paso funciona bien en desktop y falla en mobile. Usa el mismo período que en "Pasos del funnel" para poder comparar.</p>
            <DataBox parsedCsv={funnelDispCsv} refCsv={refFunnelDisp} setterCsv={setFunnelDispCsv} k='funnelDisp'
              label='CSV desglosado por dispositivo' hint='Misma exploración + dimensión "Categoría de dispositivo" (mínimo Mobile / Desktop)'
              tutorial={<span>GA4 → misma <b>Exploración de embudo</b> → añade la dimensión <b>Categoría de dispositivo</b> → exporta CSV desglosado, o sube una captura del desglose.</span>}
              imgVal={funnelDispImg} refImg={refFunnelDispImg} setterImg={setFunnelDispImg}
            />
            <CsvTable parsed={funnelDispCsv}/>
            <InsightBlock k='funnelDisp'/>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(2)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              {isEdit&&<Btn variant='ghost' onClick={handleSave} disabled={savingAI}>{savingAI?'Analizando datos...':'Guardar cambios'}</Btn>}
              <Btn onClick={()=>setSub(4)}>Siguiente →</Btn>
            </div>
          </div>
        </div>
      )}

      {/* STEP 4 — Negocio */}
      {sub===4&&(
        <div>
          <Card style={{marginBottom:'10px'}}>
            <p style={{...T.h3,marginBottom:'8px'}}>Descripción del negocio</p>
            <textarea value={descripcion} onChange={e=>setDescripcion(e.target.value)}
              placeholder='Ej: Ecommerce de moda urbana dirigido a mujeres 25-40 años, con fuerte presencia en Instagram...'
              style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'13px',outline:'none',resize:'vertical',minHeight:'60px'}}/>
            <p style={{...T.small,marginTop:'5px'}}>Cuanta más info des aquí, más contexto tendrá la IA para construir perfiles realistas.</p>
          </Card>

          {[
            {id:'producto',icon:'🛍️',label:'Producto y precio',preguntas:[
              {id:'productoEstrella',label:'¿Cuál es tu producto o categoría estrella?',tipo:'texto',placeholder:'Ej: Vestidos de verano, zapatillas urbanas...'},
              {id:'motivoDev',label:'¿Cuál es el principal motivo de devolución?',tipo:'texto',placeholder:'Ej: Talla incorrecta, no era como en la foto...'},
              {id:'estacionalidad',label:'¿Tienes estacionalidad marcada? ¿Cuándo son tus picos?',tipo:'texto',placeholder:'Ej: Picos en enero (rebajas) y junio (verano)'},
              {id:'precioFreno',label:'¿El precio es un freno frecuente para el cliente?',tipo:'sino'},
            ]},
            {id:'envio',icon:'📦',label:'Envío y logística',preguntas:[
              {id:'envioGratis',label:'¿Ofreces envío gratuito?',tipo:'sino'},
              {id:'envioCondicion',label:'¿Con qué condición?',tipo:'texto',placeholder:'Ej: Gratis a partir de 50€'},
              {id:'envioQueja',label:'¿El coste de envío es una queja frecuente?',tipo:'sino'},
              {id:'plazoEntrega',label:'¿Cuánto tarda en llegar un pedido?',tipo:'texto',placeholder:'Ej: 2-4 días hábiles en Península'},
              {id:'recogidaTienda',label:'¿Tienen opción de recogida en tienda?',tipo:'sino'},
            ]},
            {id:'fidelizacion',icon:'⭐',label:'Fidelización y recurrencia',preguntas:[
              {id:'programaPuntos',label:'¿Tienes programa de puntos o fidelización?',tipo:'sino'},
              {id:'descuentoRecurrente',label:'¿Haces descuentos especiales a clientes recurrentes?',tipo:'sino'},
              {id:'tiempoSegundaCompra',label:'¿Cuánto tarda en producirse la segunda compra de media?',tipo:'texto',placeholder:'Ej: Entre 2 y 4 meses'},
              {id:'clientesVip',label:'¿Tienes clientes VIP o segmento premium?',tipo:'sino'},
              {id:'pctRecurrencia',label:'¿Qué % de clientes repite compra aproximadamente?',tipo:'texto',placeholder:'Ej: Alrededor del 30% vuelve en 6 meses'},
            ]},
            {id:'marketing',icon:'📣',label:'Comunicación y marketing',preguntas:[
              {id:'hacenEmail',label:'¿Hacéis campañas de email?',tipo:'sino'},
              {id:'frecuenciaEmail',label:'¿Con qué frecuencia?',tipo:'texto',placeholder:'Ej: 2 emails semanales + newsletter mensual'},
              {id:'automatizaciones',label:'¿Tenéis automatizaciones activas? (carrito abandonado, bienvenida...)',tipo:'sino'},
              {id:'queAutomatizaciones',label:'¿Cuáles?',tipo:'texto',placeholder:'Ej: Carrito abandonado a las 2h y 24h, email bienvenida con descuento'},
              {id:'smsWhatsapp',label:'¿Usáis SMS o WhatsApp para comunicaros con clientes?',tipo:'sino'},
              {id:'influencers',label:'¿Trabajáis con influencers o afiliados?',tipo:'sino'},
            ]},
            {id:'fisica',icon:'🏪',label:'Presencia física y omnicanal',preguntas:[
              {id:'tiendaFisica',label:'¿Tenéis tienda física además del ecommerce?',tipo:'sino'},
              {id:'clientesCruzados',label:'¿Los clientes de tienda también compran online?',tipo:'sino'},
              {id:'marketplaces',label:'¿Vendéis en marketplaces? (Amazon, Zalando...)',tipo:'sino'},
              {id:'queMarketplaces',label:'¿Cuáles?',tipo:'texto',placeholder:'Ej: Amazon y Zalando con stock limitado'},
            ]},
            {id:'fricciones',icon:'💬',label:'Dudas y fricciones frecuentes',preguntas:[
              {id:'quejaFrecuente',label:'¿Cuál es la queja o duda más frecuente del cliente?',tipo:'texto',placeholder:'Ej: Dudas sobre tallas, retrasos en temporada alta...'},
              {id:'puntoContacto',label:'¿En qué punto del proceso contactan más con atención al cliente?',tipo:'texto',placeholder:'Ej: Después de comprar para saber el estado del pedido'},
              {id:'tieneChat',label:'¿Tienes chat en la web?',tipo:'sino'},
              {id:'tipoChat',label:'¿De qué tipo?',tipo:'texto',placeholder:'Ej: Chatbot IA + agente humano en horario laboral'},
            ]},
          ].map(bloque=>(
            <BloqueNegocio key={bloque.id} bloque={bloque}
              valores={negocioRespuestas}
              onChange={(id,val)=>setNegocioRespuestas(prev=>({...prev,[id]:val}))}/>
          ))}

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Datos de BBDD / CRM' k='crm' tag={<Tag color='amber'>Opcional</Tag>}/>
            <p style={{...T.body,marginBottom:'10px'}}>Sube un CSV exportado de tu CRM con datos agregados y anonimizados. No necesitamos emails ni nombres — solo patrones de comportamiento. Período recomendado: últimos 12 meses (la recurrencia y el LTV necesitan ventana larga).</p>
            <div style={{background:'#0A1A14',border:`1px solid rgba(0,212,170,0.15)`,borderRadius:'8px',padding:'9px 12px',marginBottom:'12px',fontSize:'11px',color:C.green}}>
              🔒 Solo datos agregados — sin emails, sin nombres, sin datos personales. Compatible con GDPR.
            </div>
            <div onClick={()=>refCrm.current.click()}
              style={{border:`1.5px dashed ${crmCsv?C.green:C.border}`,borderRadius:'10px',padding:'16px',textAlign:'center',cursor:'pointer',background:crmCsv?C.greenDim:'#070713'}}>
              <input ref={refCrm} type='file' accept='.csv,.xlsx,.xls,.txt' style={{display:'none'}} onChange={e=>handleFile(e.target.files[0],setCrmCsv,'crm')}/>
              <div style={{fontSize:'20px',marginBottom:'5px'}}>📁</div>
              {crmCsv?<p style={{fontSize:'13px',fontWeight:600,color:C.green}}>{crmCsv.fileName} · {crmCsv.rows?.length||0} filas</p>
                :<p style={{fontSize:'13px',color:C.txtDim}}>Arrastra CSV/Excel o haz clic para subir</p>}
              <p style={{...T.small,marginTop:'4px'}}>Columnas recomendadas: segmento, ticket_medio, frecuencia_compra, ltv, canal_origen, fecha_ultima_compra</p>
            </div>
            {crmCsv&&<div style={{...T.small,background:'#0A1A14',border:`1px solid rgba(0,212,170,0.15)`,borderRadius:'6px',padding:'7px 10px',marginTop:'6px'}}>✓ Columnas detectadas: {crmCsv.headers?.join(', ')}</div>}
            <InsightBlock k='crm'/>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(3)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              {isEdit&&<Btn variant='ghost' onClick={handleSave} disabled={savingAI}>{savingAI?'Analizando datos...':'Guardar cambios'}</Btn>}
              <Btn variant='green' onClick={handleSave} disabled={savingAI}>{savingAI?'Analizando datos...':(isEdit?'Guardar cambios':'Crear proyecto')+' ('+score()+'% precisión)'}</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CREATE TEST ───────────────────────────────────────────────────────────
const AVATAR_COLORS=['#6C63FF','#00D4AA','#FF6B9D','#F5A623','#4ECDC4','#A78BFA','#34D399','#FB923C'];
const NIVEL_CONSCIENCIA=['No consciente del problema','Consciente del problema','Consciente de la solución','Consciente del producto','Listo para comprar'];
const TIPO_PERFIL_COLOR={esceptico:'amber',cazador_precio:'blue',impulsivo:'green',analitico:'purple',perdido:'default',ideal:'green',recurrente:'green',primerizo:'amber',movil:'blue',escritorio:'default',regalo:'amber',investigador:'default',comparador:'amber',decidido:'green'};

function ProfileModal({profile, idx, onClose}){
  const col = AVATAR_COLORS[idx%8];
  const nc = profile.nivel_consciencia||3;
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#0F0F1C',border:`1px solid ${C.borderHi}`,borderRadius:'14px',width:'100%',maxWidth:'580px',maxHeight:'88vh',overflowY:'auto'}}>

        {/* Header */}
        <div style={{padding:'20px 22px',borderBottom:`1px solid ${C.border}`,display:'flex',gap:'14px',alignItems:'center',position:'sticky',top:0,background:'#0F0F1C',zIndex:1}}>
          <div style={{width:'48px',height:'48px',borderRadius:'50%',background:col,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',fontWeight:700,color:'#fff',flexShrink:0}}>{profile.initials||'P'+(idx+1)}</div>
          <div style={{flex:1}}>
            <p style={{fontSize:'16px',fontWeight:700,color:C.white,marginBottom:'2px'}}>{profile.nombre||`Perfil #${profile.id}`}</p>
            <p style={{fontSize:'12px',color:C.txtMid}}>{profile.edad} · {profile.profesion||profile.genero} · {profile.ciudad} · {profile.dispositivo}</p>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:'20px',fontWeight:700,color:profile.prob_conversion>0.05?C.green:C.amber}}>{(profile.prob_conversion*100).toFixed(1)}%</div>
            <div style={{fontSize:'10px',color:C.txtDim}}>prob. conversión</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:C.txtDim,cursor:'pointer',fontSize:'18px',marginLeft:'8px'}}>✕</button>
        </div>

        <div style={{padding:'18px 22px',display:'flex',flexDirection:'column',gap:'14px'}}>

          {/* Tipo de perfil */}
          {profile.tipo_perfil&&(
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
              {(Array.isArray(profile.tipo_perfil)?profile.tipo_perfil:[profile.tipo_perfil]).map(t=>(
                <Tag key={t} color={TIPO_PERFIL_COLOR[t]||'default'}>{t.replace(/_/g,' ')}</Tag>
              ))}
            </div>
          )}

          {/* Nivel de consciencia */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Nivel de consciencia (Schwartz)</p>
            <div style={{display:'flex',gap:'4px'}}>
              {NIVEL_CONSCIENCIA.map((lbl,i)=>(
                <div key={i} style={{flex:1,height:'6px',borderRadius:'3px',background:i<nc?C.accent:C.border,position:'relative'}}/>
              ))}
            </div>
            <p style={{fontSize:'12px',color:C.accent,marginTop:'8px',fontWeight:600}}>{nc}/5 — {NIVEL_CONSCIENCIA[nc-1]}</p>
          </div>

          {/* Contexto de compra */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Contexto de compra</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
              {[
                ['Objetivo',profile.objetivo_principal],
                ['Problema',profile.problema],
                ['Urgencia',profile.urgencia],
                ['Presupuesto',profile.presupuesto],
                ['Experiencia previa',profile.experiencia_previa],
                ['Nivel digital',profile.nivel_digital||profile.madurez+'/5'],
              ].filter(([,v])=>v).map(([k,v])=>(
                <div key={k} style={{background:'#13131F',borderRadius:'7px',padding:'8px 10px'}}>
                  <div style={{fontSize:'10px',color:C.txtDim,marginBottom:'2px'}}>{k}</div>
                  <div style={{fontSize:'12px',color:C.txt,fontWeight:500}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Motivadores */}
          {profile.motivadores&&profile.motivadores.length>0&&(
            <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Motivadores principales</p>
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                {profile.motivadores.map(m=>(
                  <span key={m} style={{background:C.greenDim,color:C.green,fontSize:'11px',fontWeight:600,padding:'3px 10px',borderRadius:'20px'}}>✓ {m}</span>
                ))}
              </div>
            </div>
          )}

          {/* Objeciones */}
          {profile.objeciones&&profile.objeciones.length>0&&(
            <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Objeciones principales</p>
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                {profile.objeciones.map(o=>(
                  <span key={o} style={{background:C.redDim,color:C.red,fontSize:'11px',fontWeight:600,padding:'3px 10px',borderRadius:'20px'}}>⚠ {o}</span>
                ))}
              </div>
            </div>
          )}

          {/* Comportamiento digital */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Comportamiento digital</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px'}}>
              {[
                ['Compara alternativas',profile.compara_alternativas],
                ['Lee reseñas',profile.lee_resenas],
                ['Busca cupones',profile.busca_cupones],
                ['Compra impulsivamente',profile.compra_impulsiva],
                ['Necesita hablar antes',profile.necesita_contacto],
                ['Canal de entrada',profile.canal],
              ].filter(([,v])=>v!==undefined&&v!==null).map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#13131F',borderRadius:'6px',padding:'7px 10px'}}>
                  <span style={{fontSize:'11px',color:C.txtMid}}>{k}</span>
                  <span style={{fontSize:'11px',fontWeight:600,color:v===true||v==='sí'||v==='si'?C.green:v===false||v==='no'?C.red:C.txt}}>{v===true||v==='sí'||v==='si'?'Sí':v===false||v==='no'?'No':v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Comportamiento en página */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Comportamiento en esta página</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px'}}>
              {[
                ['Tiempo sesión',profile.tiempo_sesion_seg?(profile.tiempo_sesion_seg+'s'):'—'],
                ['Scroll depth',(profile.scroll_depth||'—')+'%'],
                ['Prob. conversión',((profile.prob_conversion||0)*100).toFixed(1)+'%'],
                ['Fase funnel',profile.fase_funnel||'—'],
                ['Sensib. precio',profile.sensibilidad_precio||'—'],
                ['Motivación',profile.motivacion||'—'],
              ].map(([k,v])=>(
                <div key={k} style={{background:'#13131F',borderRadius:'6px',padding:'7px 8px',textAlign:'center'}}>
                  <div style={{fontSize:'10px',color:C.txtDim,marginBottom:'2px'}}>{k}</div>
                  <div style={{fontSize:'12px',color:C.txt,fontWeight:600}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Cómo reacciona a la variante */}
          {profile.reaccion_variante&&(

      // Clonar arquetipos hasta nSesiones con variación estadística ±15%
      function clonarSesiones(arquetipos, total) {
        const sesiones = [];
        const porArquetipo = Math.floor(total / arquetipos.length);
        const resto = total % arquetipos.length;
        arquetipos.forEach((arq, idx) => {
          const n = porArquetipo + (idx < resto ? 1 : 0);
          for(let i = 0; i < n; i++) {
            const variacion = (v, pct=0.15) => {
              if(typeof v !== 'number') return v;
              const delta = v * pct * (Math.random()*2-1);
              return Math.max(0, Math.round((v + delta) * 1000) / 1000);
            };
            sesiones.push({
              ...arq,
              id: String(sesiones.length+1).padStart(5,'0'),
              prob_conversion: Math.min(1, Math.max(0, variacion(arq.prob_conversion, 0.2))),
              scroll_depth: Math.min(100, Math.max(0, variacion(arq.scroll_depth, 0.15))),
              tiempo_sesion_seg: Math.max(5, variacion(arq.tiempo_sesion_seg, 0.2)),
              _arquetipo: arq.id,
            });
          }
        });
        return sesiones;
      }

      const clones = clonarSesiones(todos, nSesiones);
      setProfiles({arquetipos: todos, sesiones: clones, total: nSesiones});
    }catch(e){setErrP('Error: '+e.message);}
    setLoadingP(false);
  }

          {/* Métricas */}
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'14px'}}>Métricas del test</p>

            {/* Métrica principal */}

              <label style={{...T.label,display:'block',marginBottom:'6px'}}>Métrica principal <span style={{color:C.red}}>*</span></label>

              <select value={metricaP} onChange={e=>setMetricaP(e.target.value)}

                <optgroup label='— Conversión'>
                  <option value='tasa de conversión'>Tasa de conversión (CVR)</option>
                  <option value='transacciones'>Transacciones totales</option>
                  <option value='ingresos por sesión'>Ingresos por sesión</option>
                  <option value='ticket medio (AOV)'>Ticket medio (AOV)</option>
                </optgroup>
                <optgroup label='— Interacción'>
                  <option value='clics en CTA principal'>Clics en CTA principal</option>
                  <option value='añadidos al carrito'>Añadidos al carrito</option>
                  <option value='inicio de checkout'>Inicio de checkout</option>
                  <option value='scroll depth'>Scroll depth</option>
                  <option value='tiempo en página'>Tiempo en página</option>
                </optgroup>
                <optgroup label='— Engagement'>
                  <option value='tasa de rebote'>Tasa de rebote</option>
                  <option value='páginas por sesión'>Páginas por sesión</option>
                  <option value='tasa de engagement'>Tasa de engagement</option>
                </optgroup>
                <option value='otro'>Otro — escribir a mano</option>
              </select>
              {metricaP==='otro'&&(
                <input value={metricaPCustom} onChange={e=>setMetricaPCustom(e.target.value)}
                  placeholder='Ej: Clics en banner hero, Reproducciones de vídeo, Descargas de PDF...'
                  style={{width:'100%',background:'#070713',border:`1px solid ${C.accent}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'13px',outline:'none'}}/>
              )}
            </div>

            {/* Métricas secundarias */}
            <div style={{marginBottom:'14px'}}>
              <label style={{...T.label,display:'block',marginBottom:'6px'}}>Métricas secundarias <Tag color='default'>Opcional</Tag></label>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px'}}>
                {[
                  'Clics en CTA principal','Tasa de rebote','Scroll depth','Tiempo en página',
                  'Añadidos al carrito','Inicio de checkout','Páginas por sesión','Tasa de engagement',
                  'Ingresos por sesión','Ticket medio (AOV)','Transacciones','Vistas por usuario',
                ].filter(m=>m.toLowerCase()!==metricaP.toLowerCase()).map(m=>{
                  const active=metricasS.includes(m);
                  return(
                    <div key={m} onClick={()=>setMetricasS(prev=>active?prev.filter(x=>x!==m):[...prev,m])}
                      style={{display:'flex',alignItems:'center',gap:'7px',padding:'7px 10px',borderRadius:'7px',cursor:'pointer',
                        border:`1px solid ${active?C.accent:C.border}`,background:active?C.accentDim:'transparent',fontSize:'12px',color:active?C.accent:C.txtMid}}>
                      <span style={{fontSize:'10px'}}>{active?'✓':'○'}</span>{m}
                    </div>
                  );
                })}
              </div>
              {metricasS.length>0&&(
                <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'8px'}}>
                  {metricasS.map(m=><Tag key={m} color='purple'>{m}</Tag>)}
                </div>
              )}
            </div>

            {/* Split */}
            <div>
              <label style={{...T.label,display:'block',marginBottom:'6px'}}>Split de tráfico: A {split}% / B {100-split}%</label>
              <input type='range' min='10' max='90' step='5' value={split} onChange={e=>setSplit(Number(e.target.value))} style={{width:'100%',accentColor:C.accent}}/>

            </div>
          </Card>

          {errSim&&<p style={{color:C.red,fontSize:'12px',marginBottom:'8px'}}>⚠ {errSim}</p>}
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(2)}>Atrás</Btn>
            <Btn disabled={!hip||!varA||!varB} onClick={simular}>Simular →</Btn>
          </div>
        </div>
      )}

      {tsub===4&&results&&(
        <div>
          <div style={{background:'#0A1A14',border:`1px solid rgba(0,212,170,0.2)`,borderRadius:'12px',padding:'16px 18px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px'}}>
            <span style={{fontSize:'24px'}}>🏆</span>
            <div style={{flex:1}}>
              <p style={{fontSize:'15px',fontWeight:700,color:C.green}}>Variante {results.ganador} gana — {results.ganador==='B'?varB:varA}</p>
              <p style={{fontSize:'12px',color:'#3A6A5A'}}>{results.confianza}% confianza estadística</p>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:'24px',fontWeight:700,color:C.green}}>{results.uplift_cvr>0?'+':''}{Number(results.uplift_cvr).toFixed(1)}%</div>
              <div style={{fontSize:'11px',color:'#3A5A4A'}}>uplift CVR</div>
            </div>
          </div>
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Resumen QA</p>
            {[
              {k:'URL testada',v:url},{k:'Variante A',v:varA},{k:'Variante B',v:varB},
              {k:'Arquetipos generados',v:profiles.arquetipos.length},{k:'Sesiones simuladas',v:(profiles.total||0).toLocaleString()},{k:'Métrica principal',v:metricaP},
              {k:'Split',v:`A ${split}% / B ${100-split}%`},
            ].map(row=>(
              <div key={row.k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px'}}>
                <span style={{color:C.txtDim}}>{row.k}</span>
                <span style={{color:C.txt,fontWeight:500}}>{row.v}</span>
              </div>
            ))}
          </Card>
          {results.insights&&results.insights.length>0&&(
            <Card style={{marginBottom:'12px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Insights principales</p>
              {results.insights.slice(0,2).map((ins,i)=>(
                <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
                  <span style={{color:[C.green,C.amber][i],flexShrink:0,marginTop:'2px'}}>◆</span>{ins}
                </div>
              ))}
            </Card>
          )}
          <div style={{display:'flex',justifyContent:'flex-end',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(3)}>Revisar</Btn>
            <Btn variant='green' onClick={()=>setTsub(5)}>Lanzar test →</Btn>
          </div>
        </div>
      )}

      {tsub===5&&(
        <div>
          <Card style={{textAlign:'center',padding:'32px',marginBottom:'16px'}}>
            <div style={{fontSize:'40px',marginBottom:'12px'}}>✓</div>
            <p style={{...T.h2,marginBottom:'6px'}}>Test listo para lanzar</p>
            <p style={{...T.body,marginBottom:'20px'}}>El test ha pasado el QA y los resultados de la simulación están disponibles. Guárdalo en el proyecto.</p>
            <Btn variant='green' onClick={handleSave}>Guardar en proyecto</Btn>
          </Card>
        </div>
      )}
    </div>
  );
}

// ── REPORT VIEW ───────────────────────────────────────────────────────────
function ReportView({project,test,results,onBack}){
  const r=results||PILOT_RESULTS[test?.id]||{};
  const gB=r.ganador==='B';
  const IC=[C.green,C.amber,C.red,C.accent];
  function copiar(){
    const txt=`REPORTE TEST A/B — SynthAB\n\nProyecto: ${project.name}\nURL: ${test?.url}\n\nGanador: Variante ${r.ganador}\nUplift CVR: ${r.uplift_cvr>0?'+':''}${Number(r.uplift_cvr).toFixed(1)}%\nConfianza: ${r.confianza}%\n\nRecomendación:\n${r.recomendacion}`;
    navigator.clipboard.writeText(txt).then(()=>alert('Copiado ✓'));
  }
  if(!r.ganador) return(
    <div className='fade' style={{padding:'28px 32px'}}>
      <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'20px'}}>← {project.name}</button>
      <Card style={{textAlign:'center',padding:'48px'}}>
        <p style={{fontSize:'32px',marginBottom:'12px'}}>◎</p>
        <p style={T.h3}>Test en curso — sin resultados todavía</p>
        <p style={{...T.body,marginTop:'6px'}}>Los resultados aparecerán aquí cuando la simulación esté completada.</p>
      </Card>
    </div>
  );
  return(
    <div className='fade' style={{padding:'28px 32px',maxWidth:'680px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'6px',display:'block'}}>← {project.name}</button>
          <h1 style={T.h1}>{test?.name||'Reporte'}</h1>
          <p style={{...T.mono,marginTop:'3px'}}>{test?.url}</p>
        </div>
        <Btn variant='ghost' onClick={copiar}>Copiar reporte</Btn>
      </div>
      <div style={{background:'#0A1A14',border:'1px solid rgba(0,212,170,0.2)',borderRadius:'12px',padding:'18px 20px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px'}}>
        <span style={{fontSize:'28px'}}>🏆</span>
        <div style={{flex:1}}>
          <p style={{fontSize:'16px',fontWeight:700,color:C.green,marginBottom:'3px'}}>Variante {r.ganador} gana</p>
          <p style={{fontSize:'12px',color:'#3A6A5A'}}>{r.confianza}% confianza estadística</p>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'28px',fontWeight:700,color:gB?C.green:C.red}}>{r.uplift_cvr>0?'+':''}{Number(r.uplift_cvr).toFixed(1)}%</div>
          <div style={{fontSize:'11px',color:'#3A5A4A'}}>uplift CVR</div>
        </div>
      </div>
      <Card style={{marginBottom:'12px'}}>
        <p style={{...T.label,marginBottom:'10px'}}>Métricas principales</p>
        {[
          {name:'Tasa de conversión ⭐',a:(r.cvr_a||0).toFixed(1)+'%',b:(r.cvr_b||0).toFixed(1)+'%',diff:r.uplift_cvr,pos:gB},
          {name:'Clics en CTA',a:(r.clics_cta_a||0)+'%',b:(r.clics_cta_b||0)+'%',diff:(((r.clics_cta_b-r.clics_cta_a)/(r.clics_cta_a||1))*100).toFixed(1),pos:r.clics_cta_b>r.clics_cta_a},
          {name:'Tasa de rebote',a:(r.rebote_a||0)+'%',b:(r.rebote_b||0)+'%',diff:(((r.rebote_b-r.rebote_a)/(r.rebote_a||1))*100).toFixed(1),pos:r.rebote_b<r.rebote_a},
        ].map(m=>(
          <div key={m.name} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:'13px',color:C.txtMid,flex:1}}>{m.name}</span>
            <span style={{fontSize:'12px',color:C.txtDim}}>A: {m.a}</span>
            <span style={{fontSize:'14px',fontWeight:600,color:C.white}}>B: {m.b}</span>
            <span style={{fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:'20px',background:m.pos?C.greenDim:C.redDim,color:m.pos?C.green:C.red}}>{m.diff>0?'+':''}{Number(m.diff).toFixed(1)}%</span>
          </div>
        ))}
      </Card>
      {r.segmentos&&r.segmentos.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Por segmento</p>
          {r.segmentos.map(sg=>(
            <div key={sg.nombre} style={{display:'flex',alignItems:'center',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'12px'}}>
              <span style={{minWidth:'55px',fontWeight:600,color:C.txt}}>{sg.nombre}</span>
              <span style={{flex:1,color:C.txtMid}}>{sg.resultado}</span>
              <Tag color={sg.resultado.toLowerCase().includes('b')?'green':'amber'}>{sg.diff_pct>0?'+':''}{sg.diff_pct}%</Tag>
            </div>
          ))}
        </Card>
      )}
      {r.razones_abandono&&r.razones_abandono.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Razones de abandono — Variante B</p>
          {r.razones_abandono.map((ra,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:C.accent,flexShrink:0,marginTop:'3px'}}>◆</span>{ra}
            </div>
          ))}
        </Card>
      )}
      {r.insights&&r.insights.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Insights clave</p>
          {r.insights.map((ins,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:IC[i]||C.txtDim,flexShrink:0,marginTop:'3px'}}>◆</span>{ins}
            </div>
          ))}
        </Card>
      )}
      {r.recomendacion&&(
        <div style={{background:'#0F0F2A',border:`1px solid rgba(108,99,255,0.2)`,borderRadius:'12px',padding:'16px 18px',display:'flex',gap:'12px'}}>
          <span style={{fontSize:'18px',flexShrink:0}}>✦</span>
          <div>
            <p style={{...T.h3,marginBottom:'4px'}}>Recomendación</p>
            <p style={{...T.body}}>{r.recomendacion}</p>
          </div>
        </div>
      )}
    </div>
  );
}

// ── API SCREEN ────────────────────────────────────────────────────────────
function ApiScreen({onReady}){
  const [key,setKey]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  async function verify(){
    setLoading(true);setErr('');
    try{await callClaude(key,[{role:'user',content:'di ok'}],'Di solo: ok');onReady(key);}
    catch(e){setErr('Clave inválida: '+e.message);}
    setLoading(false);
  }
  return(
    <div style={{maxWidth:'400px',margin:'0 auto',padding:'64px 20px'}}>
      <div style={{textAlign:'center',marginBottom:'32px'}}>
        <div style={{width:'52px',height:'52px',borderRadius:'13px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',margin:'0 auto 16px'}}>⬡</div>
        <h1 style={{...T.h1,textAlign:'center',marginBottom:'6px'}}>SynthAB</h1>
        <p style={{...T.body,textAlign:'center'}}>Tests A/B con usuarios sintéticos.<br/>Resultados en minutos, no semanas.</p>
      </div>
      <Card>
        <label style={{...T.label,display:'block',marginBottom:'6px'}}>API Key de Anthropic</label>
        <input type='password' value={key} onChange={e=>setKey(e.target.value)} placeholder='sk-ant-api03-...' onKeyDown={e=>e.key==='Enter'&&verify()}
          style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'12px',fontFamily:'monospace',outline:'none',marginBottom:'8px'}}/>
        {err&&<p style={{color:C.red,fontSize:'12px',marginBottom:'8px'}}>{err}</p>}
        <p style={{...T.small}}>Consíguela en <a href='https://console.anthropic.com' target='_blank' style={{color:C.accent}}>console.anthropic.com</a> → API Keys</p>
      </Card>
      <button onClick={verify} disabled={key.length<20||loading}
        style={{width:'100%',marginTop:'12px',background:C.accent,color:'#fff',border:'none',borderRadius:'8px',padding:'12px',fontSize:'13px',fontWeight:600,cursor:key.length<20?'not-allowed':'pointer',opacity:key.length<20?0.4:1}}>
        {loading?'Verificando...':'Entrar →'}
      </button>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [apiKey,setApiKey]=useState('');
  const [nav,setNav]=useState('projects');
  const [projects,setProjects]=useState(()=>{
    try{
      const saved=localStorage.getItem('synthab_projects');
      if(saved) return JSON.parse(saved);
    }catch(e){ console.error('No se pudo leer localStorage:',e); }
    return [PILOT_PROJECT];
  });
  const [view,setView]=useState({screen:'list'});

  useEffect(()=>{
    try{ localStorage.setItem('synthab_projects', JSON.stringify(projects)); }
    catch(e){ console.error('No se pudo guardar en localStorage (¿cuota superada?):',e); }
  },[projects]);

  if(!apiKey) return(
    <div style={{background:C.bg,minHeight:'100vh'}}>
      <div style={{borderBottom:`1px solid ${C.border}`,padding:'14px 28px',background:'#0A0A16',display:'flex',alignItems:'center',gap:'8px'}}>
        <div style={{width:'28px',height:'28px',borderRadius:'7px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px'}}>⬡</div>
        <span style={{fontSize:'14px',fontWeight:700,color:C.white}}>SynthAB</span>
      </div>
      <ApiScreen onReady={setApiKey}/>
    </div>
  );

  function addProject(p){setProjects(prev=>[...prev,p]);setView({screen:'detail',project:p});}
  function addTest(projectId,t){
    setProjects(prev=>prev.map(p=>p.id===projectId?{...p,tests:[...p.tests,t]}:p));
    const updatedProject=projects.find(p=>p.id===projectId);
    setView({screen:'detail',project:{...updatedProject,tests:[...updatedProject.tests,t]}});
  }

  const currentProject=view.project?projects.find(p=>p.id===view.project.id)||view.project:null;

  return(
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar active={nav} onNav={id=>{setNav(id);setView({screen:'list'});}} apiKey={apiKey} onLogout={()=>setApiKey('')}/>
      <div style={{flex:1,overflowY:'auto',minWidth:0}}>
        {nav==='projects'&&(
          <>
            {view.screen==='list'&&<ProjectsList projects={projects} onSelect={p=>setView({screen:'detail',project:p})} onCreate={()=>setView({screen:'create'})}/>}
            {view.screen==='detail'&&currentProject&&<ProjectDetail project={currentProject} onBack={()=>setView({screen:'list'})} onEdit={()=>setView({screen:'edit',project:currentProject})} onNewTest={()=>setView({screen:'newtest',project:currentProject})} onViewTest={t=>setView({screen:'report',project:currentProject,test:t})} onViewReport={()=>setView({screen:'report',project:currentProject,test:currentProject.tests[0]})}/>}
            {view.screen==='create'&&<CreateProject apiKey={apiKey} onSave={addProject} onCancel={()=>setView({screen:'list'})}/>}
            {view.screen==='edit'&&currentProject&&<CreateProject apiKey={apiKey} initial={currentProject} onSave={p=>{setProjects(prev=>prev.map(pr=>pr.id===p.id?p:pr));setView({screen:'detail',project:p});}} onCancel={()=>setView({screen:'detail',project:currentProject})}/>}
            {view.screen==='newtest'&&currentProject&&<CreateTest project={currentProject} apiKey={apiKey} onSave={t=>addTest(currentProject.id,t)} onCancel={()=>setView({screen:'detail',project:currentProject})}/>}
            {view.screen==='report'&&currentProject&&<ReportView project={currentProject} test={view.test} results={view.test?.results} onBack={()=>setView({screen:'detail',project:currentProject})}/>}
          </>
        )}
        {nav==='reports'&&(
          <div className='fade' style={{padding:'28px 32px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Reportes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Resumen de todos los tests completados.</p>
            {projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>({...t,projectName:p.name}))).length===0
              ? <Card style={{textAlign:'center',padding:'48px',color:C.txtDim}}><p>No hay tests completados todavía.</p></Card>
              : projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>(
                <Card key={t.id} style={{marginBottom:'10px',cursor:'pointer'}} onClick={()=>{setNav('projects');setView({screen:'report',project:p,test:t});}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <Tag color='blue'>{p.name}</Tag>
                      <p style={{...T.h3,marginTop:'6px',marginBottom:'3px'}}>{t.name}</p>
                      <p style={{...T.mono,fontSize:'11px'}}>{t.url}</p>
                    </div>
                    {t.ganador&&<div style={{textAlign:'right'}}>
                      <div style={{fontSize:'20px',fontWeight:700,color:C.green}}>{t.uplift}</div>
                      <div style={T.small}>Variante {t.ganador}</div>
                    </div>}
                  </div>
                </Card>
              )))}
          </div>
        )}
        {nav==='settings'&&(
          <div className='fade' style={{padding:'28px 32px',maxWidth:'500px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Ajustes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Configuración de la cuenta.</p>
            <Card>
              <p style={{...T.label,marginBottom:'10px'}}>Conexión API</p>
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
                <div style={{width:'8px',height:'8px',borderRadius:'50%',background:C.green}}/>
                <span style={{fontSize:'13px',color:C.green,fontWeight:600}}>Conectada</span>
              </div>
              <p style={{...T.mono,marginBottom:'12px'}}>{apiKey.slice(0,20)}...</p>
              <Btn variant='ghost' small onClick={()=>setApiKey('')}>Cambiar clave API</Btn>
            </Card>
            <Card style={{marginTop:'12px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Proyecto piloto</p>
              <p style={{...T.body,marginBottom:'10px'}}>El proyecto "Moda Urban" viene precargado con datos reales y un test completado para que puedas explorar la app.</p>
              <Tag color='green'>1 test completado</Tag>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
