const Card=({children,style,onClick})=>(
  <div onClick={onClick} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:'12px',padding:'16px 18px',...style}}>
    {children}

const Btn=({children,onClick,variant='primary',disabled,style,small})=>{
  const base={border:'none',borderRadius:'8px',cursor:disabled?'not-allowed':'pointer',fontWeight:600,opacity:disabled?0.4:1,transition:'opacity 0.15s',...style};
  const pad=small?{padding:'6px 12px',fontSize:'12px'}:{padding:'10px 18px',fontSize:'13px'};
  const vars={
    primary:{...base,...pad,background:C.accent,color:'#fff'},
    ghost:{...base,...pad,background:'transparent',color:C.txtMid,border:`1px solid ${C.border}`},
    green:{...base,...pad,background:C.green,color:'#000'},
    danger:{...base,...pad,background:C.red,color:'#fff'},
  };
  return <button style={vars[variant]} onClick={disabled?null:onClick}>{children}</button>;
};

// Nombre editable in situ — clic en el lápiz para renombrar sin entrar al flujo completo de edición
function EditableName({name,onChange}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(name);
  function commit(){
    const v=val.trim();
    if(v&&v!==name) onChange(v);
    setEditing(false);
  }
  if(editing) return(
    <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
      <input autoFocus value={val} onChange={e=>setVal(e.target.value)}
        onKeyDown={e=>{if(e.key==='Enter') commit(); if(e.key==='Escape'){setVal(name);setEditing(false);}}}
        style={{...T.h1,background:'#070713',border:`1px solid ${C.accent}`,borderRadius:'6px',padding:'2px 8px',outline:'none',width:'320px',maxWidth:'100%'}}/>
      <button onClick={commit} style={{background:'none',border:'none',cursor:'pointer',color:C.green,fontSize:'16px'}}>✓</button>
      <button onClick={()=>{setVal(name);setEditing(false);}} style={{background:'none',border:'none',cursor:'pointer',color:C.txtDim,fontSize:'14px'}}>✕</button>
    </div>
  );
  return(
    <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
      <h1 style={T.h1}>{name}</h1>
      <button onClick={()=>{setVal(name);setEditing(true);}} title='Renombrar' style={{background:'none',border:'none',cursor:'pointer',color:C.txtDim,fontSize:'13px',padding:'2px'}}>✎</button>
    </div>
  );
}

function Tooltip({text,title}){
  const [show,setShow]=useState(false);
  return(
    <div style={{position:'relative',display:'inline-flex'}}>
      <div
        onMouseEnter={()=>setShow(true)}
        onMouseLeave={()=>setShow(false)}
        onClick={()=>setShow(!show)}
        style={{width:'16px',height:'16px',borderRadius:'50%',background:'#1A1A35',border:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:'10px',color:C.txtMid,flexShrink:0}}>
        ?
      </div>
      {show&&(
        <div style={{position:'absolute',bottom:'22px',left:'50%',transform:'translateX(-50%)',background:'#1A1A35',border:`1px solid ${C.borderHi}`,borderRadius:'8px',padding:'10px 12px',fontSize:'11px',color:C.txtMid,lineHeight:'1.6',width:'260px',zIndex:100,boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
          <div style={{color:C.accent,fontWeight:600,marginBottom:'4px',fontSize:'10px',textTransform:'uppercase',letterSpacing:'0.05em'}}>{title||'Dónde encontrarlo'}</div>
          {text}
          <div style={{position:'absolute',bottom:'-5px',left:'50%',transform:'translateX(-50%)',width:'8px',height:'8px',background:'#1A1A35',border:`1px solid ${C.borderHi}`,borderBottom:'none',borderRight:'none',transform:'translateX(-50%) rotate(225deg)'}}/>
        </div>
      )}
    </div>
  );
}

// ── CLAUDE API ────────────────────────────────────────────────────────────
async function callClaude(apiKey,messages,system,maxTokens){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:maxTokens||4096,system,messages})
  });
  const data=await res.json();
  if(!data.content) throw new Error(data.error?data.error.message:'Error API');
  if(data.stop_reason==='max_tokens') throw new Error('La respuesta se cortó por ser demasiado larga (reduce el número de métricas secundarias o vuelve a intentarlo).');
  return data.content.map(b=>b.text||'').join('');
}
function parseJSON(raw){
  const c=raw.replace(/```json/g,'').replace(/```/g,'').trim();
  const s1=c.indexOf('['),s2=c.indexOf('{');
  if(s1!==-1&&(s2===-1||s1<s2)) return JSON.parse(c.slice(s1,c.lastIndexOf(']')+1));
  return JSON.parse(c.slice(s2,c.lastIndexOf('}')+1));
}
function parseCSV(text){
  const clean=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  const lines=clean.split('\n').filter(l=>l.trim());
  if(lines.length<2) return null;
  const sep=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const headers=lines[0].split(sep).map(h=>h.trim().replace(/"/g,''));
  const rows=lines.slice(1).map(line=>{const vals=line.split(sep).map(v=>v.trim().replace(/"/g,''));const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||'';});return obj;});
  return{headers,rows,raw:clean};
}
// Convierte '1.240', '0,44%', '44,1' etc en número, sea cual sea el formato regional con el que GA4 lo haya exportado
function toNum(v){
  if(v===null||v===undefined) return NaN;
  let s=String(v).trim().replace(/[€$%\s]/g,'');
  if(!s) return NaN;
  if(s.includes(',')&&s.includes('.')){
    s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = s.replace(',','.');
  }
  return parseFloat(s);
}
// GA4 suele incluir una fila 'Total' resumen antes de las filas por segmento. Si se cuela,
// el desglose por dispositivo la trata como un dispositivo más (con 0 sesiones) y puede
// duplicar el recuento — la quitamos antes de calcular nada.
function stripTotalRow(csv){
  if(!csv||!csv.rows||!csv.rows.length) return csv;
  const h=csv.headers;
  const hDisp=h.find(x=>/dispositivo|device|categor/i.test(x));
  if(!hDisp) return csv;
  const rows=csv.rows.filter(r=>{
    const v=String(r[hDisp]||'').trim().toLowerCase();
    return v!=='total'&&v!=='totales'&&v!=='';
  });
  if(rows.length===csv.rows.length) return csv;
  const firstLine=(csv.raw||'').split('\n')[0]||'';
  const sep=firstLine.includes('\t')?'\t':firstLine.includes(';')?';':',';
  const rawLines=[h.join(sep),...rows.map(r=>h.map(hh=>r[hh]).join(sep))];
  return {...csv,rows,raw:rawLines.join('\n')};
}
// Muchos ecommerce no tienen la columna 'cvr' en GA4 — solo sesiones y transacciones/conversiones.
// Si detecta ambas y no hay cvr, la calcula por fila y la añade al CSV (headers, rows y raw),
// así el prompt de generación de perfiles siempre tiene un CVR real anclado, aunque el cliente no lo exportara.
function withComputedCvr(csv){
  if(!csv||!csv.rows||!csv.rows.length) return csv;
  const h=csv.headers;
  const hasCvr=h.some(x=>/^cvr$/i.test(x)||/tasa.*conversi|conversi.*tasa/i.test(x));
  if(hasCvr) return csv;
  const hSes=h.find(x=>/sesion/i.test(x));
  const hConv=h.find(x=>/transacc|conversi/i.test(x));
  if(!hSes||!hConv) return csv;
  const newHeaders=[...h,'cvr'];
  const newRows=csv.rows.map(r=>{
    const ses=toNum(r[hSes]),conv=toNum(r[hConv]);
    const cvr=(ses>0&&!isNaN(conv))?((conv/ses)*100).toFixed(2):'';
    return {...r,cvr};
  });
  const firstLine=(csv.raw||'').split('\n')[0]||'';
  const sep=firstLine.includes('\t')?'\t':firstLine.includes(';')?';':',';
  const rawLines=[newHeaders.join(sep),...newRows.map(r=>newHeaders.map(hh=>r[hh]).join(sep))];
  return {...csv,headers:newHeaders,rows:newRows,raw:rawLines.join('\n'),cvrCalculado:true};
}
// Calcula un resumen de KPIs (CVR, sesiones, rebote, desglose por dispositivo) a partir del CSV subido,
// para confirmar visualmente que se ha leído bien antes de generar perfiles
const DEVICE_VOCAB=/mobile|m[oó]vil|desktop|escritorio|tablet|smart\s?tv/i;
function csvSummary(csv){
  if(!csv||!csv.rows||!csv.rows.length) return null;
  const h=csv.headers;
  const find=re=>h.find(x=>re.test(x));
  const hDisp=find(/dispositivo|device/i);
  const hSes=find(/sesion/i);
  const hCvr=find(/^cvr$|conversi/i);
  const hRebote=find(/rebote/i);
  const hFecha=find(/fecha|date/i);
  let totalSes=0,cvrPeso=0,rebotePeso=0,cvrFilas=0,reboteFilas=0;
  const porDispositivo={};
  let fechaMin=null,fechaMax=null;
  csv.rows.forEach(r=>{
    const ses=toNum(r[hSes])||0;
    totalSes+=ses;
    if(hCvr){const c=toNum(r[hCvr]);if(!isNaN(c)){cvrPeso+=c*ses;cvrFilas+=ses;}}
    if(hRebote){const rb=toNum(r[hRebote]);if(!isNaN(rb)){rebotePeso+=rb*ses;reboteFilas+=ses;}}
    if(hDisp){
      const raw=(r[hDisp]||'').toString().trim();
      // Si la celda no parece un dispositivo real (mobile/desktop/tablet), no la mostramos como si lo fuera —
      // cae en "otros" en vez de ensuciar la tabla con basura de una columna mal alineada.
      const d = raw && DEVICE_VOCAB.test(raw) ? raw.toLowerCase() : (raw?'otros':null);
      if(d) porDispositivo[d]=(porDispositivo[d]||0)+ses;
    }
    if(hFecha&&r[hFecha]){
      if(fechaMin===null||r[hFecha]<fechaMin) fechaMin=r[hFecha];
      if(fechaMax===null||r[hFecha]>fechaMax) fechaMax=r[hFecha];
    }
  });
  const cvrMedio = cvrFilas? cvrPeso/cvrFilas : null;
  const reboteMedio = reboteFilas? rebotePeso/reboteFilas : null;
  const sospechoso = totalSes<=0 || (cvrMedio!==null && (cvrMedio>100||cvrMedio<0));
  return {totalSesiones:totalSes,segmentos:csv.rows.length,cvrMedio,reboteMedio,porDispositivo,fechaMin,fechaMax,sospechoso};
}

// Calcula, a partir del resultado de la simulación y el tráfico real aproximado que dio el usuario,
// el impacto de negocio estimado: usuarios/mes, CVR de cada variante, uplift, PTB (confianza de que
// B gana) y una estimación de valor mensual por variante (tráfico × CVR × ticket medio).
function resumenPrimario(r,traficoMensual,ticket){
  if(!r) return null;
  const totalUsuarios=toNum(traficoMensual);
  const cvrA=r.cvr_a!=null?Number(r.cvr_a):null;
  const cvrB=r.cvr_b!=null?Number(r.cvr_b):null;
  const upliftPct=r.uplift_cvr!=null?Number(r.uplift_cvr):null;
  const ptb=r.confianza!=null?Number(r.confianza):null;
  const ticketNum=toNum(ticket);
  const hayVolumen=totalUsuarios>0;
  const valorA=(hayVolumen&&cvrA!=null&&!isNaN(ticketNum))?(totalUsuarios*(cvrA/100)*ticketNum):null;
  const valorB=(hayVolumen&&cvrB!=null&&!isNaN(ticketNum))?(totalUsuarios*(cvrB/100)*ticketNum):null;
  return {totalUsuarios:hayVolumen?totalUsuarios:null,cvrA,cvrB,upliftPct,ptb,valorA,valorB,ticketNum:isNaN(ticketNum)?null:ticketNum};
}

// Tabla "Resultados por métrica configurada" — usa el array genérico de la IA (r.metricas) si existe;
// si el resultado es antiguo y no lo trae, cae a los 3 campos fijos que había antes (compatibilidad).
// Genera una curva de convergencia simulada (día a día) hacia el valor final de cada variante.
// No es un histórico real — es una representación visual honesta de "cómo habría evolucionado",
// determinista por métrica+variante (misma métrica siempre da la misma curva).
function genTrendSeries(finalA,finalB,seed,days){
  days=days||14;
  let s=0; for(let i=0;i<seed.length;i++) s=(s*31+seed.charCodeAt(i))>>>0;
  function rnd(){ s=(s*1103515245+12345)>>>0; return (s%1000)/1000; }
  function seriesFor(final){
    const arr=[];
    let v=final*(0.6+rnd()*0.5);
    for(let d=0;d<days;d++){
      const t=d/(days-1);
      const noise=(rnd()-0.5)*Math.abs(final)*0.15*(1-t*0.7);
      v=v+(final-v)*0.35+noise;
      arr.push(v);
    }
    arr[arr.length-1]=final;
    return arr;
  }
  return {a:seriesFor(finalA),b:seriesFor(finalB)};
}

// Gráfica de línea dibujada a mano en SVG — sin dependencias externas
function MiniLineChart({seriesA,seriesB,colorA,colorB,unidad}){
  const all=[...seriesA,...seriesB];
  const min=Math.min(...all),max=Math.max(...all);
  const pad=(max-min)*0.15||Math.abs(max)*0.1||1;
  const yMin=min-pad,yMax=max+pad;
  const W=560,H=170,ML=42,MB=10,MT=10,MR=10;
  const n=seriesA.length;
  const x=i=>ML+(i/(n-1))*(W-ML-MR);
  const y=v=>MT+(1-(v-yMin)/((yMax-yMin)||1))*(H-MT-MB);
  const path=arr=>arr.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const fmtY=v=>unidad==='€'?v.toFixed(1)+'€':unidad==='segundos'?v.toFixed(0)+'s':unidad&&unidad!=='%'&&unidad!=='número'?v.toFixed(1):unidad==='número'?Math.round(v):v.toFixed(2)+'%';
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      {[0,0.25,0.5,0.75,1].map(t=>{
        const yy=MT+t*(H-MT-MB);
        const val=yMax-t*(yMax-yMin);
        return(
          <g key={t}>
            <line x1={ML} x2={W-MR} y1={yy} y2={yy} stroke={C.border} strokeWidth='1'/>
            <text x={ML-6} y={yy+3} textAnchor='end' fontSize='9' fill={C.txtDim}>{fmtY(val)}</text>
          </g>
        );
      })}
      <path d={path(seriesA)} fill='none' stroke={colorA} strokeWidth='2'/>
      <path d={path(seriesB)} fill='none' stroke={colorB} strokeWidth='2'/>
    </svg>
  );
}

// Tabla + gráfica de UNA métrica, estilo VWO (Variación · Conversiones/Visitantes · Tasa esperada · Mejora · Probabilidad de ser mejor)
function MetricDetailView({metric,index,r,varAName,varBName,traficoMensual}){
  const sesA=r.sesiones_a||0,sesB=r.sesiones_b||0;
  const isPct=!metric.unidad||metric.unidad==='%';
  const valA=Number(metric.valor_a)||0,valB=Number(metric.valor_b)||0;
  const convA=isPct?Math.round(sesA*valA/100):Math.round(valA);
  const convB=isPct?Math.round(sesB*valB/100):Math.round(valB);
  const deltaAbs=valB-valA; // diferencia absoluta — en puntos si es %, en la unidad si no
  const upliftRel=valA!==0?((valB-valA)/Math.abs(valA))*100:null; // uplift ESTIMADO relativo — % de mejora sobre el control
  const esRebote=/rebote|abandono|salida/i.test(metric.nombre);
  const bGana=esRebote?valB<valA:valB>valA;
  const ptb=metric.confianza!=null?Number(metric.confianza):(index===0?r.confianza:null);
  const rango=Array.isArray(metric.rango_uplift)&&metric.rango_uplift.length===2?metric.rango_uplift:null;
  const trafico=parseInt(traficoMensual)||0;
  const impactoConv=(isPct&&trafico>0)?Math.round(trafico*deltaAbs/100):null;
  const trend=genTrendSeries(valA,valB,metric.nombre+index);
  const fmtVal=v=>metric.unidad==='€'?v.toFixed(2)+'€':metric.unidad==='segundos'?v.toFixed(0)+'s':metric.unidad==='número'?Math.round(v).toLocaleString():v.toFixed(2)+'%';
  const pasos=['Visitantes','Conversiones','CR','Uplift estimado','Prob. predictiva','Impacto'];
  return(
    <div>
      {metric.desc&&<p style={{...T.small,marginBottom:'10px'}}>{metric.desc}</p>}

      {/* El mismo criterio siempre, sea cual sea el tamaño de muestra */}
      <div style={{display:'flex',alignItems:'center',gap:'4px',marginBottom:'14px',overflowX:'auto',paddingBottom:'2px'}}>
        {pasos.map((s,i)=>(
          <React.Fragment key={s}>
            <span style={{whiteSpace:'nowrap',padding:'3px 9px',borderRadius:'10px',background:'#0A0A18',border:`1px solid ${C.border}`,fontSize:'10px',color:C.txtDim}}>{i+1}. {s}</span>
            {i<pasos.length-1&&<span style={{color:C.txtDim,fontSize:'10px'}}>→</span>}
          </React.Fragment>
        ))}
      </div>

      {/* 1-3: Visitantes · Conversiones · CR — los datos crudos, sin interpretar todavía */}
      <div style={{overflowX:'auto',marginBottom:'12px'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px',minWidth:'420px'}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${C.border}`,color:C.txtDim,textAlign:'left'}}>
              <th style={{padding:'6px 8px',fontWeight:600}}>Variación</th>
              <th style={{padding:'6px 8px',fontWeight:600}}>1. Visitantes (simulados)</th>
              <th style={{padding:'6px 8px',fontWeight:600}}>2. {isPct?'Conversiones':'Valor bruto'}</th>
              <th style={{padding:'6px 8px',fontWeight:600}}>3. CR estimado</th>
            </tr>
          </thead>
          <tbody>
            <tr style={{borderBottom:`1px solid ${C.border}`}}>
              <td style={{padding:'8px'}}><Tag color='default'>C</Tag> {varAName||'Control'}</td>
              <td style={{padding:'8px',color:C.txtMid}}>{sesA.toLocaleString()}</td>
              <td style={{padding:'8px',color:C.txtMid}}>{isPct?convA.toLocaleString():fmtVal(valA)}</td>
              <td style={{padding:'8px',fontWeight:600,color:C.txt}}>{fmtVal(valA)}</td>
            </tr>
            <tr>
              <td style={{padding:'8px'}}><Tag color='purple'>V1</Tag> {varBName||'Variación 1'}</td>
              <td style={{padding:'8px',color:C.txtMid}}>{sesB.toLocaleString()}</td>
              <td style={{padding:'8px',color:C.txtMid}}>{isPct?convB.toLocaleString():fmtVal(valB)}</td>
              <td style={{padding:'8px',fontWeight:600,color:C.txt}}>{fmtVal(valB)}</td>
            </tr>
          </tbody>
        </table>
        <p style={{...T.small,marginTop:'4px'}}>"Visitantes simulados" son repeticiones del mismo modelo, no personas reales distintas — por eso el CR es una estimación, no una tasa observada.</p>
      </div>

      {/* 4: Uplift ESTIMADO — SIEMPRE con su rango, nunca un único número suelto */}
      <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',marginBottom:'10px'}}>
        <p style={{...T.label,marginBottom:'8px'}}>4. Uplift estimado — cuánto podría mejorar</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:rango?'8px':0}}>
          <div>
            <p style={T.small}>Diferencia absoluta</p>
            <p style={{fontSize:'16px',fontWeight:700,color:C.txt}}>{deltaAbs>0?'+':''}{deltaAbs.toFixed(2)}{isPct?' p.p.':metric.unidad==='€'?'€':metric.unidad==='segundos'?'s':''}</p>
          </div>
          <div>
            <p style={T.small}>Uplift relativo estimado</p>
            <p style={{fontSize:'16px',fontWeight:700,color:bGana?C.green:C.red}}>{upliftRel!=null?(upliftRel>0?'+':'')+upliftRel.toFixed(1)+'%':'—'}</p>
          </div>
        </div>
        {rango&&(
          <p style={{fontSize:'12px',color:C.txtMid}}>Rango estimado: <strong style={{color:C.txt}}>{rango[0]>0?'+':''}{rango[0]}% a {rango[1]>0?'+':''}{rango[1]}%</strong> — cuánto podría variar según el escenario</p>
        )}
        <p style={{...T.small,marginTop:'8px'}}>La diferencia absoluta son puntos ganados; el uplift relativo es el % de mejora sobre el control. No son lo mismo — y ambos son estimaciones del modelo, no un resultado observado.</p>
      </div>

      {/* 5: Probabilidad predictiva — SEPARADA del uplift a propósito, nunca se mezclan. NO es significancia estadística real. */}
      <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',marginBottom:'10px'}}>
        <p style={{...T.label,marginBottom:'8px'}}>5. Probabilidad predictiva de mejora</p>
        {ptb!=null?(
          <>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px'}}>
              <div style={{flex:1,height:'8px',background:C.border,borderRadius:'4px',position:'relative'}}>
                <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${Math.min(ptb,100)}%`,background:C.accent,borderRadius:'4px'}}/>
              </div>
              <span style={{fontSize:'14px',fontWeight:700,color:C.txt}}>{ptb}%</span>
            </div>
            <p style={{...T.small}}>Según el modelo, esta es la probabilidad de que {varBName||'la variante'} sea mejor. <strong style={{color:C.txt}}>No es significancia estadística</strong> — no viene de tráfico real independiente, sino de repetir el mismo modelo generativo. Trátala como una señal orientativa, no como una certeza.</p>
          </>
        ):<p style={T.small}>Sin dato de probabilidad para esta métrica.</p>}
      </div>

      {/* 6: Impacto de negocio — traducción a conversiones reales, siempre con la recomendación de validar */}
      <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',marginBottom:'14px'}}>
        <p style={{...T.label,marginBottom:'6px'}}>6. Impacto de negocio</p>
        {impactoConv!=null?(
          <p style={{fontSize:'13px',color:C.txt}}>
            Con tu tráfico real (~{trafico.toLocaleString()} usuarios/mes), esta mejora equivaldría a <strong style={{color:bGana?C.green:C.red}}>{impactoConv>0?'+':''}{impactoConv.toLocaleString()} conversiones/mes</strong> estimadas.
          </p>
        ):<p style={T.small}>Añade el tráfico mensual en el paso "Métricas" para ver el impacto estimado en conversiones reales.</p>}
        <p style={{...T.small,marginTop:'6px',color:C.amber}}>📋 Recomendación: validar mediante un test A/B real con tráfico antes de implementar de forma definitiva.</p>
      </div>

      <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'12px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px',flexWrap:'wrap',gap:'6px'}}>
          <p style={T.label}>Evolución simulada</p>
          <div style={{display:'flex',gap:'12px',fontSize:'11px'}}>
            <span style={{color:C.accent}}>● {varAName||'Control'}</span>
            <span style={{color:C.green}}>● {varBName||'Variación 1'}</span>
          </div>
        </div>
        <MiniLineChart seriesA={trend.a} seriesB={trend.b} colorA={C.accent} colorB={C.green} unidad={metric.unidad}/>
        <p style={{...T.small,marginTop:'6px'}}>Curva de convergencia simulada a partir del resultado final — no es un histórico real día a día.</p>
      </div>
    </div>
  );
}

  {n:'El recurrente',need:'Eficiencia y personalización.',consciencia:'4-5',senales:'Acceso directo, login, recompra, rutas cortas.',rec:'Recompra en un clic, personalización, programa de fidelización.'},
  {n:'El abandonador de checkout',need:'Identificar fricción final.',consciencia:'4-5 — intención alta, algo puntual lo frena',senales:'Add-to-cart + checkout sin purchase.',rec:'Email de recuperación de carrito, mostrar costes totales antes, checkout más corto.'},

function ProjectDetail({project,apiKey,onUpdateProject,onBack,onEdit,onNewTest,onViewTest,onViewReport,onDeleteTest}){
  const statusColor={completado:'green',enCurso:'amber','en curso':'amber',borrador:'default'};
  const [openArch,setOpenArch]=useState(null);
  const [genArch,setGenArch]=useState(false);
  const [errArch,setErrArch]=useState('');
  const [statusFilter,setStatusFilter]=useState('all');
  const [sortAsc,setSortAsc]=useState(false);

  const bloquesDatos=[project.exp1Data,project.exp2Data,project.exp3Data,project.busquedaCsv,project.busquedaSegmentoCsv,project.vozCsv,project.funnelVolCsv,project.funnelDispCsv,project.crm?.csv,project.kpisCsv];
  const fuentesCargadas=bloquesDatos.filter(Boolean).length;
  const ultimaActualizacion=Object.values(project.timestamps||{}).sort().slice(-1)[0]||project.createdAt;

  async function generarArquetipos(){
    if(!apiKey) return;
    setGenArch(true);setErrArch('');
    try{
      // Mandamos el CSV completo a la IA (no solo una muestra), para que los arquetipos reflejen
      // todo el período subido. Límite de seguridad muy alto solo para evitar romper la llamada
      // a la API con archivos desproporcionados — no debería activarse con datos reales.
      const FILAS_MAX_IA=5000;
      const fmt=d=>{
        const total=d.rows.length;
        const filas=total>FILAS_MAX_IA?d.rows.slice(0,FILAS_MAX_IA):d.rows;
        const nota=total>FILAS_MAX_IA?` (mostrando ${FILAS_MAX_IA} de ${total} filas — archivo muy grande)`:'';
        return `columnas: ${d.headers.join(', ')}. Filas${nota}: ${JSON.stringify(filas)}`;
      };
      const ctx=[
        project.exp1Data?`Exp1 (quién es el usuario) — ${fmt(project.exp1Data)}`:null,
        project.exp2Data?`Exp2 (cómo llega) — ${fmt(project.exp2Data)}`:null,
        project.exp3Data?`Exp3 (cómo navega) — ${fmt(project.exp3Data)}`:null,
      ].filter(Boolean).join('\n\n');
      const listaNombres=ARQUETIPOS_BASE.map(a=>a.n).join(', ');
      const prompt=`Eres un analista CRO. Este es un ecommerce de sector "${project.sector}". Datos disponibles:\n\n${ctx||'(sin CSV de comportamiento subido — estima con criterio general del sector)'}\n\nClasifica la población de usuarios en estos 10 arquetipos fijos: ${listaNombres}. Para cada uno, estima el % de población (deben sumar 100 entre los 10) y escribe: descripción (1 frase), señales que lo identifican (1 frase, concreta si hay datos), qué necesita (1 frase), qué se recomienda (1 frase accionable). Responde SOLO con un array JSON de 10 objetos con claves: nombre, poblacion (número), descripcion, senales, necesita, recomendacion.`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido, sin markdown ni texto extra.');
      const parsed=JSON.parse(raw.replace(/```json/g,'').replace(/```/g,'').trim());
      onUpdateProject({...project,archetypes:parsed,archetypesGeneratedAt:new Date().toISOString()});
    }catch(e){
      setErrArch('No se pudieron generar los arquetipos: '+e.message);
    }finally{
      setGenArch(false);
    }
  }

  const archSig=(project.archetypes||[]).filter(a=>a.poblacion>=3).sort((a,b)=>b.poblacion-a.poblacion);
  const archOtros=(project.archetypes||[]).filter(a=>a.poblacion<3).reduce((s,a)=>s+a.poblacion,0);

  const testsFiltrados=project.tests
    .filter(t=>statusFilter==='all'||t.status===statusFilter)
    .sort((a,b)=>sortAsc?a.createdAt.localeCompare(b.createdAt):b.createdAt.localeCompare(a.createdAt));

  return(
    <div className="fade" style={{padding:'28px 32px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'6px'}}>
        <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px'}}>← Proyectos</button>
        <span style={{color:C.txtDim}}>/</span>
        <span style={{fontSize:'13px',color:C.txt}}>{project.name}</span>
      </div>
      <div style={{marginBottom:'20px'}}>
        <EditableName name={project.name} onChange={n=>onUpdateProject({...project,name:n})}/>
        <p style={{...T.mono,marginTop:'3px'}}>{project.domain}</p>
      </div>

      {/* 1. DATOS BASE */}
      <Card style={{marginBottom:'20px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'14px',flexWrap:'wrap',gap:'10px'}}>
          <div>
            <p style={T.h3}>Precisión de los datos</p>
            <p style={{...T.small,marginTop:'3px'}}>🕐 Última actualización: {ultimaActualizacion}</p>
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <Btn variant='ghost' small onClick={onEdit}>Editar datos base</Btn>
            <Btn variant='ghost' small onClick={onViewReport}>Ver reportes</Btn>
          </div>
        </div>
        <div style={{height:'6px',background:'#0A0A18',borderRadius:'3px',overflow:'hidden',marginBottom:'6px'}}>
          <div style={{height:'100%',width:`${project.quality}%`,background:project.quality>=80?C.green:C.amber}}></div>
        </div>
        <p style={{...T.small,color:project.quality>=80?C.green:C.amber,marginBottom:'16px'}}>{project.quality}% completo · {project.quality>=80?'alta precisión':'precisión básica'}</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px'}}>
          {[
            {label:'CVR base',val:project.kpis.cvr?project.kpis.cvr+'%':'—'},
            {label:'Ticket medio',val:project.kpis.ticket?project.kpis.ticket+'€':'—'},
            {label:'Tráfico/mes',val:project.kpis.trafico?Number(project.kpis.trafico).toLocaleString():'—'},
            {label:'Fuentes cargadas',val:`${fuentesCargadas} / 9`},
          ].map(m=>(
            <div key={m.label} style={{background:'#0A0A18',borderRadius:'8px',padding:'10px 12px'}}>
              <p style={{fontSize:'10px',color:C.txtDim,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'4px'}}>{m.label}</p>
              <p style={{fontSize:'16px',fontWeight:600,color:C.txt}}>{m.val}</p>
            </div>
          ))}
        </div>
      </Card>

      {/* 2. ARQUETIPOS */}
      <div style={{marginBottom:'24px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'6px',flexWrap:'wrap',gap:'8px'}}>
          <h2 style={T.h2}>Arquetipos generados a partir de los datos</h2>
          <span style={{...T.small}}>
            {project.archetypesGeneratedAt?`Generado ${project.archetypesGeneratedAt.slice(0,10)}`:'Sin generar'} ·{' '}
            <button onClick={generarArquetipos} disabled={genArch}
              style={{fontSize:'11px',color:C.accent,background:'none',border:'none',cursor:'pointer'}}>
              {genArch?'Generando...':project.archetypes?.length?'Regenerar':'Generar arquetipos'}
            </button>
          </span>
        </div>
        <p style={{...T.small,marginBottom:'12px'}}>Son 10 patrones de comportamiento que se repiten en prácticamente cualquier ecommerce — no son personas inventadas, sino la forma en que ya clasificamos tu tráfico real según sus señales de navegación, precio e intención de compra.</p>
        {errArch&&<p style={{...T.small,color:C.red,marginBottom:'10px'}}>{errArch}</p>}
        {!project.archetypes?.length?(
          <Card style={{textAlign:'center',padding:'24px',color:C.txtDim}}>
            <p style={{...T.body}}>Todavía no se han generado arquetipos para este proyecto.</p>
          </Card>
        ):(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            {archSig.map(a=>(
              <div key={a.nombre} onClick={()=>setOpenArch(openArch===a.nombre?null:a.nombre)}
                style={{border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',cursor:'pointer'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:'13px',fontWeight:600,color:C.txt}}>{a.nombre}</span>
                  <span style={{fontSize:'12px',color:C.accent,fontWeight:700}}>{a.poblacion}%</span>
                </div>
                {openArch===a.nombre&&(
                  <div style={{marginTop:'10px',paddingTop:'10px',borderTop:`1px solid ${C.border}`}}>
                    <p style={{fontSize:'12px',color:C.txtMid,marginBottom:'8px'}}>{a.descripcion}</p>
                    <p style={{fontSize:'11px',color:C.txtDim,marginBottom:'4px'}}><b style={{color:C.txt,fontWeight:600}}>Señales:</b> {a.senales}</p>
                    <p style={{fontSize:'11px',color:C.txtDim,marginBottom:'4px'}}><b style={{color:C.txt,fontWeight:600}}>Necesita:</b> {a.necesita}</p>
                    <p style={{fontSize:'11px',color:C.txtDim}}><b style={{color:C.txt,fontWeight:600}}>Se recomienda:</b> {a.recomendacion}</p>
                  </div>
                )}
              </div>
            ))}
            {archOtros>0&&(
              <div style={{border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',opacity:0.6}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:'13px',color:C.txtDim}}>Otros (poco representados)</span>
                  <span style={{fontSize:'12px',color:C.txtDim,fontWeight:700}}>{Math.round(archOtros)}%</span>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* 3. TESTS */}
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px',flexWrap:'wrap',gap:'8px'}}>
          <h2 style={T.h2}>Tests</h2>
          <Btn small onClick={onNewTest}>+ Crear test</Btn>
        </div>
        <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}}>
          {[{v:'all',label:'Todos'},{v:'en curso',label:'En curso'},{v:'completado',label:'Completado'}].map(f=>(
            <button key={f.v} onClick={()=>setStatusFilter(f.v)}
              style={{fontSize:'12px',padding:'6px 12px',borderRadius:'8px',cursor:'pointer',
                border:`1px solid ${statusFilter===f.v?C.accent:C.border}`,
                background:statusFilter===f.v?C.accentDim:'transparent',
                color:statusFilter===f.v?C.accent:C.txtDim}}>
              {f.label}
            </button>
          ))}
          <button onClick={()=>setSortAsc(!sortAsc)}
            style={{fontSize:'12px',padding:'6px 12px',borderRadius:'8px',cursor:'pointer',border:`1px solid ${C.border}`,background:'transparent',color:C.txtDim}}>
            Fecha {sortAsc?'↑':'↓'}
          </button>
        </div>
        {testsFiltrados.length===0
          ? <Card style={{textAlign:'center',padding:'32px',color:C.txtDim}}>
              <p style={{fontSize:'32px',marginBottom:'8px'}}>◎</p>
              <p style={{...T.body}}>{project.tests.length===0?'Todavía no hay tests en este proyecto.':'No hay tests con este filtro.'}</p>
              {project.tests.length===0&&<Btn style={{marginTop:'14px'}} onClick={onNewTest}>Crear primer test</Btn>}
            </Card>
          : testsFiltrados.map(t=>(
            <Card key={t.id} style={{marginBottom:'10px',cursor:'pointer'}} onClick={()=>onViewTest(t)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
                    <span style={T.h3}>{t.name}</span>
                    <Tag color={statusColor[t.status]||'default'}>{t.status}</Tag>
                  </div>
                  <p style={{...T.mono,fontSize:'11px',color:t.url?C.green:C.txtDim}}>{t.url||'Sin URL todavía — abre el borrador para completarlo'}</p>
                </div>
                {t.ganador&&(
                  <div style={{textAlign:'right',marginLeft:'16px'}}>
                    <div style={{fontSize:'18px',fontWeight:700,color:C.green}}>{t.uplift}</div>
                    <div style={T.small}>Variante {t.ganador} gana</div>
                  </div>
                )}
                {onDeleteTest&&(
                  <button
                    onClick={e=>{e.stopPropagation();if(window.confirm(`¿Eliminar "${t.name}"? Esta acción no se puede deshacer.`))onDeleteTest(t.id);}}
                    title='Eliminar test'
                    style={{background:'none',border:'none',cursor:'pointer',color:C.txtDim,fontSize:'14px',padding:'4px 8px',marginLeft:'8px',flexShrink:0}}>
                    🗑
                  </button>
                )}
              </div>
            </Card>
          ))
        }
      </div>
    </div>
  );
}

function CreateProject({onSave, onSaveDraft, onCancel, initial, apiKey}){
  const STEPS=[
    {num:'01',label:'KPIs'},
    {num:'02',label:'Comportamiento'},
    {num:'03',label:'Contexto usuario'},
    {num:'04',label:'Funnel'},
    {num:'05',label:'Negocio'},
  ];
  const [sub,setSub]=useState(0);

  // ── Última actualización + insights IA (todos los bloques) ──────────────
  const [timestamps,setTimestamps]=useState(initial?.timestamps||{});
  const [insights,setInsights]=useState(initial?.insights||{});
  const [savingAI,setSavingAI]=useState(false);
  const [savedToast,setSavedToast]=useState(false);
  function touch(key){ setTimestamps(prev=>({...prev,[key]:new Date().toISOString()})); }
  function timeAgo(iso){
    if(!iso) return null;
    const days=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
    if(days<=0) return 'hoy';
    if(days===1) return 'hace 1 día';
    if(days<30) return `hace ${days} días`;
    const months=Math.floor(days/30);
    if(months<12) return `hace ${months} ${months===1?'mes':'meses'}`;
    const years=Math.floor(months/12);
    return `hace ${years} ${years===1?'año':'años'}`;
  }

  // Los KPIs se leen SIEMPRE del CSV subido — nada de valores manuales que puedan quedar desfasados.
  // IMPORTANTE: se agrega TODO el CSV (no solo la primera fila), para que el análisis
  // refleje el período completo y no un único día suelto.
  // Si se quita el CSV, se limpian también los valores derivados (ver setKpisCsvClean más abajo).
  useEffect(()=>{
    if(!kpisCsv||!kpisCsv.rows||!kpisCsv.rows.length) return;
    const headers=kpisCsv.headers;
    const rows=kpisCsv.rows;
    const findCol=(...keys)=>headers.find(h=>keys.some(k=>h.toLowerCase().includes(k)));

    // Parser robusto: soporta tanto formato US (1234.56) como EU (1.234,56) sin romper el número.
    const parseNum=(v)=>{
      if(v===null||v===undefined) return NaN;
      let s=v.toString().trim().replace(/[€%\s]/g,'');
      if(s==='') return NaN;
      const hasComma=s.includes(','), hasDot=s.includes('.');
      if(hasComma&&hasDot){
        if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
        else s=s.replace(/,/g,'');
      }else if(hasComma){
        const dec=s.split(',').pop();
        s=dec.length<=2?s.replace(',','.'):s.replace(/,/g,'');
      }
      return parseFloat(s);
    };

    const sesCol=findCol('sesion','session');
    const transCol=findCol('transacc','transaction');
    const ingCol=findCol('ingreso','revenue');
    const cvrCol=findCol('conversión','conversion','cvr');
    const rebCol=findCol('rebote','bounce');
    const ticCol=findCol('ticket','aov','valor medio','ingresos por transacc');
    const devCol=findCol('dispositivo','device');
    const dateCol=findCol('fecha','date','día');

    let totSes=0,totTrans=0,totIng=0,hasSes=false,hasTrans=false,hasIng=false;
    let sumRebPond=0,sumCvrPond=0,cvrPondWeight=0,hasCvrCol=false;
    let sumTicPond=0,ticPondWeight=0,hasTicCol=false;
    const devTot={desktop:0,mobile:0,tablet:0};
    let devSum=0;

    rows.forEach(r=>{
      const nSes=sesCol?parseNum(r[sesCol]):NaN;
      const nTrans=transCol?parseNum(r[transCol]):NaN;
      const nIng=ingCol?parseNum(r[ingCol]):NaN;
      if(!isNaN(nSes)){ totSes+=nSes; hasSes=true; }
      if(!isNaN(nTrans)){ totTrans+=nTrans; hasTrans=true; }
      if(!isNaN(nIng)){ totIng+=nIng; hasIng=true; }

      if(rebCol){
        const nReb=parseNum(r[rebCol]);
        if(!isNaN(nReb)&&!isNaN(nSes)) sumRebPond+=nReb*nSes;
      }
      if(cvrCol){
        const nCvr=parseNum(r[cvrCol]);
        if(!isNaN(nCvr)&&!isNaN(nSes)){ sumCvrPond+=nCvr*nSes; cvrPondWeight+=nSes; hasCvrCol=true; }
      }
      if(ticCol){
        const nTic=parseNum(r[ticCol]);
        if(!isNaN(nTic)&&!isNaN(nTrans)){ sumTicPond+=nTic*nTrans; ticPondWeight+=nTrans; hasTicCol=true; }
      }
      if(devCol&&!isNaN(nSes)){
        devSum+=nSes;
        const dv=(r[devCol]||'').toLowerCase();
        if(dv.includes('mobile')||dv.includes('móvil')) devTot.mobile+=nSes;
        else if(dv.includes('desktop')||dv.includes('escritorio')) devTot.desktop+=nSes;
        else if(dv.includes('tablet')) devTot.tablet+=nSes;
      }
    });

    setSesiones(hasSes?Math.round(totSes):'');
    setTransacciones(hasTrans?Math.round(totTrans):'');
    setIngresos(hasIng?totIng.toFixed(2):'');

    // CVR: si hay columna propia, media ponderada por sesiones; si no, se deriva de transacciones/sesiones (más fiable que promediar filas sin ponderar).
    if(hasCvrCol&&cvrPondWeight>0) setCvr((sumCvrPond/cvrPondWeight).toFixed(2));
    else if(hasSes&&hasTrans&&totSes>0) setCvr((totTrans/totSes*100).toFixed(2));
    else setCvr('');

    // Rebote: media ponderada por sesiones (evita que un día de poco tráfico distorsione la media).
    setRebote(hasSes&&totSes>0&&rebCol?(sumRebPond/totSes).toFixed(2):'');

    // Ticket medio: si hay columna propia, ponderado por transacciones; si no, se deriva de ingresos/transacciones.
    if(hasTicCol&&ticPondWeight>0) setTicket((sumTicPond/ticPondWeight).toFixed(2));
    else if(hasIng&&hasTrans&&totTrans>0) setTicket((totIng/totTrans).toFixed(2));
    else setTicket('');

    if(devCol&&devSum>0){
      setDesktop(Math.round(devTot.desktop/devSum*100));
      setMobile(Math.round(devTot.mobile/devSum*100));
      setTablet(Math.round(devTot.tablet/devSum*100));
    }

    if(dateCol){
      const vals=rows.map(r=>r[dateCol]).filter(Boolean).sort();
      if(vals.length) setPeriodo(`${vals[0]} → ${vals[vals.length-1]}`);
    }else{
      setPeriodo('');
    }
  },[kpisCsv]);

          <div style={{...T.small,background:'#0A1A14',border:`1px solid rgba(0,212,170,0.15)`,borderRadius:'6px',padding:'7px 10px',marginTop:'6px'}}>
            ✓ Columnas detectadas: {parsed.headers.join(', ')}
          </div>
        )}
      </div>
    );
  }

  // Genera "Comportamiento detectado" + "Oportunidad" para cada bloque que tenga datos.
  // Se ejecuta una sola vez al guardar (no por cada subida) para minimizar llamadas a la API.
  // Mandamos el CSV completo a la IA (no una muestra), con un límite de seguridad muy alto
  // solo para evitar romper la llamada con archivos desproporcionados.
  function fmtCsvBlock(d){
    const FILAS_MAX_IA=5000;
    const total=(d.rows||[]).length;
    const filas=total>FILAS_MAX_IA?d.rows.slice(0,FILAS_MAX_IA):d.rows;
    const nota=total>FILAS_MAX_IA?` (mostrando ${FILAS_MAX_IA} de ${total} filas — archivo muy grande)`:'';
    return `Columnas: ${(d.headers||[]).join(', ')}. Filas${nota}: ${JSON.stringify(filas)}`;
  }
  async function generarInsights(){
    const bloques={
      kpis: (cvr&&sesiones)||kpisCsv? `CVR ${cvr}%, sesiones ${sesiones}, rebote ${rebote}%, ticket ${ticket}, dispositivos desktop ${desktop}% / mobile ${mobile}% / tablet ${tablet}%.${kpisCsv?` CSV original — columnas: ${kpisCsv.headers.join(', ')}.`:''}`:null,
      exp1: exp1? fmtCsvBlock(exp1):null,
      exp2: exp2? fmtCsvBlock(exp2):null,
      exp3: exp3? fmtCsvBlock(exp3):null,
      busqueda: busquedaCsv? fmtCsvBlock(busquedaCsv):null,
      busquedaSegmento: busquedaSegmentoCsv? fmtCsvBlock(busquedaSegmentoCsv):null,
      voz: vozCsv? fmtCsvBlock(vozCsv):null,
      funnelQual: Object.keys(funnelQualImgs).length||Object.keys(checkoutStepImgs).length? `Capturas subidas para: ${Object.keys(funnelQualImgs).join(', ')}${checkoutSteps.length?', Checkout ('+checkoutSteps.map(s=>s.nombre).join(', ')+')':''}.`:null,
      funnelVol: funnelVolCsv? fmtCsvBlock(funnelVolCsv):null,
      funnelDisp: funnelDispCsv? fmtCsvBlock(funnelDispCsv):null,
      crm: crmCsv? fmtCsvBlock(crmCsv):null,
    };
    const activos=Object.entries(bloques).filter(([,v])=>v);
    if(!apiKey||activos.length===0) return;
    setSavingAI(true);
    try{
      const prompt=`Eres un analista CRO. Para cada uno de estos bloques de datos de un ecommerce de sector "${sector}", periodo "${periodo||'no especificado'}", devuelve un comportamiento detectado (1 frase concreta, con cifras si las hay) y una oportunidad accionable (1 frase). Bloques:\n\n${activos.map(([k,v])=>`### ${k}\n${v}`).join('\n\n')}\n\nResponde SOLO con un JSON así, una entrada por cada bloque listado arriba, usando exactamente esas claves: {"kpis":{"comportamiento":"...","oportunidad":"..."}, ...}`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido, sin markdown ni texto extra.');
      const parsed=JSON.parse(raw.replace(/```json/g,'').replace(/```/g,'').trim());
      setInsights(prev=>({...prev,...parsed}));
    }catch(e){
      console.error('No se pudieron generar los insights:',e);
    }finally{
      setSavingAI(false);
    }
  }

  function buildPayload(){
    return {
      id:projectId,
      name,domain,sector,periodo,
      createdAt:initial?.createdAt||new Date().toISOString().slice(0,10),
      quality:score(),
      kpisCsv:kpisCsv?{fileName:kpisCsv.fileName,headers:kpisCsv.headers,rows:kpisCsv.rows||[]}:null,
      kpisImg,
      kpis:{cvr,ticket,transacciones,trafico:sesiones,ingresos,rebote,desktop,mobile,tablet,tipoCompra,recurrentes:100-nuevos,nuevos},
      canales:canales.filter(c=>c.canal),
      canalConversion,
      abandonoPrincipal,pasosFunnel,
      descripcion,negocioRespuestas,
      crm:{tipo:crmSeleccionado,csv:crmCsv?crmCsv.fileName:null},
      exp1:!!exp1,exp2:!!exp2,exp3:!!exp3,
      exp1Data:exp1?{fileName:exp1.fileName,headers:exp1.headers,rows:exp1.rows||[]}:null,
      exp2Data:exp2?{fileName:exp2.fileName,headers:exp2.headers,rows:exp2.rows||[]}:null,
      exp3Data:exp3?{fileName:exp3.fileName,headers:exp3.headers,rows:exp3.rows||[]}:null,
      busquedaCsv:busquedaCsv?{fileName:busquedaCsv.fileName,headers:busquedaCsv.headers,rows:busquedaCsv.rows||[]}:null,
      busquedaSegmentoCsv:busquedaSegmentoCsv?{fileName:busquedaSegmentoCsv.fileName,headers:busquedaSegmentoCsv.headers,rows:busquedaSegmentoCsv.rows||[]}:null,
      vozCsv:vozCsv?{fileName:vozCsv.fileName,headers:vozCsv.headers,rows:vozCsv.rows||[]}:null,
      funnelQualImgs,checkoutSteps,checkoutStepImgs,
      funnelVolCsv:funnelVolCsv?{fileName:funnelVolCsv.fileName,headers:funnelVolCsv.headers,rows:funnelVolCsv.rows||[]}:null,
      funnelVolImg,
      funnelDispCsv:funnelDispCsv?{fileName:funnelDispCsv.fileName,headers:funnelDispCsv.headers,rows:funnelDispCsv.rows||[]}:null,
      funnelDispImg,
      timestamps,insights,
      tests:initial?.tests||[]
    };
  }
  // Guardado intermedio: disponible en cualquier paso, no navega a otra pantalla.
  // Permite guardar según se van subiendo cosas, sin tener que terminar los 5 pasos.
  async function handleSaveDraft(){
    await generarInsights();
    (onSaveDraft||onSave)(buildPayload());
    setSavedToast(true);
    setTimeout(()=>setSavedToast(false),3000);
  }
  // Guardado final: el botón principal del último paso. En modo creación, navega al detalle del proyecto.
  async function handleSave(){
    await generarInsights();
    onSave(buildPayload());
    setSavedToast(true);
    setTimeout(()=>setSavedToast(false),3000);
  }

  // Step tab bar
  function StepTabs(){
    return(
      <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,marginBottom:'22px',overflowX:'auto'}}>
        {STEPS.map((st,i)=>(
          <div key={st.num} onClick={()=>i<sub&&setSub(i)}
            style={{padding:'10px 14px',fontSize:'12px',fontWeight:600,cursor:i<sub?'pointer':'default',whiteSpace:'nowrap',
              color:i<sub?C.green:i===sub?C.white:C.txtDim,
              borderBottom:`2px solid ${i===sub?C.accent:'transparent'}`,
              background:'transparent'}}>
            {i<sub?'✓ ':''}{st.num} {st.label}
          </div>
        ))}
      </div>
    );
  }

  const isEdit = !!initial;
  // Id estable durante toda la sesión de creación/edición — así los guardados intermedios
  // (borrador) y el guardado final actualizan el MISMO proyecto en vez de crear duplicados.
  const [projectId]=useState(()=>initial?.id||('p'+Date.now()));

  return(
    <div className='fade' style={{padding:'28px 32px',maxWidth:'680px'}}>
      {savedToast&&(
        <div style={{position:'fixed',top:'20px',right:'20px',background:C.green,color:'#04342C',padding:'11px 18px',borderRadius:'8px',fontSize:'13px',fontWeight:600,zIndex:9999,boxShadow:'0 4px 16px rgba(0,0,0,0.35)',display:'flex',alignItems:'center',gap:'6px'}}>
          ✓ Guardado correctamente
        </div>
      )}
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'16px'}}>
        <button onClick={onCancel} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px'}}>← Proyectos</button>
        <span style={{color:C.txtDim}}>/</span>
        <span style={{fontSize:'13px',color:C.txt}}>{isEdit?'Editar proyecto':'Nuevo proyecto'}</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'16px'}}>
        <div>
          <h1 style={{...T.h1,marginBottom:'4px'}}>{isEdit?`Editar — ${initial.name}`:(name?`Crear proyecto — ${name}`:'Crear proyecto')}</h1>
          <p style={T.body}>Base de datos del cliente. Cuanto más completa, más precisos los perfiles sintéticos.</p>
        </div>
      </div>
      <QualityBar score={score()}/>
      <StepTabs/>

      {/* STEP 0 — KPIs */}
      {sub===0&&(
        <div>
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'14px'}}>Identificación</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
              <Input label='Nombre del cliente / proyecto' value={name} onChange={setName} placeholder='Ej: MiTienda.com — proyecto ecommerce moda' required/>
              <Input label='URL de la web' value={domain} onChange={setDomain} placeholder='https://www.cliente.com' required/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
              <Select label='Sector' value={sector} onChange={setSector} options={SECTORES}/>
            </div>
          </Card>
          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='KPIs principales' k='kpis'/>
            <p style={{...T.small,marginBottom:'14px'}}>Los KPIs se leen del CSV subido — nada de valores manuales que puedan quedar desfasados. Período recomendado: últimos 90 días (o última temporada cerrada si el sector es estacional).</p>
            <DataBox parsedCsv={kpisCsv} refCsv={refKpis} setterCsv={setKpisCsvClean} k='kpis'
              label='CSV de KPIs generales' hint='Métricas: Sesiones, Transacciones, Ingresos, Tasa de conversión, Tasa de rebote, Ingresos por transacción'
              tutorial={<span>1. GA4 → <b>Explorar → Exploración en blanco</b><br/>2. Dimensión (opcional): Fecha (para detectar el período) y/o Categoría de dispositivo (para el desglose)<br/>3. Métricas: Sesiones · Transacciones · Ingresos · Tasa de conversión · Tasa de rebote · Ingresos por transacción<br/>4. Período que quieras analizar → Exportar CSV</span>}
              imgVal={kpisImg} refImg={refKpisImg} setterImg={setKpisImg}
            />
            {kpisCsv?(
              <>
                <CsvTable parsed={kpisCsv}/>
                {periodo
                  ? <p style={{...T.small,color:C.green,marginTop:'8px'}}>📅 Período detectado en el CSV: {periodo}</p>
                  : <p style={{...T.small,marginTop:'8px'}}>⚠ No se detectó una columna de fecha para calcular el período automáticamente.</p>}
                <p style={{...T.label,margin:'14px 0 6px'}}>Valores leídos</p>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px',marginBottom:'10px'}}>
                  <StatChip label='Sesiones totales' value={sesiones}/>

                  <StatChip label='Ingresos' value={ingresos}/>
                  <StatChip label='Tasa de conversión' value={cvr} suffix='%'/>
                  <StatChip label='Tasa de rebote' value={rebote} suffix='%'/>
                  <StatChip label='Ticket medio' value={ticket}/>
                </div>
                {(desktop||mobile||tablet)&&kpisCsv.headers.some(h=>['dispositivo','device'].some(k=>h.toLowerCase().includes(k)))&&(
                  <>
                    <p style={{...T.label,margin:'10px 0 6px'}}>Sesiones por dispositivo (detectado en el CSV)</p>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px'}}>
                      <StatChip label='Desktop' value={desktop} suffix='%'/>
                      <StatChip label='Mobile' value={mobile} suffix='%'/>
                      <StatChip label='Tablet' value={tablet} suffix='%'/>
                    </div>
                  </>
                )}
              </>
            ):(
              <p style={{...T.small,textAlign:'center',padding:'18px 0'}}>Sube el CSV para ver los KPIs de este proyecto.</p>
            )}
            <InsightBlock k='kpis'/>
          </Card>
          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={onCancel}>Cancelar</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={savingAI}>{savingAI?'Guardando...':'💾 Guardar borrador'}</Btn>
              <Btn disabled={!name||!domain||!cvr||!sesiones||!ticket} onClick={()=>setSub(1)}>Siguiente →</Btn>
            </div>
          </div>
        </div>
      )}

      {/* STEP 1 — Comportamiento GA4 */}
      {sub===1&&(
        <div>
          <Card style={{marginBottom:'12px',border:`1px solid ${C.accent}`}}>
            <CardHeader title='Exp 1 — Quién es el usuario' k='exp1' tag={<Tag color='purple'>Obligatorio</Tag>}/>
            <p style={{...T.body,marginBottom:'14px'}}>Define los arquetipos base. Sin esto no se pueden generar perfiles fiables. Período recomendado: 6-12 meses.</p>
            <CSVBox parsed={exp1} refEl={ref1} setter={setExp1} required k='exp1'
              label='CSV de la Exploración 1'
              hint='Dimensiones: País, Ciudad, Edad, Género, Tipo usuario, Dispositivo · Métricas: Sesiones, Conversiones, CVR'
              tutorial={<span>1. GA4 → <b>Explorar → Exploración en blanco</b><br/>2. Dimensiones (filas): País · Ciudad · Edad · Género · Idioma<br/>3. Dimensiones (columnas): Tipo usuario · Dispositivo<br/>4. Métricas: Usuarios activos · Sesiones · Conversiones · CVR<br/>5. Últimos 90 días → Exportar CSV</span>}
            />
            <InsightBlock k='exp1'/>
          </Card>
          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Exp 2 — Cómo llega y de dónde viene' k='exp2' tag={<Tag color='amber'>Opcional +10%</Tag>}/>
            <p style={{...T.body,marginBottom:'14px'}}>Contexto mental de entrada por canal, fuente y campaña. Período recomendado: últimos 90 días.</p>
            <CSVBox parsed={exp2} refEl={ref2} setter={setExp2} k='exp2'
              label='CSV de la Exploración 2'
              hint='Dimensiones: Canal, Fuente/Medio, Campaña, Página destino · Métricas: Sesiones, CVR, Duración, Tasa de rebote, Sesiones con interacción'
              tutorial={<span>1. GA4 → <b>Explorar → Exploración en blanco</b><br/>2. Dimensiones (filas): Canal de sesión · Fuente/Medio · Campaña<br/>3. Dimensiones (columnas): Tipo usuario · Dispositivo<br/>4. Métricas: Sesiones · CVR · Duración media · Conversiones · Tasa de rebote · Sesiones con interacción<br/>5. Últimos 90 días → Exportar CSV</span>}
            />
            <InsightBlock k='exp2'/>
          </Card>
          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Exp 3 — Cómo navega y qué hace dentro' k='exp3' tag={<Tag color='amber'>Opcional +10%</Tag>}/>
            <p style={{...T.body,marginBottom:'14px'}}>Rutas reales por segmento. Diferencias entre conversor y no conversor. Período recomendado: últimos 90 días (mínimo).</p>
            <CSVBox parsed={exp3} refEl={ref3} setter={setExp3} k='exp3'
              label='CSV de la Exploración 3'
              hint='Nodo inicio: Página de destino · Tipos de nodo: Título de página, Nombre de evento, Búsqueda interna · Métrica del nodo: Recuento de eventos'
              tutorial={<span>1. GA4 → <b>Explorar → Exploración de rutas</b><br/>2. Nodo inicio: Página de destino (tu URL)<br/>3. Tipo de nodo (define qué se muestra en cada rama): Título de página y clase de pantalla · Nombre de evento · Término de búsqueda<br/>4. Métrica del nodo (arriba a la derecha, controla el ancho de cada rama): <b>Recuento de eventos</b> — o cambia a Usuarios activos si prefieres ver personas en vez de eventos<br/>5. Aplica segmentos: Por canal · Por dispositivo · Por conversores (para comparar quién convierte y quién no)<br/>6. Exportar CSV</span>}
            />
            <InsightBlock k='exp3'/>
          </Card>
          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(0)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={savingAI}>{savingAI?'Guardando...':'💾 Guardar borrador'}</Btn>
              <Btn disabled={!exp1} onClick={()=>setSub(2)}>Siguiente →</Btn>
            </div>
          </div>
        </div>
      )}

      {/* STEP 2 — Contexto usuario */}
      {sub===2&&(
        <div>
          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Usuarios nuevos vs recurrentes' k='nuevos'/>
            <p style={{...T.small,marginBottom:'10px'}}>No suele venir claro en el CSV de canales — percepción del cliente.</p>
            <label style={{...T.label,display:'block',marginBottom:'6px'}}>% Usuarios nuevos: <span style={{color:C.accent,fontWeight:700}}>{nuevos}%</span> · Recurrentes: {100-nuevos}%</label>
            <input type='range' min='0' max='100' step='5' value={nuevos} onChange={e=>{setNuevos(Number(e.target.value));touch('nuevos');}} style={{width:'100%',accentColor:C.accent}}/>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Comportamiento tras la búsqueda' k='busqueda' tag={<Tag color='amber'>Opcional</Tag>}/>
            <p style={{...T.body,marginBottom:'10px'}}>Qué hace el usuario después de buscar: a qué página va, si convierte, si la búsqueda no encuentra nada. Período recomendado: últimos 30-90 días.</p>
            <DataBox parsedCsv={busquedaCsv} refCsv={refBusqueda} setterCsv={setBusquedaCsv} k='busqueda'
              label='CSV de comportamiento tras búsqueda'
              hint='Columnas: término buscado, sesiones con búsqueda, página de destino tras búsqueda, CVR tras búsqueda, % búsquedas sin resultados'
              tutorial={<span>GA4 → Informes → Interacción → <b>Búsqueda en el sitio</b> → añade "Página de destino" y "% búsquedas sin resultados" como dimensiones secundarias → Exportar CSV</span>}
              imgVal={null} refImg={null} setterImg={()=>{}}
            />
            <InsightBlock k='busqueda'/>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Términos más buscados por segmento' k='busquedaSegmento' tag={<Tag color='amber'>Opcional</Tag>}/>
            <p style={{...T.body,marginBottom:'10px'}}>Qué escribe cada tipo de usuario en el buscador — mobile busca distinto que desktop, y un nuevo distinto que un recurrente. Período recomendado: últimos 30-90 días.</p>
            <DataBox parsedCsv={busquedaSegmentoCsv} refCsv={refBusquedaSegmento} setterCsv={setBusquedaSegmentoCsv} k='busquedaSegmento'
              label='CSV de términos por segmento'
              hint='Columnas: término buscado, dispositivo, tipo usuario, nº búsquedas, CVR'
              tutorial={<span>1. GA4 → <b>Explorar → Exploración en blanco</b><br/>2. Dimensiones (filas): Término buscado · Categoría de dispositivo · Tipo de usuario<br/>3. Métricas: Vistas de búsqueda en el sitio · Sesiones · CVR<br/>4. Últimos 30-90 días → Exportar CSV</span>}
              imgVal={null} refImg={null} setterImg={()=>{}}
            />
            <InsightBlock k='busquedaSegmento'/>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Voz del cliente' k='voz' tag={<Tag color='amber'>Opcional</Tag>}/>
            <p style={{...T.body,marginBottom:'10px'}}>Reseñas o tickets de soporte — objeciones reales con su lenguaje literal. Período recomendado: últimos 6-12 meses.</p>
            <DataBox parsedCsv={vozCsv} refCsv={refVoz} setterCsv={setVozCsv} k='voz'
              label='CSV de reseñas o tickets' hint='Columnas: fecha, texto, valoración (si aplica)'
              imgVal={null} refImg={null} setterImg={()=>{}}
            />
            <InsightBlock k='voz'/>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Funnel — capturas por tipo de página' k='funnelQual'/>
            <p style={{...T.body,marginBottom:'12px'}}>Sube, por cada tipo de página, el heatmap de clics, el mapa de scroll y las señales de frustración (rage clicks, dead clicks, quick backs). Período recomendado: últimos 30-60 días.</p>

            {PAGINAS_FUNNEL.map(pg=>{
              const imgs=funnelQualImgs[pg]||{};
              const open=openPagina===pg;
              return(
                <div key={pg} style={{border:`1px solid ${C.border}`,borderRadius:'8px',marginBottom:'8px',overflow:'hidden'}}>
                  <div onClick={()=>setOpenPagina(open?null:pg)}
                    style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',cursor:'pointer',background:'#0F0F1C'}}>
                    <span style={{fontSize:'13px',color:C.txt}}>{pg}</span>
                    <span style={{fontSize:'11px',color:C.txtDim}}>{open?'▲':'▼'}</span>
                  </div>
                  {open&&(
                    <div style={{padding:'12px 14px',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}}>
                      <MiniImgBox label='Heatmap de clics' val={imgs.heatmapClics} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],heatmapClics:v}}))}/>
                      <MiniImgBox label='Mapa de scroll' val={imgs.mapaScroll} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],mapaScroll:v}}))}/>
                      <MiniImgBox label='Señales de frustración' val={imgs.frustracion} refEl={React.createRef()} k='funnelQual'
                        setter={v=>setFunnelQualImgs(prev=>({...prev,[pg]:{...prev[pg],frustracion:v}}))}/>
                    </div>
                  )}
                </div>
              );
            })}

            {/* Checkout — pasos configurables */}
            <div style={{border:`1px solid ${C.border}`,borderRadius:'8px',marginBottom:'8px',overflow:'hidden'}}>
              <div onClick={()=>setOpenPagina(openPagina==='Checkout'?null:'Checkout')}

                <span style={{fontSize:'11px',color:C.txtDim}}>{openPagina==='Checkout'?'▲':'▼'}</span>
              </div>
              {openPagina==='Checkout'&&(
                <div style={{padding:'12px 14px'}}>
                  <p style={{...T.small,marginBottom:'10px'}}>Cada ecommerce tiene su propio número de pasos de checkout. Sube solo los que existan en el tuyo.</p>
                  {checkoutSteps.map((st,i)=>{
                    const imgs=checkoutStepImgs[st.id]||{};
                    return(
                      <div key={st.id} style={{border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',marginBottom:'8px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
                          <span style={{width:'20px',height:'20px',borderRadius:'50%',background:C.accentDim,color:C.accent,fontSize:'11px',fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{i+1}</span>
                          <input value={st.nombre} onChange={e=>{const n=[...checkoutSteps];n[i]={...n[i],nombre:e.target.value};setCheckoutSteps(n);}}
                            style={{flex:1,background:'#070713',border:`1px solid ${C.border}`,borderRadius:'6px',padding:'6px 10px',color:C.txt,fontSize:'12px',outline:'none'}}/>
                          {checkoutSteps.length>1&&<button onClick={()=>setCheckoutSteps(checkoutSteps.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:C.txtDim,cursor:'pointer',fontSize:'13px'}}>✕</button>}
                        </div>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}}>
                          <MiniImgBox label='Heatmap de clics' val={imgs.heatmapClics} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],heatmapClics:v}}))}/>
                          <MiniImgBox label='Mapa de scroll' val={imgs.mapaScroll} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],mapaScroll:v}}))}/>
                          <MiniImgBox label='Señales de frustración' val={imgs.frustracion} refEl={React.createRef()} k='funnelQual'
                            setter={v=>setCheckoutStepImgs(prev=>({...prev,[st.id]:{...prev[st.id],frustracion:v}}))}/>
                        </div>
                      </div>
                    );
                  })}
                  <button onClick={()=>setCheckoutSteps([...checkoutSteps,{id:Date.now(),nombre:`Paso ${checkoutSteps.length+1}`}])}
                    style={{fontSize:'12px',color:C.accent,background:'none',border:'none',cursor:'pointer',padding:'6px 0'}}>+ Añadir paso</button>
                </div>
              )}
            </div>
            <InsightBlock k='funnelQual'/>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(1)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={savingAI}>{savingAI?'Guardando...':'💾 Guardar borrador'}</Btn>
              <Btn onClick={()=>setSub(3)}>Siguiente →</Btn>
            </div>
          </div>
        </div>
      )}

      {/* STEP 3 — Funnel */}
      {sub===3&&(
        <div>

            <CardHeader title='Pasos del funnel y volumen' k='funnelVol'/>

              <Btn variant='ghost' onClick={handleSaveDraft} disabled={savingAI}>{savingAI?'Guardando...':'💾 Guardar borrador'}</Btn>

              {id:'pctRecurrencia',label:'¿Qué % de clientes repite compra aproximadamente?',tipo:'texto',placeholder:'Ej: Alrededor del 30% vuelve en 6 meses'},

            {id:'marketing',icon:'📣',label:'Comunicación y marketing',preguntas:[
              {id:'hacenEmail',label:'¿Hacéis campañas de email?',tipo:'sino'},
              {id:'frecuenciaEmail',label:'¿Con qué frecuencia?',tipo:'texto',placeholder:'Ej: 2 emails semanales + newsletter mensual'},

              {id:'queAutomatizaciones',label:'¿Cuáles?',tipo:'texto',placeholder:'Ej: Carrito abandonado a las 2h y 24h, email bienvenida con descuento'},

              {id:'influencers',label:'¿Trabajáis con influencers o afiliados?',tipo:'sino'},

            {id:'fisica',icon:'🏪',label:'Presencia física y omnicanal',preguntas:[
              {id:'tiendaFisica',label:'¿Tenéis tienda física además del ecommerce?',tipo:'sino'},
              {id:'clientesCruzados',label:'¿Los clientes de tienda también compran online?',tipo:'sino'},
              {id:'marketplaces',label:'¿Vendéis en marketplaces? (Amazon, Zalando...)',tipo:'sino'},
              {id:'queMarketplaces',label:'¿Cuáles?',tipo:'texto',placeholder:'Ej: Amazon y Zalando con stock limitado'},
            ]},
            {id:'fricciones',icon:'💬',label:'Dudas y fricciones frecuentes',preguntas:[
              {id:'quejaFrecuente',label:'¿Cuál es la queja o duda más frecuente del cliente?',tipo:'texto',placeholder:'Ej: Dudas sobre tallas, retrasos en temporada alta...'},
              {id:'puntoContacto',label:'¿En qué punto del proceso contactan más con atención al cliente?',tipo:'texto',placeholder:'Ej: Después de comprar para saber el estado del pedido'},
              {id:'tieneChat',label:'¿Tienes chat en la web?',tipo:'sino'},
              {id:'tipoChat',label:'¿De qué tipo?',tipo:'texto',placeholder:'Ej: Chatbot IA + agente humano en horario laboral'},
            ]},
          ].map(bloque=>(
            <BloqueNegocio key={bloque.id} bloque={bloque}
              valores={negocioRespuestas}
              onChange={(id,val)=>setNegocioRespuestas(prev=>({...prev,[id]:val}))}/>
          ))}

          <Card style={{marginBottom:'12px'}}>
            <CardHeader title='Datos de BBDD / CRM' k='crm' tag={<Tag color='amber'>Opcional</Tag>}/>
            <p style={{...T.body,marginBottom:'10px'}}>Sube un CSV exportado de tu CRM con datos agregados y anonimizados. No necesitamos emails ni nombres — solo patrones de comportamiento. Período recomendado: últimos 12 meses (la recurrencia y el LTV necesitan ventana larga).</p>

            </div>
            <div onClick={()=>refCrm.current.click()}
              style={{border:`1.5px dashed ${crmCsv?C.green:C.border}`,borderRadius:'10px',padding:'16px',textAlign:'center',cursor:'pointer',background:crmCsv?C.greenDim:'#070713'}}>
              <input ref={refCrm} type='file' accept='.csv,.xlsx,.xls,.txt' style={{display:'none'}} onChange={e=>handleFile(e.target.files[0],setCrmCsv,'crm')}/>
              <div style={{fontSize:'20px',marginBottom:'5px'}}>📁</div>
              {crmCsv?<p style={{fontSize:'13px',fontWeight:600,color:C.green}}>{crmCsv.fileName} · {crmCsv.rows?.length||0} filas</p>
                :<p style={{fontSize:'13px',color:C.txtDim}}>Arrastra CSV/Excel o haz clic para subir</p>}
              <p style={{...T.small,marginTop:'4px'}}>Columnas recomendadas: segmento, ticket_medio, frecuencia_compra, ltv, canal_origen, fecha_ultima_compra</p>
            </div>
            {crmCsv&&<div style={{...T.small,background:'#0A1A14',border:`1px solid rgba(0,212,170,0.15)`,borderRadius:'6px',padding:'7px 10px',marginTop:'6px'}}>✓ Columnas detectadas: {crmCsv.headers?.join(', ')}</div>}
            <InsightBlock k='crm'/>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setSub(3)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={savingAI}>{savingAI?'Guardando...':'💾 Guardar borrador'}</Btn>
              <Btn variant='green' onClick={handleSave} disabled={savingAI}>{savingAI?'Analizando datos...':(isEdit?'Guardar cambios':'Crear proyecto')+' ('+score()+'% precisión)'}</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const AVATAR_COLORS=['#6C63FF','#00D4AA','#FF6B9D','#F5A623','#4ECDC4','#A78BFA','#34D399','#FB923C'];
const NIVEL_CONSCIENCIA=['No consciente del problema','Consciente del problema','Consciente de la solución','Consciente del producto','Listo para comprar'];
const TIPO_PERFIL_COLOR={esceptico:'amber',cazador_precio:'blue',impulsivo:'green',analitico:'purple',perdido:'default',ideal:'green',recurrente:'green',primerizo:'amber',movil:'blue',escritorio:'default',regalo:'amber',investigador:'default',comparador:'amber',decidido:'green'};

function ProfileModal({profile, idx, onClose}){

        {/* Header */}
        <div style={{padding:'20px 22px',borderBottom:`1px solid ${C.border}`,display:'flex',gap:'14px',alignItems:'center',position:'sticky',top:0,background:'#0F0F1C',zIndex:1}}>
          <div style={{width:'48px',height:'48px',borderRadius:'50%',background:col,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',fontWeight:700,color:'#fff',flexShrink:0}}>{profile.initials||'P'+(idx+1)}</div>
          <div style={{flex:1}}>
            <p style={{fontSize:'16px',fontWeight:700,color:C.white,marginBottom:'2px'}}>{profile.nombre||`Perfil #${profile.id}`}</p>

          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:'20px',fontWeight:700,color:profile.prob_conversion>0.05?C.green:C.amber}}>{(profile.prob_conversion*100).toFixed(1)}%</div>
            <div style={{fontSize:'10px',color:C.txtDim}}>prob. conversión</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',color:C.txtDim,cursor:'pointer',fontSize:'18px',marginLeft:'8px'}}>✕</button>
        </div>

        <div style={{padding:'18px 22px',display:'flex',flexDirection:'column',gap:'14px'}}>

          {/* Tipo de perfil */}
          {profile.tipo_perfil&&(
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
              {(Array.isArray(profile.tipo_perfil)?profile.tipo_perfil:[profile.tipo_perfil]).map(t=>(
                <Tag key={t} color={TIPO_PERFIL_COLOR[t]||'default'}>{t.replace(/_/g,' ')}</Tag>

          )}

          {/* Nivel de consciencia */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Nivel de consciencia (Schwartz)</p>
            <div style={{display:'flex',gap:'4px'}}>
              {NIVEL_CONSCIENCIA.map((lbl,i)=>(

              ))}
            </div>
            <p style={{fontSize:'12px',color:C.accent,marginTop:'8px',fontWeight:600}}>{nc}/5 — {NIVEL_CONSCIENCIA[nc-1]}</p>

          {/* Contexto de compra */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Contexto de compra</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>

              ))}
            </div>
          </div>

          {/* Motivadores */}
          {profile.motivadores&&profile.motivadores.length>0&&(
            <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Motivadores principales</p>
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                {profile.motivadores.map(m=>(
                  <span key={m} style={{background:C.greenDim,color:C.green,fontSize:'11px',fontWeight:600,padding:'3px 10px',borderRadius:'20px'}}>✓ {m}</span>

            </div>
          )}

          {/* Objeciones */}
          {profile.objeciones&&profile.objeciones.length>0&&(
            <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Objeciones principales</p>
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                {profile.objeciones.map(o=>(
                  <span key={o} style={{background:C.redDim,color:C.red,fontSize:'11px',fontWeight:600,padding:'3px 10px',borderRadius:'20px'}}>⚠ {o}</span>
                ))}
              </div>
            </div>
          )}

          {/* Comportamiento digital */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Comportamiento digital</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px'}}>

                ['Compara alternativas',profile.compara_alternativas],
                ['Lee reseñas',profile.lee_resenas],
                ['Busca cupones',profile.busca_cupones],
                ['Compra impulsivamente',profile.compra_impulsiva],
                ['Necesita hablar antes',profile.necesita_contacto],
                ['Canal de entrada',profile.canal],
              ].filter(([,v])=>v!==undefined&&v!==null).map(([k,v])=>(
                <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#13131F',borderRadius:'6px',padding:'7px 10px'}}>
                  <span style={{fontSize:'11px',color:C.txtMid}}>{k}</span>
                  <span style={{fontSize:'11px',fontWeight:600,color:v===true||v==='sí'||v==='si'?C.green:v===false||v==='no'?C.red:C.txt}}>{v===true||v==='sí'||v==='si'?'Sí':v===false||v==='no'?'No':v}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Comportamiento en página */}
          <div style={{background:'#0A0A18',borderRadius:'10px',padding:'12px 14px'}}>
            <p style={{...T.label,marginBottom:'10px'}}>Comportamiento en esta página</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px'}}>
              {[
                ['Tiempo sesión',profile.tiempo_sesion_seg?(profile.tiempo_sesion_seg+'s'):'—'],
                ['Scroll depth',(profile.scroll_depth||'—')+'%'],
                ['Prob. conversión',((profile.prob_conversion||0)*100).toFixed(1)+'%'],
                ['Fase funnel',profile.fase_funnel||'—'],
                ['Sensib. precio',profile.sensibilidad_precio||'—'],
                ['Motivación',profile.motivacion||'—'],
              ].map(([k,v])=>(
                <div key={k} style={{background:'#13131F',borderRadius:'6px',padding:'7px 8px',textAlign:'center'}}>
                  <div style={{fontSize:'10px',color:C.txtDim,marginBottom:'2px'}}>{k}</div>
                  <div style={{fontSize:'12px',color:C.txt,fontWeight:600}}>{v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Cómo reacciona a la variante */}
          {profile.reaccion_variante&&(
            <div style={{background:'#0F0F2A',border:`1px solid rgba(108,99,255,0.2)`,borderRadius:'10px',padding:'12px 14px'}}>
              <p style={{...T.label,marginBottom:'6px',color:C.accent}}>Cómo reaccionará a la variante B</p>
              <p style={{fontSize:'12px',color:C.txtMid,lineHeight:'1.7'}}>{profile.reaccion_variante}</p>
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

function ProfileGrid({profiles, sector}){
  const [selected,setSelected]=useState(null);
  const tipos={esceptico:'🔍',cazador_precio:'💰',impulsivo:'⚡',analitico:'📊',perdido:'❓',ideal:'⭐',recurrente:'🔄',primerizo:'🆕',movil:'📱',escritorio:'💻',regalo:'🎁',investigador:'🔬',comparador:'⚖️',decidido:'✅'};
  return(
    <>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'10px'}}>
        {profiles.map((p,i)=>{
          const tipo=Array.isArray(p.tipo_perfil)?p.tipo_perfil[0]:p.tipo_perfil;
          const emoji=tipos[tipo]||'👤';
          const nc=p.nivel_consciencia||3;
          return(
            <div key={p.id} onClick={()=>setSelected({p,i})}
              style={{background:'#0D0D18',border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px',cursor:'pointer',transition:'border-color 0.15s',':hover':{borderColor:C.accent}}}>
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}}>
                <div style={{width:'34px',height:'34px',borderRadius:'50%',background:AVATAR_COLORS[i%8],display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:700,color:'#fff',flexShrink:0}}>{p.initials||'P'+(i+1)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:'12px',fontWeight:600,color:C.white,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.nombre||`Perfil #${p.id}`}</div>
                  <div style={{fontSize:'10px',color:C.txtDim}}>{p.edad} · {p.ciudad}</div>
                </div>
                <span style={{fontSize:'16px'}}>{emoji}</span>

  {cat:'Dispositivo',options:[
    {v:'todos',label:'Todos los dispositivos'},
    {v:'mobile',label:'Solo mobile'},
    {v:'desktop',label:'Solo desktop'},
    {v:'tablet',label:'Solo tablet'},

    {v:'desktop_tablet',label:'Desktop y Tablet'},
  ]},
  {cat:'Tipo de usuario',options:[
    {v:'todos',label:'Todos los usuarios'},

    {v:'recurrente',label:'Solo recurrentes'},
  ]},
  {cat:'Canal de entrada',options:[

    {v:'organico',label:'Orgánico / SEO'},
    {v:'paid',label:'Paid (SEM/Social)'},
