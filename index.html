    {v:'social',label:'Social orgánico'},
    {v:'directo',label:'Directo'},
  ]},
];
const DISPOSITIVO_LABEL={todos:'Todos',mobile:'Mobile',desktop:'Desktop',tablet:'Tablet',mobile_tablet:'Mobile, Tablet',desktop_tablet:'Desktop, Tablet'};
// Compara el valor de dispositivo de una fila del CSV contra el segmento elegido (soporta combinaciones)
function matchDispositivo(d,seg){
  if(!d) return false;
  d=String(d).toLowerCase();
  if(seg==='todos') return true;
  if(seg==='mobile_tablet') return d.includes('mobile')||d.includes('tablet');
  if(seg==='desktop_tablet') return d.includes('desktop')||d.includes('tablet');
  return d.includes(seg);
}

  // Pegar tabla copiada directamente de GA4 — evita el problema de coma decimal vs separador CSV
  function PasteCsvBox({parsed,setter}){

        style={{width:'100%',minHeight:'90px',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px',color:C.txt,fontSize:'12px',fontFamily:'monospace',outline:'none',resize:'vertical'}}

  const paginas=['página de producto','homepage','checkout','categoría','carrito','landing de campaña','página de colección'];
  const metricas=['tasa de conversión','clics en CTA','tasa de rebote','tiempo en página','añadidos al carrito','ingresos por sesión'];

  // La IA analiza el brief, y si le falta algo crítico pregunta UNA vez antes de interpretar el experimento.
  // No debe repetir lo que el proyecto ya sabe (exp1/exp2/exp3, CRM, canales...).
  async function entenderTest(respuestasExtra){
    setEntenderLoading(true);setEntenderErr('');
    try{
      const datosProyecto=[
        project.exp1Data?'Quién es el usuario (demografía, dispositivo)':null,
        project.exp2Data?'Cómo llega (canal, adquisición)':null,
        project.exp3Data?'Cómo navega (rutas, eventos)':null,
        project.crm?.csv||project.crm?.plataforma?'CRM / datos de compra':null,
        csvRutas?'Sesiones reales de esta URL (CSV ya subido)':null,
      ].filter(Boolean);
      const respTxt=Object.keys(respuestasExtra||{}).length?`\nRESPUESTAS DEL CRO A LAS PREGUNTAS ANTERIORES:\n${Object.entries(respuestasExtra).map(([q,a])=>`- ${q} → ${a}`).join('\n')}`:'';
      const prompt=`Eres un CRO experto ayudando a preparar un test A/B antes de lanzarlo. No ejecutas la configuración a ciegas: primero entiendes el experimento.

PROYECTO: sector ${project.sector}, CVR base ${project.kpis.cvr}%, ticket medio ${project.kpis.ticket}€
DATOS QUE EL PROYECTO YA TIENE (no los vuelvas a pedir): ${datosProyecto.join(', ')||'ninguno todavía'}

BRIEFING DEL CRO:
URL a testar: ${url} (${pagina})
Contexto, hipótesis y estrategia: ${hip}
${respTxt}

TAREA:
1. Si falta información crítica para entender bien el experimento (y NO la puedes deducir razonablemente), genera hasta 5 preguntas cortas y específicas — nunca genéricas, nunca repitas algo que el briefing ya responde. Si ya tienes suficiente para interpretar el experimento con confianza, deja "preguntas" como array vacío.
2. Si "preguntas" queda vacío, rellena "interpretacion" con una lectura estructurada del experimento (problema detectado, qué comportamiento se quiere modificar, la hipótesis causal, el elemento afectado, qué usuarios se ven potencialmente afectados, en qué momento del funnel ocurre, y el resultado esperado). Si "preguntas" NO está vacío, deja "interpretacion" en null — primero se responde, luego se interpreta.
3. Cuando rellenes "interpretacion", rellena también "datos_necesarios": la lista de datos reales necesarios para construir un baseline fiable de ESTE experimento en concreto — usa primero lo que el proyecto ya tiene (márcalo "disponible":true), y pide después solo lo que falta ("disponible":false). Cada uno con prioridad (Necesario/Recomendado), fuente típica (GA4/Clarity/CRM/manual) y por qué hace falta.
4. Rellena también "instrucciones_extra": pasos claros para conseguir de UNA SOLA VEZ, en UNA exploración de GA4 (o Clarity si aplica), TODOS los datos marcados como "disponible":false — combina sus dimensiones y métricas en una sola tabla exportable, no expliques cada uno por separado. Formato: pasos numerados cortos (GA4 → Explorar → Exploración en blanco → dimensiones: ... → métricas: ... → Exportar CSV). Si no falta nada, deja este campo vacío.

Responde SOLO JSON:
{"preguntas":["¿...?","¿...?"],
"interpretacion":null,
"datos_necesarios":[{"dato":"Usuarios en esta página","prioridad":"Necesario","fuente":"GA4","razon":"Dimensionar la población simulada","disponible":false}],
"instrucciones_extra":"1. GA4 → Explorar...\\n2. Dimensiones: ...\\n3. Métricas: ...\\n4. Exportar CSV"}`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido, sin markdown ni texto extra.');
      const parsed=parseJSON(raw);
      if(parsed.preguntas&&parsed.preguntas.length){
        setPreguntasIA(parsed.preguntas);
        setInterpretacion(null);
        setDatosNecesarios(null);
        setInstruccionesExtra('');
      }else{
        setPreguntasIA([]);
        setInterpretacion(parsed.interpretacion||null);
        setDatosNecesarios(parsed.datos_necesarios||null);
        setInstruccionesExtra(parsed.instrucciones_extra||'');
      }
    }catch(e){ setEntenderErr('Error: '+e.message); }
    setEntenderLoading(false);
  }

  // Extrae el baseline REAL de la métrica principal a partir de los CSV ya subidos (no del CVR genérico
  // de la página) — esto es lo que ancla el Control simulado, para no inventar un punto de partida distinto
  // del real (el fallo típico: Control sintético al 9% cuando el histórico real está al 54%).
  async function detectarBaseline(){
    if(!metricaP) return;
    setDetectandoBaseline(true);setErrBaseline('');
    try{
      const csvs=[
        csvRutas?.raw&&`CSV de comportamiento de esta URL:\n${csvRutas.raw}`,
        datosExtraCsv?.raw&&`CSV de datos adicionales (funnel/otros):\n${datosExtraCsv.raw}`,
      ].filter(Boolean);
      if(!csvs.length){
        setErrBaseline('No hay ningún CSV subido todavía para detectar el baseline real — sube al menos el de comportamiento de la URL, en el paso "Entender experimento".');
        setDetectandoBaseline(false);
        return;
      }
      const prompt=`Eres un analista de datos. Busca el baseline histórico REAL de esta métrica concreta en los datos que te paso — no inventes ni promedies con otra cosa que no sea exactamente esta métrica.

MÉTRICA PRINCIPAL DEL TEST: "${metricaP}"${metricaPDesc?` — ${metricaPDesc}`:''}
CONTEXTO: ${hip}

${csvs.join('\n\n')}

TAREA: identifica en estos datos el valor real histórico (%) que más se acerque a esta métrica exacta. Si hay varias columnas candidatas, prioriza la más literal (ej: si la métrica es "CTR en botón continuar como invitado", busca clics/eventos de ese botón concreto sobre visitantes, NO la conversión general de la página). Si de verdad no hay ningún dato que sirva de baseline para esta métrica exacta, dilo claramente en vez de inventar un número.

Responde SOLO JSON:
{"baseline_pct":54.4,"fuente":"Columna 'sesiones_con_interaccion' / 'visitantes' del CSV de comportamiento, filas de esta URL","encontrado":true}
Si no encuentras nada fiable: {"baseline_pct":null,"fuente":"","encontrado":false}`;
      const raw=await callClaude(apiKey,[{role:'user',content:prompt}],'Responde SOLO JSON válido, sin markdown ni texto extra.');
      const parsed=parseJSON(raw);
      if(parsed.encontrado&&parsed.baseline_pct!=null){
        setBaselineReal(String(parsed.baseline_pct));
        setBaselineFuente(parsed.fuente||'');
      }else{
        setErrBaseline('No he encontrado en tus datos un baseline claro para esta métrica exacta — puedes introducirlo a mano si lo conoces, o el modelo estimará con criterio general (menos fiable).');
      }
    }catch(e){ setErrBaseline('Error: '+e.message); }
    setDetectandoBaseline(false);
  }

  async function recomendarMetricas(){

URL: ${url} (${pagina}). Control: ${varA}. Variante: ${varB}.

2. Recomienda CUATRO métricas SECUNDARIAS que, entre todas, cubran: un efecto downstream en el funnel, un posible efecto negativo/de fricción, un cambio de comportamiento, y el impacto de negocio (ingresos/ticket).
Cada métrica lleva: nombre, descripción de cómo se mide, dirección de mejora (increase si más es mejor, decrease si menos es mejor).

Responde SOLO JSON:
{"principal":{"nombre":"...","desc":"...","direccion":"increase","razon":"..."},
"secundarias":[{"nombre":"...","desc":"...","direccion":"increase"},{"nombre":"...","desc":"...","direccion":"increase"},{"nombre":"...","desc":"...","direccion":"decrease"},{"nombre":"...","desc":"...","direccion":"increase"}]}`;

  async function generarPerfiles(){
    setLoadingP(true);setErrP('');
    try{
      const tieneSesiones = csvRutas && csvRutas.raw;

      // Si son muchos perfiles, generamos en lotes de 20 para evitar que se corte el JSON
      const LOTE = 5;
      const lotes = [];
      let restantes = nProfiles;
      let offset = 0;
      while(restantes > 0){
        lotes.push({n: Math.min(LOTE, restantes), offset});
        offset += LOTE;

      // Clonar arquetipos hasta nSesiones con variación estadística ±15%
      function clonarSesiones(arquetipos, total) {
        const sesiones = [];
        const porArquetipo = Math.floor(total / arquetipos.length);
        const resto = total % arquetipos.length;
        arquetipos.forEach((arq, idx) => {
          const n = porArquetipo + (idx < resto ? 1 : 0);
          for(let i = 0; i < n; i++) {
            const variacion = (v, pct=0.15) => {
              if(typeof v !== 'number') return v;
              const delta = v * pct * (Math.random()*2-1);
              return Math.max(0, Math.round((v + delta) * 1000) / 1000);
            };
            sesiones.push({
              ...arq,
              id: String(sesiones.length+1).padStart(5,'0'),
              prob_conversion: Math.min(1, Math.max(0, variacion(arq.prob_conversion, 0.2))),
              scroll_depth: Math.min(100, Math.max(0, variacion(arq.scroll_depth, 0.15))),
              tiempo_sesion_seg: Math.max(5, variacion(arq.tiempo_sesion_seg, 0.2)),
              _arquetipo: arq.id,
            });
          }
        });
        return sesiones;
      }

      const clones = clonarSesiones(todos, nSesiones);
      setProfiles({arquetipos: todos, sesiones: clones, total: nSesiones});
    }catch(e){setErrP('Error: '+e.message);}

                    ['Elemento afectado',interpretacion.elemento_afectado],
                    ['Usuarios afectados',interpretacion.usuarios_afectados],
                    ['Momento del funnel',interpretacion.momento_funnel],
                    ['Resultado esperado',interpretacion.resultado_esperado],

                </button>

                {datosNecesarios&&datosNecesarios.length>0&&(()=>{
                  // Disponibilidad y ORIGEN calculados EN VIVO — no lo que devolvió la IA en su momento, sino lo que hay subido ahora mismo
                  const fuentesGA4=[
                    csvRutas&&'CSV de esta URL (test)',
                    datosExtraCsv&&'CSV combinado subido aquí',
                    project.funnelVolCsv&&'CSV del funnel (proyecto)',
                    project.funnelDispCsv&&'CSV funnel por dispositivo (proyecto)',
                    project.exp1Data&&'Exp1 — Quién es el usuario (proyecto)',
                    project.exp2Data&&'Exp2 — Cómo llega (proyecto)',
                    project.exp3Data&&'Exp3 — Cómo navega (proyecto)',
                    project.kpisCsv&&'CSV de KPIs (proyecto)',
                    project.busquedaCsv&&'CSV de búsqueda interna (proyecto)',
                    project.busquedaSegmentoCsv&&'CSV de términos por segmento (proyecto)',
                    (!csvRutas&&!datosExtraCsv&&!project.funnelVolCsv&&!project.exp1Data&&project.kpis?.cvr)&&'KPIs básicos del proyecto (sin CSV)',
                  ].filter(Boolean);
                  const fuentesCualitativo=[
                    pageImgs?.heatmapClics&&'Heatmap de clics (test)',
                    pageImgs?.heatmapScroll&&'Heatmap de scroll (test)',
                    project.funnelQualImgs&&Object.keys(project.funnelQualImgs).length>0&&'Capturas del funnel (proyecto)',
                  ].filter(Boolean);
                  const fuentesCrm=[project.crm?.csv&&'CSV de CRM (proyecto)',project.crm?.plataforma&&`CRM conectado — ${project.crm.plataforma}`].filter(Boolean);
                  const origenesDisponibles=d=>{
                    const f=(d.fuente||'').toLowerCase();
                    if(/ga4|analytics/.test(f)) return fuentesGA4;
                    if(/clarity|hotjar|fullstory/.test(f)) return fuentesCualitativo;
                    if(/crm/.test(f)) return fuentesCrm;
                    return [];
                  };
                  const esDisponible=d=>{
                    const origenes=origenesDisponibles(d);
                    if(origenes.length) return true;
                    if(!/ga4|analytics|clarity|hotjar|fullstory|crm/.test((d.fuente||'').toLowerCase())) return !!d.disponible;
                    return false;
                  };
                  const faltan=datosNecesarios.filter(d=>!esDisponible(d));
                  return(
                  <div>
                    <p style={{...T.label,marginBottom:'8px'}}>Datos necesarios para simular este test</p>
                    <div style={{overflowX:'auto'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px',minWidth:'560px'}}>
                        <thead>
                          <tr style={{borderBottom:`1px solid ${C.border}`,color:C.txtDim,textAlign:'left'}}>
                            <th style={{padding:'6px 8px',fontWeight:600}}>Dato</th>
                            <th style={{padding:'6px 8px',fontWeight:600}}>Prioridad</th>
                            <th style={{padding:'6px 8px',fontWeight:600}}>Fuente</th>
                            <th style={{padding:'6px 8px',fontWeight:600}}>De dónde sale</th>
                            <th style={{padding:'6px 8px',fontWeight:600}}>Por qué</th>
                          </tr>
                        </thead>
                        <tbody>
                          {datosNecesarios.map((d,i)=>{
                            const ok=esDisponible(d);
                            const origenes=origenesDisponibles(d);
                            return(
                            <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                              <td style={{padding:'7px 8px',color:ok?C.green:C.txt}}>{ok?'✓ ':''}{d.dato}</td>
                              <td style={{padding:'7px 8px'}}><Tag color={d.prioridad==='Necesario'?'amber':'default'}>{d.prioridad}</Tag></td>
                              <td style={{padding:'7px 8px',color:C.txtMid}}>{d.fuente}</td>
                              <td style={{padding:'7px 8px',color:ok?C.green:C.txtDim}}>{ok?origenes.join(' · '):'Aún no subido'}</td>
                              <td style={{padding:'7px 8px',color:C.txtDim}}>{d.razon}</td>
                            </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    <p style={{...T.small,marginTop:'8px'}}>"De dónde sale" muestra TODO lo disponible de esa fuente — puede que solo una parte cubra exactamente ese dato. Se actualiza solo en cuanto subas algo nuevo.</p>

                    {/* Cómo sacar y subir de golpe lo que falte */}
                    {faltan.length>0&&(
                      <div style={{marginTop:'14px',border:`1px solid ${C.accent}`,borderRadius:'8px',padding:'12px 14px'}}>
                        <p style={{...T.label,marginBottom:'8px'}}>Cómo conseguir lo que falta, de una sola vez</p>
                        {instruccionesExtra?(
                          <pre style={{whiteSpace:'pre-wrap',fontFamily:'inherit',fontSize:'12px',color:C.txtMid,lineHeight:'1.7',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'6px',padding:'10px 12px',marginBottom:'10px'}}>{instruccionesExtra}</pre>
                        ):(
                          <p style={{...T.small,marginBottom:'10px'}}>GA4 → Explorar → Exploración en blanco → añade como dimensiones y métricas todo lo listado arriba como pendiente → Exportar CSV.</p>
                        )}
                        <CsvUploadSimple
                          label='Subir CSV con los datos que faltan'
                          hint='Una sola exportación que cubra todo lo marcado como pendiente arriba'
                          parsed={datosExtraCsv}
                          setter={setDatosExtraCsv}
                          refEl={refDatosExtra}
                        />
                        <p style={{...T.small,textAlign:'center',margin:'8px 0'}}>— o pega la tabla copiada directamente de GA4 —</p>
                        <PasteCsvBox parsed={datosExtraCsv} setter={setDatosExtraCsv}/>
                        {datosExtraCsv&&<p style={{...T.small,color:C.green,marginTop:'8px'}}>✓ {datosExtraCsv.rows.length} filas recibidas — se usarán como contexto adicional al generar los perfiles.</p>}
                      </div>
                    )}
                  </div>
                  );
                })()}
              </div>
            )}
          </Card>

          {/* CSV sesiones de la URL — protagonista, dato clave del test */}
          <Card style={{marginBottom:'12px',border:`1px solid ${C.accent}`}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
              <p style={T.h3}>Datos de comportamiento de esta página (GA4)</p>
              <Tag color='purple'>Clave para los perfiles</Tag>
            </div>
            <p style={{...T.body,marginBottom:'14px'}}>
              El dato más importante del test — de aquí sale cómo se comportan tus usuarios reales en esta página. Cada fila se convierte en un arquetipo con comportamiento anclado a esa URL.
            </p>

            {/* Tutorial desplegable — colapsado por defecto, así no carga la pantalla de golpe */}
            <TutorialGa4/>

            {/* Upload */}
            <CsvUploadSimple
              label='Subir CSV exportado de GA4'
              hint='Columnas: dispositivo, tipo_usuario, sesiones, tiempo_medio, tasa_rebote, eventos_sesion, pagina_salida, conversiones, cvr'
              parsed={csvRutas}
              setter={setCsvRutas}
              refEl={refCsvRutas}
            />
            <p style={{...T.small,textAlign:'center',margin:'8px 0'}}>— o pega la tabla copiada directamente de GA4 —</p>
            <PasteCsvBox parsed={csvRutas} setter={setCsvRutas}/>

            {csvRutas&&(()=>{const sum=csvSummary(csvRutas);if(!sum) return(
              <div style={{marginTop:'10px',padding:'10px 12px',background:C.greenDim,border:`1px solid rgba(0,212,170,0.2)`,borderRadius:'8px',fontSize:'12px',color:C.green,lineHeight:'1.6'}}>
                ✓ <strong>{csvRutas.rows.length} segmentos detectados.</strong>
              </div>
            );
            return(
              <div style={{marginTop:'12px'}}>
                {sum.sospechoso?(
                  <div style={{padding:'10px 12px',background:C.amberDim,border:`1px solid rgba(245,166,35,0.25)`,borderRadius:'8px',fontSize:'12px',color:C.amber,lineHeight:'1.6',marginBottom:'8px'}}>
                    ⚠️ Algunos valores no parecen correctos — revisa el formato de los datos pegados (puede que GA4 haya exportado con coma decimal y se haya interpretado mal).
                  </div>
                ):(
                  <div style={{padding:'8px 12px',background:C.greenDim,border:`1px solid rgba(0,212,170,0.2)`,borderRadius:'8px',fontSize:'12px',color:C.green,marginBottom:'8px'}}>
                    ✓ Datos leídos correctamente — {sum.segmentos} segmentos detectados
                  </div>
                )}
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px'}}>
                  <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px'}}>
                    <p style={T.label}>Sesiones</p>
                    <p style={{fontSize:'16px',fontWeight:700,color:C.txt,marginTop:'4px'}}>{Math.round(sum.totalSesiones).toLocaleString()}</p>
                  </div>
                  <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px'}}>
                    <p style={T.label}>CVR medio{csvRutas.cvrCalculado?' (calculado)':''}</p>
                    <p style={{fontSize:'16px',fontWeight:700,color:C.txt,marginTop:'4px'}}>{sum.cvrMedio!==null?sum.cvrMedio.toFixed(2)+'%':'—'}</p>
                  </div>
                  <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px'}}>
                    <p style={T.label}>% Rebote</p>
                    <p style={{fontSize:'16px',fontWeight:700,color:C.txt,marginTop:'4px'}}>{sum.reboteMedio!==null?sum.reboteMedio.toFixed(1)+'%':'—'}</p>
                  </div>
                </div>
                {csvRutas.cvrCalculado&&<p style={{...T.small,marginTop:'6px',color:C.txtDim}}>ℹ️ Tu CSV no traía columna de CVR — se ha calculado como transacciones / sesiones por fila.</p>}
                {Object.keys(sum.porDispositivo).length>0&&(
                  <div style={{marginTop:'8px',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'10px 12px'}}>
                    <p style={{...T.label,marginBottom:'6px'}}>Desglose por dispositivo</p>
                    {Object.entries(sum.porDispositivo).map(([d,ses])=>(
                      <div key={d} style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:C.txtMid,padding:'3px 0'}}>
                        <span style={{textTransform:'capitalize'}}>{d.includes('mobile')?'📱':d.includes('desktop')?'💻':'📟'} {d}</span>
                        <span style={{color:C.txt}}>{Math.round(ses).toLocaleString()} sesiones ({((ses/sum.totalSesiones)*100).toFixed(0)}%)</span>
                      </div>
                    ))}
                  </div>
                )}
                {sum.fechaMin&&sum.fechaMax&&<p style={{...T.small,marginTop:'6px'}}>📅 Período detectado: {sum.fechaMin} → {sum.fechaMax}</p>}
              </div>
            );})()}
          </Card>

          {/* Datos cualitativos — mapas de calor */}
          <Card style={{marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
              <p style={T.h3}>Mapas de calor</p>
              <Tag color='amber'>Opcional — enriquece mucho</Tag>
            </div>
            <p style={{...T.body,marginBottom:'14px'}}>Capturas de Hotjar, Microsoft Clarity o FullStory de esta página. La IA las interpretará para entender dónde hace clic y hasta dónde llega el usuario real.</p>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
              <ImgUpload label='🖱 Heatmap de clics' hint='Captura del mapa de clics de esta página' field='heatmapClics' state={pageImgs} setter={setPageImgs} refKey='refHeatClics'/>
              <ImgUpload label='↕ Mapa de scrolls' hint='Captura del scroll depth de esta página' field='heatmapScroll' state={pageImgs} setter={setPageImgs} refKey='refHeatScroll'/>
            </div>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={onCancel}>Cancelar</Btn>
              <Btn disabled={!url||!nombreTest} onClick={()=>setTsub(1)}>Continuar →</Btn>
            </div>
          </div>
        </div>
      )}

      {tsub===1&&(
        <div>
          <Card style={{marginBottom:'12px',padding:'16px 0 12px'}}>
            <div style={{padding:'0 18px',marginBottom:'10px'}}>
              <p style={T.h3}>Variantes a analizar</p>
            </div>
            <VarianteRowVWO badge='do' badgeColor={C.accent} label='Control' desc={varA} setDesc={setVarA}
              imgName={imgAName} setImgName={setImgAName} figma={figmaUrlA} setFigma={setFigmaUrlA} refEl={imgRefA}
              placeholder='Ej: Diseño actual — botón azul'/>
            <VarianteRowVWO badge='V1' badgeColor={C.green} label='Variación 1' desc={varB} setDesc={setVarB}
              imgName={imgBName} setImgName={setImgBName} figma={figmaUrl} setFigma={setFigmaUrl} refEl={imgRef}
              placeholder='Ej: Rediseño propuesto — CTA verde'/>
            <div style={{padding:'10px 18px 0'}}>
              <button disabled title='Próximamente — de momento el motor de simulación solo compara A/B'
                style={{width:'100%',background:'none',border:`1px dashed ${C.border}`,borderRadius:'8px',padding:'8px',color:C.txtDim,fontSize:'11px',cursor:'not-allowed'}}>
                + Agregar variación (próximamente)
              </button>
            </div>
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
              <p style={{...T.h3,flexShrink:0}}>Asignación de tráfico</p>
              <span style={{fontSize:'12px',color:C.accent,fontWeight:600}}>A {split}%</span>
              <input type='range' min='10' max='90' step='5' value={split} onChange={e=>setSplit(Number(e.target.value))} style={{flex:1,accentColor:C.accent}}/>
              <span style={{fontSize:'12px',color:C.green,fontWeight:600}}>B {100-split}%</span>
            </div>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(0)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
              <Btn disabled={!hip||!varA||!varB} onClick={()=>setTsub(2)}>Continuar →</Btn>
            </div>
          </div>
        </div>
      )}

      {tsub===2&&(
        <div>
          <Card style={{marginBottom:'12px',border:`1px solid ${C.accent}`}}>
            <p style={{...T.h3,marginBottom:'6px'}}>Detectar métricas principales</p>
            <p style={{...T.body,marginBottom:'12px'}}>La IA ya conoce tu hipótesis y las variantes — puede detectarte 1 métrica principal y 4 secundarias directamente. Siempre podrás cambiarlas después, una a una.</p>
            {(metricaP||metricasS.length>0)&&!confirmarRedetectar?(
              <Btn variant='ghost' onClick={()=>setConfirmarRedetectar(true)} disabled={recomendandoMetricas}>🔄 Detectar de nuevo con IA</Btn>
            ):confirmarRedetectar?(
              <div>
                <p style={{...T.small,color:C.amber,marginBottom:'8px'}}>⚠ Esto sustituirá la métrica principal y las secundarias que tienes ahora. Podrás volver a editarlas después.</p>
                <div style={{display:'flex',gap:'8px'}}>
                  <Btn onClick={()=>{setConfirmarRedetectar(false);recomendarMetricas();}} disabled={recomendandoMetricas}>{recomendandoMetricas?'Analizando hipótesis...':'✦ Sí, detectar de nuevo'}</Btn>
                  <Btn variant='ghost' onClick={()=>setConfirmarRedetectar(false)}>Cancelar</Btn>
                </div>
              </div>
            ):(
              <Btn onClick={recomendarMetricas} disabled={recomendandoMetricas}>{recomendandoMetricas?'Analizando hipótesis...':'✦ Detectar métricas principales'}</Btn>
            )}
            {errMetricas&&<p style={{color:C.red,fontSize:'12px',marginTop:'8px'}}>⚠ {errMetricas}</p>}
            {!metricaP&&!metricasS.length&&<p style={{...T.small,marginTop:'10px'}}>O bájate directamente a buscarlas tú mismo abajo.</p>}
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'4px'}}>Métrica principal <span style={{color:C.red}}>*</span></p>
            <p style={{...T.body,marginBottom:'12px'}}>La que decide qué variante gana. Busca entre las típicas o crea la tuya y explícala — así la IA sabe exactamente qué mirar.</p>
            {!metricaP?(
              <MetricPicker onAdd={m=>{setMetricaP(m.nombre);setMetricaPDesc(m.desc);setMetricaPDireccion(m.direccion);setMetricaPRazon('');setBaselineReal('');setBaselineFuente('');}} exclude={[]} confirmLabel='Usar como principal'/>
            ):(
              <div style={{border:`1px solid ${C.accent}`,borderRadius:'8px',padding:'12px 14px',background:C.accentDim}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'10px'}}>
                  <div>
                    <p style={{fontSize:'13px',fontWeight:700,color:C.txt}}>{metricaPDireccion==='decrease'?'↓':'↑'} {metricaP}</p>
                    {metricaPDesc&&<p style={{...T.small,marginTop:'4px'}}>{metricaPDesc}</p>}
                    {metricaPRazon&&<p style={{...T.small,marginTop:'4px',color:C.accent}}>✦ {metricaPRazon}</p>}
                  </div>
                  <button onClick={()=>{setMetricaP('');setMetricaPDesc('');setMetricaPRazon('');setBaselineReal('');setBaselineFuente('');}} style={{background:'none',border:'none',color:C.txtDim,cursor:'pointer',fontSize:'12px',flexShrink:0,whiteSpace:'nowrap'}}>✕ Cambiar</button>
                </div>
              </div>
            )}

            {/* Baseline real — esto es lo que ancla el Control simulado, no un CVR genérico */}
            {metricaP&&(
              <div style={{marginTop:'10px',border:`1px solid ${baselineReal?C.green:C.border}`,borderRadius:'8px',padding:'12px 14px'}}>
                <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}}>
                  <p style={T.label}>Baseline real de esta métrica</p>
                  <Tooltip title='Por qué importa' text='El Control simulado debe partir de aquí, no de un número inventado por la IA. Si el histórico real está al 54% y el Control sintético sale al 9%, la simulación no sirve — por eso lo detectamos y fijamos antes de generar nada.'/>
                </div>
                {baselineReal?(
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                      <input type='number' step='0.1' value={baselineReal} onChange={e=>setBaselineReal(e.target.value)}
                        style={{width:'90px',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'6px',padding:'6px 8px',color:C.txt,fontSize:'14px',fontWeight:700,outline:'none'}}/>
                      <span style={{color:C.txt,fontSize:'14px',fontWeight:700}}>%</span>
                      <span style={{color:C.green,fontSize:'12px'}}>✓ el Control se anclará aquí</span>
                    </div>
                    {baselineFuente&&<p style={{...T.small,marginTop:'6px'}}>Fuente: {baselineFuente}</p>}
                    <button onClick={detectarBaseline} disabled={detectandoBaseline} style={{marginTop:'6px',fontSize:'11px',color:C.txtDim,background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>
                      {detectandoBaseline?'Detectando...':'🔄 Redetectar'}
                    </button>
                  </div>
                ):(
                  <div>
                    <Btn variant='ghost' small onClick={detectarBaseline} disabled={detectandoBaseline}>{detectandoBaseline?'Detectando...':'🔍 Detectar baseline real en mis datos'}</Btn>
                    <span style={{margin:'0 8px',color:C.txtDim,fontSize:'11px'}}>o</span>
                    <input type='number' step='0.1' placeholder='Introducir a mano (%)' onBlur={e=>e.target.value&&setBaselineReal(e.target.value)}
                      style={{width:'150px',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'6px',padding:'6px 8px',color:C.txt,fontSize:'12px',outline:'none'}}/>
                  </div>
                )}
                {errBaseline&&<p style={{...T.small,color:C.amber,marginTop:'6px'}}>⚠ {errBaseline}</p>}
                {!baselineReal&&!errBaseline&&<p style={{...T.small,marginTop:'6px'}}>Sin baseline fijado, la IA podría inventar un punto de partida distinto del real — como pasó antes.</p>}
              </div>
            )}
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
              <p style={T.h3}>Métricas secundarias</p>
              <Tag color='default'>Opcional</Tag>
            </div>
            <p style={{...T.body,marginBottom:'12px'}}>Detectan efectos downstream, efectos negativos e impacto de negocio — no deciden el ganador. Añade las que quieras, una detrás de otra.</p>
            {metricasS.length>0&&(
              <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}}>
                {metricasS.map((m,i)=>(
                  <span key={m.nombre+i} onClick={()=>setMetricasS(prev=>prev.filter((_,idx)=>idx!==i))} style={{cursor:'pointer'}} title={m.desc||'Quitar'}>
                    <Tag color='purple'>{m.direccion==='decrease'?'↓':'↑'} {m.nombre} ✕</Tag>
                  </span>
                ))}
              </div>
            )}
            {addingSecondary?(
              <div>
                <MetricPicker
                  onAdd={m=>setMetricasS(prev=>prev.some(x=>x.nombre.toLowerCase()===m.nombre.toLowerCase())?prev:[...prev,m])}
                  exclude={[metricaP.toLowerCase(),...metricasS.map(m=>m.nombre.toLowerCase())]}
                  confirmLabel='+ Añadir a la lista'/>
                <button onClick={()=>setAddingSecondary(false)} style={{marginTop:'8px',fontSize:'11px',color:C.txtDim,background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>
                  ✓ Listo, ya tengo las que quería
                </button>
              </div>
            ):(
              <Btn variant='ghost' small onClick={()=>setAddingSecondary(true)}>+ Añadir métrica secundaria</Btn>
            )}
          </Card>

          <Card style={{marginBottom:'12px'}}>
            <label style={{...T.label,display:'block',marginBottom:'6px'}}>Tráfico aproximado de esta página / mes <Tag color='default'>Opcional</Tag></label>
            <input type='number' value={traficoMensual} onChange={e=>setTraficoMensual(e.target.value)} placeholder='Ej: 14500'
              style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'13px',outline:'none'}}/>
            <p style={{...T.small,marginTop:'3px'}}>Con este dato, el resultado te muestra una estimación de impacto real (usuarios y valor estimado), no solo el % simulado.</p>
          </Card>

          <div style={{display:'flex',justifyContent:'space-between',gap:'10px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(1)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
              <Btn disabled={!metricaP} onClick={()=>setTsub(3)}>Continuar →</Btn>
            </div>
          </div>
        </div>
      )}

      {tsub===3&&(
        <div>
          <SegmentPicker segDispositivo={segDispositivo} setSegDispositivo={setSegDispositivo}
            segTipo={segTipo} setSegTipo={setSegTipo} segCanal={segCanal} setSegCanal={setSegCanal}/>

          {csvRutas&&segDispositivo!=='todos'&&(()=>{
            const n=csvRutas.rows.filter(r=>matchDispositivo(r.dispositivo||r['Categoría de dispositivo'],segDispositivo)).length;
            return(
              <div style={{fontSize:'11px',color:C.green,marginTop:'-6px',marginBottom:'12px',paddingLeft:'2px'}}>
                ✓ Se usarán solo las filas <strong>{DISPOSITIVO_LABEL[segDispositivo]}</strong> del CSV ({n} filas)
              </div>
            );
          })()}

          {/* Resumen del segmento */}
          <div style={{background:'#0A0A18',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'12px 14px',marginBottom:'16px',fontSize:'12px',color:C.txtMid,lineHeight:'1.7'}}>
            {csvRutas
              ? <p style={{color:C.green}}>✓ La IA filtrará el CSV de sesiones por este segmento para anclar los perfiles a datos reales.</p>
              : <p style={{color:C.amber}}>⚠ Sin CSV de sesiones — la IA inferirá el comportamiento de este segmento a partir de los datos del proyecto.</p>
            }
          </div>

          <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(2)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
              <Btn onClick={()=>setTsub(4)}>Continuar →</Btn>
            </div>
          </div>
        </div>
      )}

      {tsub===4&&(
        <div>
          <Card style={{marginBottom:'12px'}}>
            <p style={{...T.h3,marginBottom:'8px'}}>Perfiles sintéticos</p>
            <p style={{...T.body,marginBottom:'14px'}}>Cada perfil combina psicología CRO real — motivaciones, objeciones, nivel de consciencia — con comportamiento anclado a los datos de sesión de esta URL.</p>

            <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'12px'}}>
              <Tag color='purple'>📱 {segDispositivo==='todos'?'Todos los dispositivos':DISPOSITIVO_LABEL[segDispositivo]}</Tag>
              <Tag color='purple'>👤 {segTipo==='todos'?'Todos los usuarios':segTipo}</Tag>
              {segCanal!=='todos'&&<Tag color='purple'>🔗 {segCanal}</Tag>}
              <button onClick={()=>setTsub(3)} style={{fontSize:'11px',color:C.txtDim,background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>cambiar segmento</button>
            </div>

            {/* Recomendación automática — basada en datos reales de esta URL, por orden de fiabilidad */}
            {(()=>{
              const csvSes = csvRutas ? (csvSummary(csvRutas)?.totalSesiones||0) : 0;
              const trafico = parseInt(traficoMensual)||csvSes||parseInt(project.kpis.trafico)||0;
              const fuente = parseInt(traficoMensual)?'el tráfico mensual que indicaste':csvSes?'las sesiones detectadas en el CSV de esta URL':project.kpis.trafico?'el tráfico general del proyecto':null;
              const recArquetipos = trafico<2000?6:trafico<10000?10:trafico<50000?15:trafico<100000?20:30;
              // Proporcional al tráfico real, no un tramo fijo — así 1.600 reales recomienda ~1.600, no 500
              const recSesiones = trafico>0 ? Math.round(Math.min(Math.max(trafico,200),20000)/50)*50 : 500;
              const razonArq = trafico<2000?'Tráfico bajo — cubre los patrones principales':trafico<10000?'Tráfico medio — representación suficiente de todos los patrones':trafico<50000?'Tráfico medio-alto — captura segmentos minoritarios':'Alto tráfico — alta diversidad de perfiles';
              const razonSes = trafico===0?'Añade el tráfico mensual en el paso "Métricas" o sube el CSV de esta URL para una recomendación precisa':`≈ tu tráfico real (${trafico.toLocaleString()}/mes) — ${fuente}`;
              if(nProfiles===10&&nSesiones===1000&&trafico>0){
                setTimeout(()=>{setNProfiles(recArquetipos);setNSesiones(recSesiones);},0);
              }
              const arquetiposDetectados=(project.archetypes||[]).filter(a=>a.poblacion>=3).sort((a,b)=>b.poblacion-a.poblacion).slice(0,recArquetipos);
              return(
                <div>
                  <div style={{background:'#0A1220',border:`1px solid ${C.accent}`,borderRadius:'10px',padding:'14px 16px',marginBottom:'10px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}}>
                      <span>✦</span>
                      <p style={{fontSize:'13px',fontWeight:600,color:C.accent}}>Configuración recomendada para esta URL</p>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:arquetiposDetectados.length?'14px':0}}>
                      <div style={{background:'#070713',borderRadius:'8px',padding:'10px 12px',textAlign:'center'}}>
                        <div style={{fontSize:'28px',fontWeight:700,color:C.white,marginBottom:'2px'}}>{recArquetipos}</div>
                        <div style={{fontSize:'11px',color:C.accent,fontWeight:600,marginBottom:'4px'}}>arquetipos</div>
                        <div style={{fontSize:'10px',color:C.txtDim,lineHeight:'1.5'}}>{razonArq}</div>
                      </div>
                      <div style={{background:'#070713',borderRadius:'8px',padding:'10px 12px',textAlign:'center'}}>
                        <div style={{fontSize:'28px',fontWeight:700,color:C.white,marginBottom:'2px'}}>{recSesiones.toLocaleString()}</div>
                        <div style={{fontSize:'11px',color:C.accent,fontWeight:600,marginBottom:'4px'}}>ejecuciones de simulación</div>
                        <div style={{fontSize:'10px',color:C.txtDim,lineHeight:'1.5'}}>{razonSes}</div>
                      </div>
                    </div>

                    {/* Qué tipos de arquetipo detecta, antes de generar nada */}
                    {arquetiposDetectados.length>0?(
                      <div>
                        <p style={{fontSize:'11px',color:C.txtMid,marginBottom:'8px'}}>Tipos que detecta a partir de tus datos, y que navegarán cada variante:</p>
                        <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
                          {arquetiposDetectados.map(a=>(
                            <Tag key={a.nombre} color='purple'>{a.nombre} · {a.poblacion}%</Tag>
                          ))}
                        </div>
                      </div>
                    ):(
                      <p style={{fontSize:'11px',color:C.amber,lineHeight:'1.5'}}>⚠ Este proyecto aún no tiene arquetipos calculados con datos reales — la IA estimará los tipos con criterio general del sector al generar los perfiles.</p>
                    )}

                    <p style={{fontSize:'10px',color:C.txtDim,marginTop:'10px',lineHeight:'1.5'}}>El número de ejecuciones es capacidad de simulación y cobertura de escenarios — no es un tamaño muestral real ni lo uses para justificar "significancia estadística". Más ejecuciones no dan más certeza, solo repiten más veces el mismo modelo.</p>
                  </div>

                  <button onClick={()=>setShowManual(v=>!v)}
                    style={{fontSize:'11px',color:C.txtDim,background:'none',border:'none',cursor:'pointer',textDecoration:'underline',marginBottom:'8px',display:'block'}}>
                    {showManual?'▲ Ocultar edición manual':'▼ Editar manualmente'}
                  </button>

                  {showManual&&(
                    <div style={{background:'#0A0A18',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'12px 14px',marginBottom:'8px'}}>
                      <Select label='Arquetipos maestros' value={nProfiles} onChange={v=>setNProfiles(Number(v))} options={[
                        {value:6,label:'6 arquetipos — mínimo viable'},
                        {value:10,label:'10 arquetipos — estándar'},
                        {value:15,label:'15 arquetipos — completo'},
                        {value:20,label:'20 arquetipos — representativo'},
                        {value:30,label:'30 arquetipos — alto detalle'},
                        {value:50,label:'50 arquetipos — máximo'},
                      ]}/>
                      <div style={{marginTop:'4px'}}>
                        <label style={{...T.label,display:'block',marginBottom:'6px'}}>
                          Sesiones a simular: <span style={{color:C.accent,fontWeight:700}}>{nSesiones.toLocaleString()}</span>
                        </label>
                        <input type='range' min='100' max='20000' step='100' value={nSesiones}
                          onChange={e=>setNSesiones(Number(e.target.value))}
                          style={{width:'100%',accentColor:C.accent,marginBottom:'4px'}}/>
                        <div style={{display:'flex',justifyContent:'space-between',fontSize:'10px',color:C.txtDim}}>
                          {['100','1k','2.5k','5k','10k','20k'].map(v=><span key={v}>{v}</span>)}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {errP&&<p style={{color:C.red,fontSize:'12px',marginTop:'8px'}}>⚠ {errP}</p>}
          </Card>

          {profiles&&(
            <div style={{marginBottom:'12px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}>
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                  <Tag color='green'>{profiles.arquetipos.length} arquetipos</Tag>
                  <Tag color='blue'>{profiles.total.toLocaleString()} sesiones</Tag>
                  <Tag color='amber'>{project.quality??0}% precisión</Tag>
                </div>
                <p style={{...T.small}}>Haz clic en un perfil para ver la ficha completa</p>
              </div>
              <div style={{background:'#0A0A18',border:`1px solid ${C.greenDim}`,borderRadius:'8px',padding:'9px 12px',marginBottom:'12px',fontSize:'12px',color:C.green,lineHeight:'1.6'}}>
                ✓ <strong>{profiles.arquetipos.length} arquetipos maestros</strong> clonados en <strong>{profiles.total.toLocaleString()} sesiones simuladas</strong>, con variación individual entre clones para no repetir el mismo perfil exacto.
              </div>

              {/* Validación: la distribución sintética debe parecerse a la real, si hay CSV para comparar */}
              {csvRutas&&(()=>{
                const sum=csvSummary(csvRutas);
                if(!sum||!Object.keys(sum.porDispositivo).length) return null;
                const totalReal=Object.values(sum.porDispositivo).reduce((s,v)=>s+v,0);
                const realPct={};
                Object.entries(sum.porDispositivo).forEach(([d,v])=>{realPct[d]=totalReal?(v/totalReal)*100:0;});
                const sintCount={};
                profiles.arquetipos.forEach(p=>{const d=(p.dispositivo||'otros').toLowerCase();sintCount[d]=(sintCount[d]||0)+1;});
                const totalSint=profiles.arquetipos.length;
                const dispositivos=[...new Set([...Object.keys(realPct),...Object.keys(sintCount)])];
                return(
                  <div style={{background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'12px 14px',marginBottom:'12px'}}>
                    <p style={{...T.label,marginBottom:'4px'}}>Antes de lanzar: ¿esta población se parece a tu tráfico real?</p>
                    <p style={{...T.small,marginBottom:'10px'}}>No es un test ya lanzado — es tu tráfico histórico real (del CSV que subiste) frente a los perfiles sintéticos que se acaban de generar, para comprobar que se parecen antes de simular nada.</p>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:'12px'}}>
                      <thead>
                        <tr style={{borderBottom:`1px solid ${C.border}`,color:C.txtDim,textAlign:'left'}}>
                          <th style={{padding:'4px 6px',fontWeight:600}}>Dispositivo</th>
                          <th style={{padding:'4px 6px',fontWeight:600}}>Tu tráfico real (CSV)</th>
                          <th style={{padding:'4px 6px',fontWeight:600}}>Perfiles generados</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dispositivos.map(d=>{
                          const rp=realPct[d]||0,sp=totalSint?(sintCount[d]||0)/totalSint*100:0;
                          const desviado=Math.abs(rp-sp)>8;
                          return(
                            <tr key={d} style={{borderBottom:`1px solid ${C.border}`}}>
                              <td style={{padding:'6px',color:C.txt,textTransform:'capitalize'}}>{d}</td>
                              <td style={{padding:'6px',color:C.txtMid}}>{rp.toFixed(1)}%</td>
                              <td style={{padding:'6px',color:desviado?C.amber:C.green,fontWeight:600}}>{sp.toFixed(1)}%{desviado?' ⚠':' ✓'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                    <p style={{...T.small,marginTop:'8px'}}>Si algún ⚠ se desvía mucho, los perfiles generados no están representando bien tu tráfico real — considera regenerar antes de lanzar.</p>
                  </div>
                );
              })()}
              <ProfileGrid profiles={profiles.arquetipos} sector={project.sector}/>
            </div>
          )}

          {errSim&&<p style={{color:C.red,fontSize:'12px',marginBottom:'8px'}}>⚠ {errSim}</p>}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'12px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(3)}>Atrás</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
              {!profiles?(
                <Btn onClick={generarPerfiles}>✓ Aceptar y generar perfiles</Btn>
              ):(
                <>
                  <Btn variant='ghost' onClick={()=>{setProfiles(null);generarPerfiles();}}>Regenerar</Btn>
                  <Btn variant='green' disabled={!hip||!varA||!varB||!metricaP} onClick={simular}>🚀 Lanzar test con estos usuarios</Btn>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {tsub===5&&!results&&(
        <Card style={{textAlign:'center',padding:'40px'}}>
          <p style={{fontSize:'28px',marginBottom:'10px'}}>◎</p>
          <p style={T.h3}>No hay resultados de simulación guardados aquí</p>
          <p style={{...T.body,marginTop:'6px',marginBottom:'16px'}}>Este borrador se guardó antes de tener resultados, o se perdieron al recargar. Vuelve al paso "Perfiles" y simula de nuevo.</p>
          <Btn onClick={()=>setTsub(4)}>← Volver a Perfiles</Btn>
        </Card>
      )}

      {tsub===5&&results&&(
        <div>
          <ReportBody project={project} test={{name:nombreTest,url,varA,varB,traficoMensual}} r={results}/>
          <div style={{display:'flex',justifyContent:'space-between',gap:'10px',marginTop:'8px'}}>
            <Btn variant='ghost' onClick={()=>setTsub(4)}>← Revisar / regenerar</Btn>
            <div style={{display:'flex',gap:'10px'}}>
              <Btn variant='ghost' onClick={handleSaveDraft} disabled={!nombreTest}>{draftSaved?'✓ Guardado':'💾 Guardar borrador'}</Btn>
              <Btn variant='green' onClick={handleSave}>Guardar en proyecto</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── REPORT VIEW ───────────────────────────────────────────────────────────
// Cuerpo del informe — compartido entre ReportView (test ya guardado) y el paso "Resultados"
// dentro de CreateTest (recién simulado, antes de guardar). Misma vista en los dos sitios.
function ReportBody({project,test,r}){
  const gB=r.ganador==='B';
  const [openSeg,setOpenSeg]=useState(null);
  const tipoTag={personalizacion:{color:'purple',label:'Personalización'},nuevo_test:{color:'blue',label:'Nuevo test A/B'}};
  const bajaConfianza=r.confianza!=null&&r.confianza<95;
  return(
    <div>
      {/* 1. GANADOR OFICIAL */}
      <div style={{background:bajaConfianza?'#1A140A':'#0A1A14',border:`1px solid ${bajaConfianza?'rgba(245,166,35,0.3)':'rgba(0,212,170,0.2)'}`,borderRadius:'12px',padding:'18px 20px',marginBottom:bajaConfianza?'8px':'16px',display:'flex',alignItems:'center',gap:'14px'}}>
        <span style={{fontSize:'28px'}}>{bajaConfianza?'⚠️':'🏆'}</span>
        <div style={{flex:1}}>
          <p style={{fontSize:'16px',fontWeight:700,color:bajaConfianza?C.amber:C.green,marginBottom:'3px'}}>Variante {r.ganador} gana{r.ganador==='B'&&test?.varB?` — ${test.varB}`:r.ganador==='A'&&test?.varA?` — ${test.varA}`:''}</p>
          <p style={{fontSize:'12px',color:bajaConfianza?'#8A6A2A':'#3A6A5A'}}>{r.confianza}% confianza estadística</p>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'28px',fontWeight:700,color:gB?C.green:C.red}}>{r.uplift_cvr>0?'+':''}{Number(r.uplift_cvr).toFixed(1)}%</div>
          <div style={{fontSize:'11px',color:'#3A5A4A'}}>uplift CVR</div>
        </div>
      </div>
      {bajaConfianza&&(
        <p style={{...T.small,color:C.amber,marginBottom:'16px'}}>⚠ Esta confianza está por debajo del umbral estándar del 95% — el uplift es positivo, pero la evidencia todavía no es suficiente para llamarlo "ganador" con seguridad. Trátalo como resultado prometedor, no concluyente.</p>
      )}
      <ResumenPrimarioCard r={r} traficoMensual={test?.traficoMensual} ticket={project.kpis.ticket}/>
      <MetricExplorer r={r} varAName={test?.varA} varBName={test?.varB} traficoMensual={test?.traficoMensual}/>

      {/* 2. LO DIFERENCIAL — desglose por arquetipo, algo que un test A/B real no te puede dar */}
      {r.segmentos&&r.segmentos.length>0&&(()=>{
        const pobs=r.segmentos.map(sg=>sg.poblacion).filter(p=>p!=null);
        const sumPob=pobs.length===r.segmentos.length?pobs.reduce((s,p)=>s+p,0):null;
        const resto=sumPob!=null?Math.max(0,Math.round(100-sumPob)):null;
        return(
        <div style={{marginBottom:'20px'}}>
          <h2 style={{...T.h2,marginBottom:'4px'}}>Cómo afecta a cada arquetipo</h2>
          <p style={{...T.small,marginBottom:'12px'}}>
            Esto es lo que un test A/B con tráfico real no te puede decir hasta tener volumen — aquí lo tienes desde el primer test. Se muestran los {r.segmentos.length} arquetipos donde A y B se comportan de forma distinta{sumPob!=null?` — juntos son el ${sumPob}% del tráfico simulado`:''}.
            {resto!=null&&resto>0?` El ${resto}% restante no mostró diferencias relevantes entre variantes, así que no cambia la decisión del ganador.`:''}
          </p>
          {r.segmentos.map(sg=>(
            <div key={sg.nombre} onClick={()=>setOpenSeg(openSeg===sg.nombre?null:sg.nombre)}
              style={{border:`1px solid ${C.border}`,borderRadius:'10px',padding:'12px 14px',marginBottom:'8px',cursor:sg.audiencias?.length?'pointer':'default'}}>
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <span style={{fontSize:'13px',fontWeight:600,color:C.txt,flex:1}}>{sg.nombre}</span>
                {sg.poblacion!=null&&<span style={{fontSize:'11px',color:C.txtDim}}>{sg.poblacion}% tráfico</span>}
                <span style={{fontSize:'12px',color:C.txtMid}}>{sg.resultado}</span>
                <Tag color={sg.resultado.toLowerCase().includes('b')?'green':'amber'}>{sg.diff_pct>0?'+':''}{sg.diff_pct}%</Tag>
                {sg.audiencias?.length>0&&<span style={{fontSize:'11px',color:C.txtDim}}>{openSeg===sg.nombre?'▲':'▼'}</span>}
              </div>
              {sg.razon&&<p style={{fontSize:'11px',color:C.txtDim,marginTop:'4px'}}>{sg.razon}</p>}
              {openSeg===sg.nombre&&sg.audiencias?.length>0&&(
                <div style={{marginTop:'10px',paddingTop:'10px',borderTop:`1px solid ${C.border}`}}>
                  <p style={{...T.small,marginBottom:'8px'}}>Audiencias con comportamiento distinto dentro de este arquetipo</p>
                  {sg.audiencias.map((au,i)=>(
                    <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',padding:'5px 0',fontSize:'12px'}}>
                      <span style={{color:C.txtDim,minWidth:'55px',textTransform:'capitalize'}}>{au.tipo}</span>
                      <span style={{flex:1,color:C.txt}}>{au.valor}</span>
                      <span style={{color:C.txtMid,fontSize:'11px'}}>{au.resultado}</span>
                      <Tag color={au.diff_pct>0?'green':'amber'}>{au.diff_pct>0?'+':''}{au.diff_pct}%</Tag>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
        );
      })()}

      {r.razones_abandono&&r.razones_abandono.length>0&&(
        <Card style={{marginBottom:'12px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Razones de abandono — Variante B</p>
          {r.razones_abandono.map((ra,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:C.accent,flexShrink:0,marginTop:'3px'}}>◆</span>{ra}
            </div>
          ))}
        </Card>
      )}
      {r.insights&&r.insights.length>0&&(
        <Card style={{marginBottom:'20px'}}>
          <p style={{...T.label,marginBottom:'10px'}}>Insights clave</p>
          {r.insights.map((ins,i)=>(
            <div key={i} style={{display:'flex',gap:'8px',padding:'6px 0',borderBottom:`1px solid ${C.border}`,fontSize:'13px',color:C.txtMid,lineHeight:'1.6'}}>
              <span style={{color:[C.green,C.amber,C.red,C.accent][i]||C.txtDim,flexShrink:0,marginTop:'3px'}}>◆</span>{ins}
            </div>
          ))}
        </Card>
      )}

      {/* 3. RECOMENDACIONES */}
      {(r.recomendacion_general||r.recomendaciones?.length>0)&&(
        <div>
          <h2 style={{...T.h2,marginBottom:'10px'}}>Recomendaciones</h2>
          {r.recomendacion_general&&(
            <div style={{background:'#0F0F2A',border:`1px solid rgba(108,99,255,0.2)`,borderRadius:'12px',padding:'16px 18px',display:'flex',gap:'12px',marginBottom:'12px'}}>
              <span style={{fontSize:'18px',flexShrink:0}}>✦</span>
              <div>
                <p style={{...T.h3,marginBottom:'4px'}}>Recomendación general</p>
                <p style={T.body}>{r.recomendacion_general||r.recomendacion}</p>
              </div>
            </div>
          )}
          {r.recomendaciones?.map((rec,i)=>(
            <Card key={i} style={{marginBottom:'8px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px',gap:'8px'}}>
                <p style={{...T.h3,flex:1}}>{rec.titulo}</p>
                <Tag color={tipoTag[rec.tipo]?.color||'default'}>{tipoTag[rec.tipo]?.label||rec.tipo}</Tag>
              </div>
              <p style={{...T.body,marginBottom:'8px'}}>{rec.accion}</p>
              <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
                {rec.kpi_afectado&&<p style={T.small}><b style={{color:C.txtMid,fontWeight:600}}>KPI:</b> {rec.kpi_afectado}</p>}
                {rec.retorno_esperado&&<p style={{...T.small,color:C.green}}><b style={{color:C.green,fontWeight:600}}>Retorno esperado:</b> {rec.retorno_esperado}</p>}
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function ReportView({project,test,results,onBack}){
  const r=results||PILOT_RESULTS[test?.id]||{};
  function copiar(){
    const txt=`REPORTE TEST A/B — SynthAB\n\nProyecto: ${project.name}\nURL: ${test?.url}\n\nGanador: Variante ${r.ganador}\nUplift CVR: ${r.uplift_cvr>0?'+':''}${Number(r.uplift_cvr).toFixed(1)}%\nConfianza: ${r.confianza}%\n\nRecomendación:\n${r.recomendacion_general||r.recomendacion||''}`;
    navigator.clipboard.writeText(txt).then(()=>alert('Copiado ✓'));
  }
  if(!r.ganador) return(
    <div className='fade' style={{padding:'28px 32px'}}>
      <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'20px'}}>← {project.name}</button>
      <Card style={{textAlign:'center',padding:'48px'}}>
        <p style={{fontSize:'32px',marginBottom:'12px'}}>◎</p>
        <p style={T.h3}>Test en curso — sin resultados todavía</p>
        <p style={{...T.body,marginTop:'6px'}}>Los resultados aparecerán aquí cuando la simulación esté completada.</p>
      </Card>
    </div>
  );
  return(
    <div className='fade' style={{padding:'28px 32px',maxWidth:'680px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <button onClick={onBack} style={{background:'none',border:'none',color:C.txtMid,cursor:'pointer',fontSize:'13px',marginBottom:'6px',display:'block'}}>← {project.name}</button>
          <h1 style={T.h1}>{test?.name||'Reporte'}</h1>
          <p style={{...T.mono,marginTop:'3px'}}>{test?.url}</p>
        </div>
        <Btn variant='ghost' onClick={copiar}>Copiar reporte</Btn>
      </div>
      <ReportBody project={project} test={test} r={r}/>
    </div>
  );
}

// ── API SCREEN ────────────────────────────────────────────────────────────
function ApiScreen({onReady}){
  const [key,setKey]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  async function verify(){
    setLoading(true);setErr('');
    try{await callClaude(key,[{role:'user',content:'di ok'}],'Di solo: ok');onReady(key);}
    catch(e){setErr('Clave inválida: '+e.message);}
    setLoading(false);
  }
  return(
    <div style={{maxWidth:'400px',margin:'0 auto',padding:'64px 20px'}}>
      <div style={{textAlign:'center',marginBottom:'32px'}}>
        <div style={{width:'52px',height:'52px',borderRadius:'13px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',margin:'0 auto 16px'}}>⬡</div>
        <h1 style={{...T.h1,textAlign:'center',marginBottom:'6px'}}>SynthAB</h1>
        <p style={{...T.body,textAlign:'center'}}>Tests A/B con usuarios sintéticos.<br/>Resultados en minutos, no semanas.</p>
      </div>
      <Card>
        <label style={{...T.label,display:'block',marginBottom:'6px'}}>API Key de Anthropic</label>
        <input type='password' value={key} onChange={e=>setKey(e.target.value)} placeholder='sk-ant-api03-...' onKeyDown={e=>e.key==='Enter'&&verify()}
          style={{width:'100%',background:'#070713',border:`1px solid ${C.border}`,borderRadius:'8px',padding:'9px 12px',color:C.txt,fontSize:'12px',fontFamily:'monospace',outline:'none',marginBottom:'8px'}}/>
        {err&&<p style={{color:C.red,fontSize:'12px',marginBottom:'8px'}}>{err}</p>}
        <p style={{...T.small}}>Consíguela en <a href='https://console.anthropic.com' target='_blank' style={{color:C.accent}}>console.anthropic.com</a> → API Keys</p>
      </Card>
      <button onClick={verify} disabled={key.length<20||loading}
        style={{width:'100%',marginTop:'12px',background:C.accent,color:'#fff',border:'none',borderRadius:'8px',padding:'12px',fontSize:'13px',fontWeight:600,cursor:key.length<20?'not-allowed':'pointer',opacity:key.length<20?0.4:1}}>
        {loading?'Verificando...':'Entrar →'}
      </button>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  render(){
    if(this.state.error) return(
      <div style={{padding:'40px',maxWidth:'520px',margin:'60px auto',textAlign:'center'}}>
        <p style={{fontSize:'32px',marginBottom:'12px'}}>⚠</p>
        <p style={{...T.h2,marginBottom:'8px'}}>Algo ha fallado al mostrar esta pantalla</p>
        <p style={{...T.body,marginBottom:'16px'}}>No se ha perdido ningún dato guardado — solo esta vista. Recarga la página para continuar.</p>
        <p style={{...T.small,marginBottom:'16px',fontFamily:'monospace'}}>{String(this.state.error?.message||this.state.error)}</p>
        <Btn onClick={()=>window.location.reload()}>Recargar</Btn>
      </div>
    );
    return this.props.children;
  }
}

function App(){
  const [apiKey,setApiKey]=useState('');
  const [nav,setNav]=useState('projects');
  const [projects,setProjects]=useState(()=>{
    try{
      const saved=localStorage.getItem('synthab_projects');
      if(saved) return JSON.parse(saved);
    }catch(e){ console.error('No se pudo leer localStorage:',e); }
    return [PILOT_PROJECT];
  });
  const [view,setView]=useState({screen:'list'});
  const [saveError,setSaveError]=useState(null);

  useEffect(()=>{
    try{ localStorage.setItem('synthab_projects', JSON.stringify(projects)); setSaveError(null); }
    catch(e){ console.error('No se pudo guardar en localStorage (¿cuota superada?):',e); setSaveError('No se ha podido guardar en este navegador — puede que el almacenamiento esté lleno (CSVs o imágenes muy grandes). Lo que ves en pantalla es correcto, pero se perderá si recargas.'); }
  },[projects]);

  if(!apiKey) return(
    <div style={{background:C.bg,minHeight:'100vh'}}>
      <div style={{borderBottom:`1px solid ${C.border}`,padding:'14px 28px',background:'#0A0A16',display:'flex',alignItems:'center',gap:'8px'}}>
        <div style={{width:'28px',height:'28px',borderRadius:'7px',background:C.accent,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px'}}>⬡</div>
        <span style={{fontSize:'14px',fontWeight:700,color:C.white}}>SynthAB</span>
      </div>
      <ApiScreen onReady={setApiKey}/>
    </div>
  );

  // Upsert: si el proyecto ya existe (por ejemplo, se guardó como borrador antes), lo actualiza
  // en vez de duplicarlo. addProject navega al detalle (guardado final); saveDraft no navega
  // (guardado intermedio mientras se sigue rellenando el formulario).
  function upsertProjects(prev,p){
    return prev.some(pr=>pr.id===p.id) ? prev.map(pr=>pr.id===p.id?p:pr) : [...prev,p];
  }
  function addProject(p){setProjects(prev=>upsertProjects(prev,p));setView({screen:'detail',project:p});}
  function saveDraft(p){setProjects(prev=>upsertProjects(prev,p));}
  function upsertTests(tests,t){
    return tests.some(x=>x.id===t.id) ? tests.map(x=>x.id===t.id?t:x) : [...tests,t];
  }
  function addTest(projectId,t){
    setProjects(prev=>prev.map(p=>p.id===projectId?{...p,tests:upsertTests(p.tests,t)}:p));
    const updatedProject=projects.find(p=>p.id===projectId);
    setView({screen:'detail',project:{...updatedProject,tests:upsertTests(updatedProject.tests,t)}});
  }
  function deleteTest(projectId,testId){
    setProjects(prev=>prev.map(p=>p.id===projectId?{...p,tests:p.tests.filter(t=>t.id!==testId)}:p));
  }
  // Guardar borrador: persiste el test a medias SIN navegar — el usuario se queda donde estaba,
  // el botón muestra "✓ Guardado" como confirmación. Solo "Cancelar" te saca del flujo.
  function saveTestDraft(projectId,t){
    setProjects(prev=>prev.map(p=>p.id===projectId?{...p,tests:upsertTests(p.tests,t)}:p));
  }

  const currentProject=view.project?projects.find(p=>p.id===view.project.id)||view.project:null;

  return(
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      <Sidebar active={nav} onNav={id=>{setNav(id);setView({screen:'list'});}} apiKey={apiKey} onLogout={()=>setApiKey('')}/>
      <div style={{flex:1,overflowY:'auto',minWidth:0}}>
        {saveError&&(
          <div style={{background:C.redDim,borderBottom:`1px solid ${C.red}`,padding:'10px 20px',display:'flex',alignItems:'center',gap:'10px',fontSize:'12px',color:C.red}}>
            <span>⚠</span><span style={{flex:1}}>{saveError}</span>
            <button onClick={()=>setSaveError(null)} style={{background:'none',border:'none',color:C.red,cursor:'pointer',fontSize:'14px'}}>✕</button>
          </div>
        )}
        {nav==='projects'&&(
          <>
            {view.screen==='list'&&<ProjectsList projects={projects} onSelect={p=>setView({screen:'detail',project:p})} onCreate={()=>setView({screen:'create'})}/>}
            {view.screen==='detail'&&currentProject&&<ProjectDetail project={currentProject} apiKey={apiKey} onUpdateProject={p=>setProjects(prev=>prev.map(pr=>pr.id===p.id?p:pr))} onBack={()=>setView({screen:'list'})} onEdit={()=>setView({screen:'edit',project:currentProject})} onNewTest={()=>setView({screen:'newtest',project:currentProject})} onViewTest={t=>setView(t.draft?{screen:'newtest',project:currentProject,testDraft:t}:{screen:'report',project:currentProject,test:t})} onDeleteTest={id=>deleteTest(currentProject.id,id)} onViewReport={()=>setView({screen:'report',project:currentProject,test:currentProject.tests[0]})}/>}
            {view.screen==='create'&&<CreateProject apiKey={apiKey} onSave={addProject} onSaveDraft={saveDraft} onCancel={()=>setView({screen:'list'})}/>}
            {view.screen==='edit'&&currentProject&&<CreateProject apiKey={apiKey} initial={currentProject} onSave={p=>{setProjects(prev=>prev.map(pr=>pr.id===p.id?p:pr));}} onSaveDraft={p=>{setProjects(prev=>prev.map(pr=>pr.id===p.id?p:pr));}} onCancel={()=>setView({screen:'detail',project:currentProject})}/>}
            {view.screen==='newtest'&&currentProject&&<CreateTest project={currentProject} apiKey={apiKey} initial={view.testDraft} onSave={t=>addTest(currentProject.id,t)} onSaveDraft={t=>saveTestDraft(currentProject.id,t)} onCancel={()=>setView({screen:'detail',project:currentProject})}/>}
            {view.screen==='report'&&currentProject&&<ReportView project={currentProject} test={view.test} results={view.test?.results} onBack={()=>setView({screen:'detail',project:currentProject})}/>}
          </>
        )}
        {nav==='reports'&&(
          <div className='fade' style={{padding:'28px 32px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Reportes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Resumen de todos los tests completados.</p>
            {projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>({...t,projectName:p.name}))).length===0
              ? <Card style={{textAlign:'center',padding:'48px',color:C.txtDim}}><p>No hay tests completados todavía.</p></Card>
              : projects.flatMap(p=>p.tests.filter(t=>t.status==='completado').map(t=>(
                <Card key={t.id} style={{marginBottom:'10px',cursor:'pointer'}} onClick={()=>{setNav('projects');setView({screen:'report',project:p,test:t});}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <Tag color='blue'>{p.name}</Tag>
                      <p style={{...T.h3,marginTop:'6px',marginBottom:'3px'}}>{t.name}</p>
                      <p style={{...T.mono,fontSize:'11px'}}>{t.url}</p>
                    </div>
                    {t.ganador&&<div style={{textAlign:'right'}}>
                      <div style={{fontSize:'20px',fontWeight:700,color:C.green}}>{t.uplift}</div>
                      <div style={T.small}>Variante {t.ganador}</div>
                    </div>}
                  </div>
                </Card>
              )))}
          </div>
        )}
        {nav==='settings'&&(
          <div className='fade' style={{padding:'28px 32px',maxWidth:'500px'}}>
            <h1 style={{...T.h1,marginBottom:'6px'}}>Ajustes</h1>
            <p style={{...T.body,marginBottom:'24px'}}>Configuración de la cuenta.</p>
            <Card>
              <p style={{...T.label,marginBottom:'10px'}}>Conexión API</p>
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
                <div style={{width:'8px',height:'8px',borderRadius:'50%',background:C.green}}/>
                <span style={{fontSize:'13px',color:C.green,fontWeight:600}}>Conectada</span>
              </div>
              <p style={{...T.mono,marginBottom:'12px'}}>{apiKey.slice(0,20)}...</p>
              <Btn variant='ghost' small onClick={()=>setApiKey('')}>Cambiar clave API</Btn>
            </Card>
            <Card style={{marginTop:'12px'}}>
              <p style={{...T.label,marginBottom:'10px'}}>Proyecto piloto</p>
              <p style={{...T.body,marginBottom:'10px'}}>El proyecto "Moda Urban" viene precargado con datos reales y un test completado para que puedas explorar la app.</p>
              <Tag color='green'>1 test completado</Tag>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErrorBoundary,null,React.createElement(App)));
</script>
</body>
